<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:#1b2230;font-family:'Public Sans'}
#sheet{width:1360px;padding:30px;display:flex;flex-direction:column;gap:34px;background:#1b2230}
.row{display:grid;grid-template-columns:900px 1fr;gap:30px;align-items:start}
.lab{font:500 15px 'JetBrains Mono';letter-spacing:2px;color:#9aa7bb;margin:0 0 10px}
.x{width:900px;background:#000;border-radius:14px;overflow:hidden;position:relative}
.x .pfp{position:absolute;left:24px;top:220px;width:150px;height:150px;border-radius:50%;border:5px solid #000;overflow:hidden}
.x .meta{padding:90px 24px 22px;color:#e7e9ea}
.x .meta b{font-size:24px;display:block}.x .meta span{color:#71767b;font-size:16px}
.x .meta p{margin:10px 0 0;font-size:16px}
.side{display:flex;flex-direction:column;gap:18px}
.card{background:#0b111b;border:1px solid #ffffff12;border-radius:14px;padding:16px}
.hdr{display:flex;align-items:center;gap:10px;color:#e9eef5;font:600 21px 'Unbounded';letter-spacing:-.5px}
.hdr nav{margin-left:auto;display:flex;gap:16px;font:500 14px 'Public Sans';color:#8a97ab}
.tok{display:flex;align-items:center;gap:12px;padding:8px 0;color:#e9eef5;font-size:15px}
.tok + .tok{border-top:1px solid #ffffff0d}
.tok small{color:#8a97ab;display:block;font-size:13px}
.tok .v{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.tok .v small{color:#2ee6c5}
.tabs{display:flex;gap:8px;align-items:center;background:#202837;border-radius:10px 10px 0 0;padding:8px 10px 0}
.tab{display:flex;align-items:center;gap:8px;background:#0b111b;color:#d6dde8;font-size:13px;padding:8px 12px;border-radius:8px 8px 0 0;width:220px}
svg text{font-family:'Unbounded'}
</style></head><body><div id="sheet"></div>
<script>
const INK='#e9eef5', MUTE='#7d8aa0', ORANGE='#ff7a3d';
let uid=0;
function defs(){const u=++uid;return {u,d:`<defs>
 <linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff7e6"/><stop offset=".55" stop-color="#2ee6c5"/><stop offset="1" stop-color="#0f9d8a"/></linearGradient>
 <radialGradient id="glow${u}" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#2ee6c5" stop-opacity=".22"/><stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/></radialGradient>
 <linearGradient id="tile${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a28"/><stop offset="1" stop-color="#0a0f18"/></linearGradient>
 <linearGradient id="line${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6c5" stop-opacity="0"/><stop offset=".25" stop-color="#2ee6c5" stop-opacity=".9"/><stop offset="1" stop-color="#9ff7e6"/></linearGradient>
</defs>`}}
// the three marks on a 100-unit grid; `g` is the gradient id, `mono` paints everything one flat colour
const MARKS={
 1:(g,mono)=>`<circle cx="36" cy="14" r="7.5" fill="none" stroke="${mono||`url(#${g})`}" stroke-width="7"/>
   <path d="M36 25 V60 a19 19 0 0 0 38 0 V44" fill="none" stroke="${mono||`url(#${g})`}" stroke-width="12" stroke-linecap="round"/>
   <path d="M60 50 L74 33 L88 50" fill="none" stroke="${mono||ORANGE}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`,
 2:(g,mono)=>`<path d="M22 16 H66 M22 16 V84 M22 50 H56" fill="none" stroke="${mono||`url(#${g})`}" stroke-width="13" stroke-linecap="round"/>
   <path d="M22 84 H60 a14 14 0 0 0 14 -14 V60" fill="none" stroke="${mono||`url(#${g})`}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M74 58 l-11 11" stroke="${mono||ORANGE}" stroke-width="10" stroke-linecap="round"/>`,
 3:(g,mono)=>`<circle cx="44" cy="54" r="28" fill="none" stroke="${mono||`url(#${g})`}" stroke-width="10"/>
   <path d="M44 6 V54 a14 14 0 0 0 28 0" fill="none" stroke="${mono||INK}" stroke-width="9" stroke-linecap="round"/>
   <path d="M72 54 V40" stroke="${mono||INK}" stroke-width="9" stroke-linecap="round"/>
   <path d="M63 46 L72 34 L81 46" fill="none" stroke="${mono||ORANGE}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`,
};
const NAMES={1:'1 · REBOUND HOOK',2:'2 · HOOK MONOGRAM',3:'3 · HOOKED COIN'};

const icon=(k,size,round)=>{const {u,d}=defs();return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${d}<rect width="100" height="100" rx="${round?50:22}" fill="url(#tile${u})"/><rect width="100" height="100" rx="${round?50:22}" fill="url(#glow${u})"/><g transform="translate(15 13) scale(.72)">${MARKS[k]('g'+u)}</g></svg>`};
const bare=(k,size)=>{const {u,d}=defs();return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${d}${MARKS[k]('g'+u)}</svg>`};
const tdefault=(k,size)=>{const {u,d}=defs();return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${d}<circle cx="50" cy="50" r="50" fill="#141c2a"/><circle cx="50" cy="50" r="48.5" fill="none" stroke="#ffffff14" stroke-width="1.5"/><g transform="translate(24 22) scale(.54)">${MARKS[k]('g'+u,'#3a4760')}</g></svg>`};
function banner(k){
  const {u,d}=defs();
  // a price line that runs up, dips into the hook's bend and bounces out of it
  const pts='M0 210 C 120 196 210 150 300 120 S 460 100 520 150 S 600 262 660 262 S 740 200 790 150 S 860 80 900 64';
  return `<svg viewBox="0 0 900 300" width="900" height="300">${d}
   <rect width="900" height="300" fill="#070b12"/>
   <g stroke="#ffffff08">${Array.from({length:8},(_,i)=>`<line x1="0" x2="900" y1="${i*40+20}" y2="${i*40+20}"/>`).join('')}${Array.from({length:23},(_,i)=>`<line y1="0" y2="300" x1="${i*40+10}" x2="${i*40+10}"/>`).join('')}</g>
   <ellipse cx="660" cy="230" rx="260" ry="160" fill="url(#glow${u})"/>
   <line x1="430" x2="900" y1="262" y2="262" stroke="${ORANGE}" stroke-opacity=".55" stroke-dasharray="6 7"/>
   <text x="895" y="282" text-anchor="end" style="font-family:'JetBrains Mono'" font-size="11" fill="${ORANGE}" fill-opacity=".8">BUYBACK</text>
   <path d="${pts}" fill="none" stroke="url(#line${u})" stroke-width="4" stroke-linecap="round"/>
   <circle cx="660" cy="262" r="7" fill="${ORANGE}"/><circle cx="660" cy="262" r="15" fill="none" stroke="${ORANGE}" stroke-opacity=".4" stroke-width="2"/>
   <g transform="translate(222 70) scale(.62)">${MARKS[k]('g'+u)}</g>
   <text x="290" y="112" font-size="44" font-weight="600" fill="${INK}" letter-spacing="-1.5">etherhook</text>
   <text x="292" y="146" style="font-family:'Public Sans'" font-weight="500" font-size="19" fill="#9aa7bb">Coins that buy their own dips.</text>
  </svg>`;
}
const s=document.getElementById('sheet');
for(const k of [1,2,3]){
  s.insertAdjacentHTML('beforeend',`<div><p class="lab">${NAMES[k]}</p><div class="row">
   <div class="x">${banner(k)}<div class="pfp">${icon(k,150,true)}</div>
     <div class="meta"><b>Etherhook</b><span>@etherhookfun</span><p>Launch coins on Ethereum that buy their own dips. Vault backing, buybacks and burns, built in.</p></div></div>
   <div class="side">
     <div class="tabs"><div class="tab">${icon(k,18,false)}Etherhook · Explore</div></div>
     <div class="card"><div class="hdr">${bare(k,34)}etherhook<nav><span>Explore</span><span>Launch</span><span>Docs</span></nav></div></div>
     <div class="card">
       <div class="tok">${tdefault(k,40)}<div>New coin<small>$NEW · no image yet</small></div><div class="v">$12.4k<small>+8.1%</small></div></div>
       <div class="tok">${icon(k,40,true)}<div>Etherhook<small>profile picture</small></div><div class="v">pfp<small>round crop</small></div></div>
       <div class="tok"><span style="display:flex;gap:10px">${icon(k,64,false)}${icon(k,32,false)}${icon(k,16,false)}</span><div class="v">app icon<small>64 · 32 · 16</small></div></div>
     </div>
   </div></div></div>`);
}
</script></body></html>
