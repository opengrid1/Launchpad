<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- Anypair mascot: "the pair", an orange blob and its violet partner holding hands -->
<defs>
  <path id="o" d="M44 30c-17 0-27 15-27 34 0 21 11 37 28 37s26-14 26-34c0-21-10-37-27-37z"/>
  <path id="v" d="M86 26c-14 0-22 12-22 28 0 17 9 30 23 30s21-12 21-28c0-17-8-30-22-30z"/>
</defs>
<g transform="rotate(-6 64 64)">
<!-- sticker edge -->
<g fill="#fbfbf9" stroke="#fbfbf9" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
  <use href="#v"/><use href="#o"/>
  <path d="M64 84c4 3 8 5 13 5M92 79c-3 5-7 8-13 10" fill="none" stroke-width="20"/>
</g>
<!-- violet partner -->
<use href="#v" fill="#7a4cff" stroke="#0d0e12" stroke-width="6"/>
<path fill="#a283ff" d="M76 37c4-5 10-7 15-5-6 2-10 6-12 11-1 3-4 3-4 0 0-2 0-4 1-6z"/>
<circle cx="80" cy="56" r="4.2" fill="#0d0e12"/><circle cx="96" cy="56" r="4.2" fill="#0d0e12"/>
<circle cx="81.4" cy="54.6" r="1.5" fill="#fff"/><circle cx="97.4" cy="54.6" r="1.5" fill="#fff"/>
<path d="M84 65c2.6 2 6 2 8.4 0" fill="none" stroke="#0d0e12" stroke-width="2.4" stroke-linecap="round"/>
<!-- orange one, in front -->
<use href="#o" fill="#ff5a1f" stroke="#0d0e12" stroke-width="6"/>
<path fill="#ff8c5c" d="M28 45c4-7 11-10 18-9-7 2-12 7-14 14-1 4-5 4-5 1 0-2 0-4 1-6z"/>
<circle cx="35" cy="64" r="5.6" fill="#0d0e12"/><circle cx="55" cy="64" r="5.6" fill="#0d0e12"/>
<circle cx="37" cy="62" r="2" fill="#fff"/><circle cx="57" cy="62" r="2" fill="#fff"/>
<ellipse cx="29" cy="74" rx="4.2" ry="2.6" fill="#ff9d7c"/><ellipse cx="61" cy="74" rx="4.2" ry="2.6" fill="#ff9d7c"/>
<path d="M39 74c3.6 3.4 8.6 3.4 12 0" fill="none" stroke="#0d0e12" stroke-width="3" stroke-linecap="round"/>
<!-- arms reaching across, hands held -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M64 84c4 3 8 5 13 5" stroke="#0d0e12" stroke-width="10"/>
  <path d="M92 79c-3 5-7 8-13 10" stroke="#0d0e12" stroke-width="10"/>
  <path d="M64 84c4 3 8 5 13 5" stroke="#ff5a1f" stroke-width="4.2"/>
  <path d="M92 79c-3 5-7 8-13 10" stroke="#7a4cff" stroke-width="4.2"/>
</g>
<circle cx="78" cy="89" r="5.6" fill="#0d0e12"/><circle cx="76.4" cy="89" r="2.4" fill="#ff5a1f"/><circle cx="79.8" cy="89" r="2.4" fill="#7a4cff"/>
</g>
</svg>
