<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 140 144" width="140" height="144">
<style>
  .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:64px 60px}
  .t1{animation:sway 2.6s ease-in-out infinite;transform-origin:41px 78px}
  .t2{animation:sway 2.9s ease-in-out -0.6s infinite;transform-origin:52px 82px}
  .t3{animation:sway 2.4s ease-in-out -1.1s infinite;transform-origin:65px 84px}
  .t4{animation:sway 2.8s ease-in-out -0.3s infinite;transform-origin:78px 82px}
  .t5{animation:sway 2.5s ease-in-out -0.9s infinite;transform-origin:88px 76px}
  .eye{animation:blink 4.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .drip{animation:drip 3.6s ease-in infinite;transform-origin:100px 94px}
  .shine{animation:shine 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-5px) rotate(-5deg)}}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes drip{0%,55%{transform:translateY(0) scale(.6);opacity:0}62%{transform:translateY(0) scale(1);opacity:1}92%{transform:translateY(26px) scale(1);opacity:1}100%{transform:translateY(30px) scale(.8);opacity:0}}
  @keyframes shine{0%,100%{opacity:.85}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.bob,.t1,.t2,.t3,.t4,.t5,.eye,.drip,.shine{animation:none}}
</style>
<g class="bob">
  <!-- sticker edge -->
  <g fill="none" stroke="#f3f5f9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path class="t1" d="M41 78c-2 8-9 10-7 20"/><path class="t2" d="M52 82c-1 9-5 13-2 24"/><path class="t3" d="M65 84c1 10-2 12 0 21"/><path class="t4" d="M78 82c2 8 7 10 7 19"/><path class="t5" d="M88 76c4 6 11 8 12 15"/>
  </g>
  <path fill="none" stroke="#f3f5f9" stroke-width="7" stroke-linejoin="round" d="M64 15c-24 0-36 18-35 44 0 9 2 15 4 19 4 6 12 8 31 8s27-2 31-8c3-5 5-11 5-19 1-26-12-44-36-44z"/>
  <!-- tentacle outlines -->
  <g fill="none" stroke="#14121a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path class="t1" d="M41 78c-2 8-9 10-7 20"/><path class="t2" d="M52 82c-1 9-5 13-2 24"/><path class="t3" d="M65 84c1 10-2 12 0 21"/><path class="t4" d="M78 82c2 8 7 10 7 19"/><path class="t5" d="M88 76c4 6 11 8 12 15"/>
  </g>
  <!-- body outline -->
  <path fill="#14121a" d="M64 15c-24 0-36 18-35 44 0 9 2 15 4 19 4 6 12 8 31 8s27-2 31-8c3-5 5-11 5-19 1-26-12-44-36-44z"/>
  <!-- tentacles -->
  <g fill="none" stroke="#ff4fa3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path class="t1" d="M41 78c-2 8-9 10-7 20"/><path class="t2" d="M52 82c-1 9-5 13-2 24"/><path class="t3" d="M65 84c1 10-2 12 0 21"/><path class="t4" d="M78 82c2 8 7 10 7 19"/><path class="t5" d="M88 76c4 6 11 8 12 15"/>
  </g>
  <!-- body -->
  <path fill="#ff4fa3" d="M64 20c-21 0-31 16-30 39 0 8 1.5 13 3.5 16 3.5 5 10 6.5 26.5 6.5S87 80 90.5 75c2.5-4 3.5-9 3.5-16 1-23-9-39-30-39z"/>
  <path class="shine" fill="#ff7cbb" d="M50 34c4-7 12-10 20-8-9 2-15 8-17 17-1 5-5 5-6 1-1-3 1-7 3-10z"/>
  <!-- eyes -->
  <g class="eye"><circle cx="52" cy="56" r="7.5" fill="#14121a"/><circle cx="54.5" cy="53.5" r="2.4" fill="#fff"/></g>
  <g class="eye"><circle cx="76" cy="55" r="5.5" fill="#14121a"/><circle cx="77.8" cy="53" r="1.7" fill="#fff"/></g>
  <!-- mouth -->
  <path d="M60 68c3 2.5 7 2.5 10-.5" fill="none" stroke="#14121a" stroke-width="3" stroke-linecap="round"/>
  <!-- ink drip -->
  <g class="drip"><path fill="#f3f5f9" stroke="#f3f5f9" stroke-width="7" stroke-linejoin="round" d="M100 94c2.5 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2.5-6 5-10z"/><path fill="#ff4fa3" stroke="#14121a" stroke-width="3" stroke-linejoin="round" d="M100 94c2.5 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2.5-6 5-10z"/></g>
</g>
</svg>
