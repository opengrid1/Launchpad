<title>Jeet Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Arcade cabinet app: marquee header, one screen per page (arena, coin, launch, armies, hall, wallet, how to play), bottom tab bar on phones. BNB yellow on black, one dark look on purpose. */
:root {
  --bg: #09090b; --panel: #121216; --panel-2: #1b1b21; --well: #050506; --line: #2b2b34; --line-2: #3b3b46;
  --fg: #f6f3e7; --fg-2: #bdbab0; --fg-3: #7d7c86;
  --bnb: #f3ba2f; --bnb-lo: #b98712; --ink: #161004;
  --hot: #ff3d6e; --cyan: #3fe0ff; --ok: #55ef8c;
  --a-nvda: #84c341; --a-tsla: #ff4a3d; --a-aapl: #c3c8cd; --a-spy: #4d8dff; --a-qqq: #a774ff; --a-baba: #ff8a1f; --a-googl: #ffd43a; --a-crcl: #2fd1d1;
  --marquee: "Bungee", "Arial Black", Impact, sans-serif;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --digits: "VT323", "Courier New", monospace;
  --body: "Chakra Petch", "Trebuchet MS", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--bnb); outline-offset: 2px; }
.px { font-family: var(--pixel); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.5; }
.dg { font-family: var(--digits); font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: var(--hot); } .muted { color: var(--fg-3); }

.free { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 9px 16px; background: var(--bnb); color: var(--ink); text-align: center; }
.free span:last-child { font-size: 13px; font-weight: 600; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(9,9,11,.93); backdrop-filter: blur(8px); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo .mark { width: 40px; height: 40px; flex: none; }
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none; }
.logo b i { font-style: normal; color: var(--hot); text-shadow: 3px 3px 0 #4a0016; }
.logo b { font-family: var(--marquee); font-weight: 400; font-size: 26px; line-height: 1; color: var(--bnb); text-shadow: 0 0 18px rgba(243,186,47,.45), 3px 3px 0 #5c3f00; }
.nav { display: flex; gap: 2px; margin-left: 4px; }
.nav a { padding: 8px 10px; color: var(--fg-2); text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px; white-space: nowrap; }
.nav a:hover { color: var(--bnb); }
.nav a.on { color: var(--bnb); background: var(--panel); }
.top .sp { flex: 1; }
.wallet { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid var(--line-2); border-radius: 8px; padding: 5px 10px; }
.wallet .dg { font-size: 22px; line-height: 1; color: var(--bnb); }
.coin-btn { font-family: var(--pixel); font-size: 9px; background: var(--bnb); color: var(--ink); border: 0; border-radius: 8px; padding: 11px 12px 9px; box-shadow: 0 4px 0 var(--bnb-lo); white-space: nowrap; }
.coin-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bnb-lo); }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* tab bar (phones) */
.tabs { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: rgba(9,9,11,.97); border-top: 2px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px; border-radius: 8px; text-decoration: none; color: var(--fg-3); font-family: var(--pixel); font-size: 7px; text-transform: uppercase; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a.on { color: var(--bnb); background: var(--panel); }

/* shared blocks */
.page { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-h p { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 60ch; }
h1.title, h2.title, h3.title { margin: 0; font-family: var(--marquee); font-weight: 400; line-height: 1; color: var(--fg); }
h1.title { font-size: clamp(30px, 5vw, 44px); }
h2.title, h3.title { font-size: 22px; }
.title i { font-style: normal; color: var(--bnb); }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.gold { border-color: var(--bnb); box-shadow: inset 0 0 60px -20px var(--army, var(--bnb)); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.coin-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "chart side" "main side"; gap: 14px; align-items: start; }
.coin-grid > .a-chart { grid-area: chart; } .coin-grid > .a-side { grid-area: side; } .coin-grid > .a-main { grid-area: main; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-2); text-decoration: none; font-weight: 700; font-size: 14px; }
.back:hover { color: var(--bnb); }
.sprite { flex: none; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-family: var(--marquee); font-size: 19px; color: #0b0b0d; background: var(--army); box-shadow: inset -3px -3px 0 rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.28); }
.sprite.lg { width: 64px; height: 64px; font-size: 32px; border-radius: 12px; }
.chip { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px; font-family: var(--pixel); font-size: 7.5px; color: #0b0b0d; background: var(--army); white-space: nowrap; text-decoration: none; }
.st { display: inline-flex; padding: 6px 7px 5px; border-radius: 4px; white-space: nowrap; }
.st.win { color: var(--ink); background: var(--bnb); }
.st.safe { color: var(--cyan); background: rgba(63,224,255,.12); }
.st.risk { color: var(--hot); background: rgba(255,61,110,.13); }
.st.ko { color: var(--fg-3); border: 2px dashed var(--line-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-block: 6px; border-bottom: 2px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--fg-2); font-size: 13.5px; }
.kv b { font-family: var(--digits); font-weight: 400; font-size: 21px; line-height: 1; text-align: right; }
.kv b.t { font-family: var(--body); font-size: 13.5px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .px { color: var(--fg-3); font-size: 7.5px; }
.tile b { display: block; font-family: var(--digits); font-weight: 400; font-size: 32px; line-height: 1; margin-top: 6px; overflow-wrap: anywhere; }
.big-btn { font-family: var(--pixel); font-size: 11px; border: 0; border-radius: 10px; padding: 16px 12px 14px; background: var(--bnb); color: var(--ink); box-shadow: 0 5px 0 var(--bnb-lo); line-height: 1.5; text-decoration: none; text-align: center; }
.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bnb-lo); }
.big-btn[disabled] { opacity: .45; cursor: not-allowed; }
.ghost-btn { font-family: var(--pixel); font-size: 8px; border: 2px solid var(--line-2); background: transparent; color: var(--fg-2); border-radius: 8px; padding: 9px 10px 7px; text-decoration: none; white-space: nowrap; }
.ghost-btn:hover { border-color: var(--bnb); color: var(--bnb); }
.hint { font-size: 12.5px; color: var(--fg-3); margin: 0; }
.empty { padding: 18px; color: var(--fg-3); text-align: center; }

.net { margin: 10px 0 0; color: var(--hot); font-size: 13px; min-height: 0; }
.net:empty { display: none; }
.keeper { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 34px; }
.ghost-btn.kp { border-color: var(--bnb); color: var(--bnb); }
.ghost-btn.kp[disabled] { border-color: var(--line-2); color: var(--fg-3); }
.wallet #wAddr { color: var(--fg-2); }
.row .score small { display: block; font-size: 15px; }

/* arena banner */
.banner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 18px 22px; border: 2px solid var(--bnb); border-radius: 14px; background: radial-gradient(120% 140% at 0% 50%, rgba(243,186,47,.16), transparent 55%), repeating-linear-gradient(135deg, rgba(243,186,47,.05) 0 10px, transparent 10px 20px), var(--panel); box-shadow: 0 0 40px -18px rgba(243,186,47,.6); }
.ban-mark { width: 116px; height: 116px; display: block; filter: drop-shadow(0 6px 18px rgba(243,186,47,.35)); }
.ban-copy { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ban-title { margin: 0; font-family: var(--marquee); font-weight: 400; font-size: clamp(38px, 6vw, 64px); line-height: .95; color: var(--bnb); text-shadow: 3px 3px 0 #b07800, 6px 6px 0 #161004; letter-spacing: .01em; }
.ban-title i { font-style: normal; color: var(--hot); text-shadow: 3px 3px 0 #a3123d, 6px 6px 0 #161004; }
.ban-tag { margin: 4px 0 0; font-family: var(--pixel); font-size: 11px; line-height: 1.6; color: var(--fg); text-transform: uppercase; }
.ban-sub { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 56ch; }
.ban-cta { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 200px; }
.ban-cta .ghost-btn { text-align: center; padding-block: 12px 10px; }

/* HUD */
.hud { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.screen { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.screen.hot { border-color: var(--bnb); box-shadow: 0 0 40px -12px rgba(243,186,47,.5); }
.hud-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.phase { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px 5px; border-radius: 6px; }
.phase.battle { background: rgba(255,61,110,.14); color: var(--hot); }
.phase.battle i { width: 7px; height: 7px; background: var(--hot); animation: blink 1s steps(2, start) infinite; }
.phase.launch { background: rgba(85,239,140,.13); color: var(--ok); }
.phase.merge { background: rgba(243,186,47,.15); color: var(--bnb); }
.round-no { font-family: var(--marquee); font-size: 22px; line-height: 1; }
.hud-h > .px { color: var(--fg-3); }
.clock { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.clock .big { font-family: var(--digits); font-size: clamp(76px, 13vw, 124px); line-height: .78; color: var(--bnb); text-shadow: 0 0 22px rgba(243,186,47,.5); }
.clock .what { color: var(--fg-2); max-width: 30ch; padding-bottom: 6px; }
.rail { display: grid; grid-template-columns: 15fr 45fr 30fr; gap: 4px; }
.rail div { height: 12px; background: var(--panel-2); position: relative; overflow: hidden; border-radius: 2px; }
.rail div::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.55) 6px 8px); }
.rail span { position: absolute; inset: 0; transform-origin: left; }
.rail .l span { background: var(--ok); } .rail .b span { background: var(--hot); } .rail .m span { background: var(--bnb); }
.rail-l { display: grid; grid-template-columns: 15fr 45fr 30fr; gap: 4px; color: var(--fg-3); margin-top: 7px; }
.rail-l em { font-style: normal; }
.sim { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.sim > .px { color: var(--fg-3); }
.speed { display: inline-flex; border: 2px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.speed button { background: transparent; border: 0; padding: 6px 9px; font-family: var(--pixel); font-size: 8px; color: var(--fg-3); }
.speed button.on { background: var(--panel-2); color: var(--bnb); }
.p1-tag { display: flex; justify-content: space-between; gap: 10px; color: var(--bnb); }
.crown { font-family: var(--pixel); font-size: 9px; color: var(--ink); background: var(--bnb); padding: 5px 7px 4px; border-radius: 4px; }
.p1-name { display: flex; align-items: center; gap: 14px; min-width: 0; text-decoration: none; }
.p1-name h2 { margin: 0; font-family: var(--marquee); font-weight: 400; font-size: clamp(28px, 4.4vw, 42px); line-height: .95; overflow-wrap: anywhere; text-shadow: 3px 3px 0 rgba(0,0,0,.6); }
.p1-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.p1-stats div { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.p1-stats .px { color: var(--fg-3); font-size: 7.5px; }
.p1-stats b { display: block; font-family: var(--digits); font-weight: 400; font-size: 30px; line-height: 1; margin-top: 5px; }

/* board */
.board { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.board-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 16px 18px 12px; }
.board-h > .px { color: var(--fg-3); }
.row { display: grid; grid-template-columns: 40px minmax(0, 1.4fr) minmax(0, 1.4fr) 100px 96px; gap: 14px; align-items: center; padding: 11px 18px; border-top: 2px solid var(--line); text-decoration: none; position: relative; }
a.row:hover { background: var(--panel-2); }
.row.mine { box-shadow: inset 4px 0 0 var(--bnb); }
.row.head { padding-block: 9px; }
.row.head span { color: var(--fg-3); }
.rank { font-family: var(--marquee); font-size: 22px; color: var(--fg-3); }
.row.first .rank { color: var(--bnb); text-shadow: 0 0 12px rgba(243,186,47,.6); }
.coin { display: flex; align-items: center; gap: 11px; min-width: 0; }
.coin .cn { min-width: 0; display: block; }
.coin b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coin small { display: flex; gap: 7px; align-items: center; color: var(--fg-3); font-size: 12px; margin-top: 3px; }
.hp { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hp-bar { height: 14px; background: var(--well); border: 2px solid var(--line-2); border-radius: 3px; position: relative; overflow: hidden; }
.hp-bar i { position: absolute; inset: 0 auto 0 0; background: var(--army); transition: width .45s steps(8, end); }
.hp-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.6) 9px 11px); }
.hp-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-3); }
.hp-l .dg { font-size: 19px; line-height: .8; color: var(--fg); }
.score b { display: block; font-family: var(--digits); font-weight: 400; font-size: 26px; line-height: .9; }
.score small { font-family: var(--digits); font-size: 17px; }
.status { justify-self: end; }
.row.ko { opacity: .6; }
.row.ko::after { content: "K.O."; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-6deg); font-family: var(--marquee); font-size: 30px; color: var(--hot); text-shadow: 2px 2px 0 #000; pointer-events: none; opacity: .85; }
.slot { padding: 14px 18px; border-top: 2px dashed var(--line); color: var(--fg-3); display: flex; align-items: center; gap: 10px; text-decoration: none; }
.slot .blink { color: var(--bnb); }
.armies { display: flex; flex-direction: column; gap: 9px; }
.army-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 70px; gap: 10px; align-items: center; text-decoration: none; }
.bar { height: 12px; background: var(--well); border-radius: 2px; overflow: hidden; border: 1px solid var(--line-2); }
.bar i { display: block; height: 100%; background: var(--army); transition: width .45s steps(8, end); }
.army-row .v { text-align: right; font-size: 19px; line-height: 1; }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; font-family: var(--digits); font-size: 18px; line-height: 1.05; color: var(--fg-2); }
.log b { color: var(--bnb); font-weight: 400; }
.log .combo { color: var(--hot); }

/* coin page */
.coin-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.coin-head h1 { margin: 0; font-family: var(--marquee); font-weight: 400; font-size: clamp(30px, 5vw, 46px); line-height: .95; overflow-wrap: anywhere; }
.coin-head .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.chart-card { padding: 14px 14px 10px; }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-inline: 4px; }
.chart-h b { font-family: var(--digits); font-weight: 400; font-size: 40px; line-height: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.legend i { width: 14px; height: 3px; background: var(--army); display: inline-block; }
.legend i.avg { background: transparent; border-top: 2px dashed var(--bnb); height: 0; }
.legend i.win { width: 12px; height: 10px; background: rgba(243,186,47,.16); border: 1px solid rgba(243,186,47,.4); }
canvas.chart { width: 100%; height: 260px; display: block; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--well); border-radius: 10px; }
.seg button { border: 0; background: transparent; height: 38px; border-radius: 7px; font-family: var(--pixel); font-size: 9px; color: var(--fg-3); }
.seg button.on { background: var(--ok); color: #04150a; }
.seg button.on.sell { background: var(--hot); color: #fff; }
.field { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line-2); border-radius: 10px; padding: 6px 12px; background: var(--well); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: var(--digits); font-size: 32px; color: var(--bnb); }
.field span { font-family: var(--pixel); font-size: 8px; color: var(--fg-3); }
.quick { display: flex; gap: 6px; }
.quick button { flex: 1; border: 2px solid var(--line-2); background: transparent; border-radius: 8px; padding: 4px 0; font-family: var(--digits); font-size: 19px; color: var(--fg-2); }
.quick button:hover { border-color: var(--bnb); color: var(--bnb); }
.est { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg-2); }
.est b { font-family: var(--digits); font-weight: 400; font-size: 20px; color: var(--fg); }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 2px solid var(--line); font-size: 13.5px; }
.li:last-child { border-bottom: 0; }
.li .dg { font-size: 19px; line-height: 1; }
.li .who { font-family: var(--digits); font-size: 18px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-b { font-family: var(--pixel); font-size: 7.5px; padding: 4px 5px 3px; border-radius: 3px; text-align: center; }
.side-b.b { background: rgba(85,239,140,.15); color: var(--ok); }
.side-b.s { background: rgba(255,61,110,.14); color: var(--hot); }
.outcome { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.outcome div { background: var(--panel-2); border-radius: 10px; padding: 12px; }
.outcome .px { font-size: 7.5px; }
.outcome p { margin: 6px 0 0; font-size: 13.5px; color: var(--fg-2); }

.ch-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ch-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ch-title .tk { font-size: 26px; color: var(--bnb); }
.coin-head .meta { margin-top: 0; }
.age { font-size: 12.5px; }
.desc { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 60ch; }
.ic { width: 14px; height: 14px; flex: none; }
.ca-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ca { display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; border: 2px solid var(--bnb); background: rgba(243,186,47,.08); color: var(--fg); border-radius: 10px; padding: 7px 12px; }
.ca .px { color: var(--bnb); }
.ca .dg { font-size: 20px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ca .addr-s { display: none; }
.ca .ic { color: var(--bnb); }
.ca:hover { background: rgba(243,186,47,.16); }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.lnk { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line-2); background: transparent; color: var(--fg-2); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 700; text-decoration: none; }
.lnk:hover { border-color: var(--bnb); color: var(--bnb); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--panel); border: 2px solid var(--line); border-radius: 14px; }
.stat { padding: 11px 14px; border-left: 2px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stat:first-child { border-left: 0; }
.stat .px { color: var(--fg-3); font-size: 7.5px; }
.stat b { font-family: var(--digits); font-weight: 400; font-size: 26px; line-height: 1; overflow-wrap: anywhere; }
.stat small { font-size: 12px; color: var(--fg-3); min-height: 1em; }
.ch-val { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ch-val #cChg { font-size: 20px; }
.chart-ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.seg.sm { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; }
.seg.sm button { height: 28px; padding: 0 9px; font-size: 7.5px; border-radius: 6px; }
.seg.sm button.on { background: var(--panel-2); color: var(--bnb); }
.chart-card .legend { padding: 4px 4px 0; }
.bal { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--fg-3); margin-bottom: -6px; }
.bal button { border: 0; background: transparent; color: var(--fg-2); font-size: 19px; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
.bal button:hover { color: var(--bnb); }
.sum { display: flex; flex-direction: column; }
.sum .kv { padding-block: 5px; }
.sum .kv b { font-size: 18px; }
.slip { display: inline-flex; gap: 4px; }
.slip button { border: 2px solid var(--line-2); background: transparent; color: var(--fg-3); border-radius: 6px; padding: 2px 6px; font-family: var(--digits); font-size: 16px; line-height: 1; }
.slip button.on { border-color: var(--bnb); color: var(--bnb); }
.kv-copy { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--fg); padding: 0; font-family: var(--digits); font-size: 18px; line-height: 1; }
.kv-copy:hover { color: var(--bnb); }
.kv .kv-copy { font-size: 19px; }
.act { padding: 0; gap: 0; overflow: hidden; }
.act-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.tabs-in { display: flex; gap: 4px; }
.tabs-in button { border: 0; background: transparent; color: var(--fg-3); font-family: var(--marquee); font-size: 18px; padding: 4px 8px; border-radius: 6px; }
.tabs-in button.on { color: var(--fg); background: var(--panel-2); }
.tabs-in button span { font-family: var(--digits); font-size: 18px; color: var(--bnb); }
.tbl.flat { border: 0; border-radius: 0; background: transparent; }
.tbl.flat table { min-width: 560px; }
.tbl.flat td, .tbl.flat th { padding: 8px 14px; }
.tbl.flat td.dg { font-size: 19px; }
.tbl.flat tr.tb td.r.dg:nth-child(3) { color: var(--ok); }
.tbl.flat tr.ts td.r.dg:nth-child(3) { color: var(--hot); }
.hl { display: flex; flex-direction: column; padding: 4px 16px 10px; }
.hrow { display: grid; grid-template-columns: 34px minmax(0, 1.3fr) minmax(0, 1fr) 70px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 2px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow .dg { font-size: 19px; line-height: 1; }
.hrow > .dg:last-child { text-align: right; }
.hrow .who { font-size: 13.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar { height: 8px; background: var(--well); border-radius: 2px; overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--army, var(--bnb)); }
.tag { font-size: 7px; color: var(--ink); background: var(--bnb); padding: 3px 4px 2px; border-radius: 3px; vertical-align: 2px; }
.lf textarea { border: 2px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--well); font-size: 15px; color: var(--fg); resize: vertical; min-width: 0; font-family: var(--body); }
.lf-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lf-row input { font-size: 14px; padding: 9px 10px; }

/* launch */
.launch-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.launch-side { position: sticky; top: 84px; }
.lf { gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; border-bottom: 2px solid var(--line); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-h .title { font-size: 20px; }
.sec-h .hint { text-align: right; }
.fighter small { font-size: 15px; color: var(--fg-3); line-height: 1; }
.fighter.on small { color: var(--army); }
.lf-id { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; align-items: start; }
.lf-fields { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.count { font-size: 16px; color: var(--fg-3); }
.logo-field { display: flex; flex-direction: column; gap: 6px; }
.logo-drop { width: 132px; height: 132px; border: 2px dashed var(--line-2); border-radius: 14px; background: var(--well); display: grid; place-items: center; cursor: pointer; overflow: hidden; position: relative; text-align: center; }
.logo-drop:hover, .logo-drop.over { border-color: var(--bnb); }
.logo-drop.bad { border-color: var(--hot); }
.logo-drop span#logoInner { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--fg-2); padding: 8px; }
.logo-drop small { font-size: 11px; color: var(--fg-3); line-height: 1.3; }
.logo-drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.logo-drop .chg { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(0,0,0,.72); color: var(--bnb); border-radius: 6px; padding: 5px 0 4px; }
.ic.big { width: 30px; height: 30px; color: var(--bnb); }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.logo-field:focus-within .logo-drop { outline: 2px solid var(--bnb); outline-offset: 2px; }
.tk-in { display: flex; align-items: center; border: 2px solid var(--line-2); border-radius: 10px; background: var(--well); padding-left: 12px; }
.tk-in:focus-within { border-color: var(--bnb); }
.tk-in .dg { font-size: 24px; color: var(--fg-3); }
.lf .tk-in input#lfTicker { border: 0; background: transparent; flex: 1; padding-left: 4px; outline: 0; }
.lf input.bad, .lf textarea.bad { border-color: var(--hot); }
.tk-in:has(input.bad) { border-color: var(--hot); }
.err { color: var(--hot); font-size: 12.5px; min-height: 0; }
.err:empty { display: none; }
.fb-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: center; }
.fb-row .field input { font-size: 28px; }
.fb-row .field.bad, .fb-row .field:has(input.bad) { border-color: var(--hot); }
.fb-row .quick button { font-size: 17px; padding: 6px 0; }
.lf .field input { border: 0; padding: 0; background: transparent; outline: 0; font-family: var(--digits); color: var(--bnb); }
.lf label.check { flex-direction: row; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--fg-2); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--bnb); flex: none; }
.done { background: rgba(85,239,140,.08); border: 2px solid rgba(85,239,140,.35); border-radius: 10px; padding: 12px 14px; }
.done p { margin: 6px 0 0; font-size: 13.5px; color: var(--fg-2); }
.done a { color: var(--bnb); }
.pv { display: flex; flex-direction: column; gap: 10px; background: var(--well); border-radius: 10px; padding: 14px; }
.pv-row { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pv-row .sprite.lg { width: 56px; height: 56px; font-size: 26px; overflow: hidden; }
.sprite img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.sprite:has(img) { box-shadow: none; background: var(--panel-2); }
.pv-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pv-main b { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-main .tk { color: var(--bnb); font-size: 20px; line-height: 1; }
.pv-main .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pv-link { font-size: 7px; color: var(--fg-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px 2px; }
.pv-desc { margin: 0; font-size: 13.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.kv.tot { border-bottom-color: var(--line-2); }
.kv.tot b { color: var(--bnb); }
.roster { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fighter { border: 2px solid var(--line-2); background: var(--well); border-radius: 10px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg-2); position: relative; }
.fighter .sprite { width: 58px; height: 40px; font-size: 11px; letter-spacing: -.02em; }
.fighter.on { border-color: var(--army); color: var(--fg); box-shadow: 0 0 0 2px var(--army), 0 0 22px -4px var(--army); }
.fighter.on::after { content: "P1"; position: absolute; top: 5px; right: 6px; font-family: var(--pixel); font-size: 7px; color: var(--army); }
.lf { display: flex; flex-direction: column; gap: 12px; }
.lf label { display: flex; flex-direction: column; gap: 6px; }
.lf label .px { color: var(--fg-3); }
.lf input { border: 2px solid var(--line-2); border-radius: 10px; padding: 11px 12px; background: var(--well); font-size: 16px; color: var(--fg); min-width: 0; }
.lf input#lfTicker { font-family: var(--digits); font-size: 24px; padding-block: 6px; text-transform: uppercase; color: var(--bnb); }
.card-preview { align-items: center; text-align: center; gap: 14px; padding-block: 26px; }
.card-preview .sprite { width: 96px; height: 96px; font-size: 48px; border-radius: 16px; }
.card-preview h3 { margin: 0; font-family: var(--marquee); font-weight: 400; font-size: 28px; line-height: 1; overflow-wrap: anywhere; }
.vs { font-family: var(--marquee); color: var(--hot); font-size: 20px; }

/* armies */
.army-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.army-card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; position: relative; overflow: hidden; }
.army-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--army); }
.army-card:hover { border-color: var(--army); }
.army-card h3 { margin: 4px 0 0; font-family: var(--marquee); font-weight: 400; font-size: 30px; line-height: 1; color: var(--army); }
.army-card p { margin: 0; color: var(--fg-2); font-size: 13px; }
.army-card .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.army-card .nums span { display: block; font-size: 7px; color: var(--fg-3); }
.army-card .nums b { font-family: var(--digits); font-weight: 400; font-size: 22px; line-height: 1; }

/* tables */
.tbl { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; min-width: 600px; }
.tbl th { text-align: left; padding: 11px 16px; border-bottom: 2px solid var(--line); color: var(--fg-3); font-weight: 400; }
.tbl td { padding: 11px 16px; border-bottom: 2px solid var(--line); font-size: 14px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl td.dg { font-size: 22px; }
.tbl a { text-decoration: none; }
.tbl a:hover b { color: var(--bnb); }

/* how */
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.level { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.level .px { color: var(--bnb); }
.level b { font-family: var(--marquee); font-weight: 400; font-size: 20px; }
.level p { margin: 0; color: var(--fg-2); font-size: 13.5px; }
.faq { display: flex; flex-direction: column; gap: 10px; }
.faq details { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.faq summary { cursor: pointer; font-weight: 700; }
.faq p { margin: 10px 0 0; color: var(--fg-2); max-width: 70ch; }

/* admin */
.adm-grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 14px; align-items: start; }
.af { display: flex; flex-direction: column; gap: 6px; }
.af input, .af textarea, .af-row > input { border: 2px solid var(--line-2); border-radius: 10px; padding: 9px 11px; background: var(--well); color: var(--fg); font: inherit; font-size: 14px; min-width: 0; }
.af-row { display: flex; gap: 8px; align-items: stretch; }
.af-row > input, .af-row .field { flex: 1; }
.af-row .field { padding: 2px 10px; }
.af-row .field input { font-size: 24px; border: 0; background: transparent; outline: 0; color: var(--bnb); font-family: var(--digits); min-width: 0; width: 100%; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns > * { flex: 1; }
.ghost-btn.sm { padding: 6px 8px 5px; font-size: 7.5px; }
.ghost-btn.danger, .ghost-btn.danger:hover { border-color: var(--hot); color: var(--hot); }
.ghost-btn[disabled] { opacity: .4; cursor: not-allowed; }
.danger-btn { background: var(--hot); color: #fff; box-shadow: 0 5px 0 #8a0f30; }
.tog { border: 2px solid var(--ok); background: rgba(85,239,140,.1); color: var(--ok); border-radius: 6px; padding: 4px 8px; font-family: var(--pixel); font-size: 7.5px; }
.tog.off { border-color: var(--line-2); background: transparent; color: var(--fg-3); }
.adm tr.sel td { background: var(--panel-2); }
.adm .tbl.flat table { min-width: 600px; }
.adm-log { max-height: 260px; font-size: 17px; }

/* docs */
.docs-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; padding: 14px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; }
.toc .px { color: var(--fg-3); padding: 0 8px 8px; }

.toc a:hover { color: var(--bnb); }
.toc a.on { color: var(--bnb); background: var(--panel-2); }
.doc { min-width: 0; display: flex; flex-direction: column; gap: 36px; max-width: 760px; }
.doc section { scroll-margin-top: 90px; display: flex; flex-direction: column; gap: 12px; }
.doc h2 { margin: 0; font-family: var(--marquee); font-weight: 400; font-size: 26px; line-height: 1.05; color: var(--fg); text-wrap: balance; }

.doc b { color: var(--fg); }
.doc ul, .doc ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.doc code { font-family: var(--digits); font-size: 18px; color: var(--bnb); background: var(--panel-2); padding: 0 5px; border-radius: 4px; }
.doc .tbl table { min-width: 520px; }
.doc .tbl td { color: var(--fg-2); vertical-align: top; }
.callout { border: 2px solid var(--bnb); background: rgba(243,186,47,.07); border-radius: 12px; padding: 12px 14px; color: var(--fg-2); font-size: 14.5px; line-height: 1.55; }
.formula { font-family: var(--digits); font-size: 22px; line-height: 1.25; color: var(--bnb); background: var(--well); border: 2px solid var(--line-2); border-radius: 10px; padding: 12px 16px; overflow-x: auto; }
.formula i { font-style: normal; color: var(--fg); }
.example { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.example .px { color: var(--cyan); }
.tl { display: flex; gap: 4px; }
.tl div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; min-width: 0; color: #0b0b0d; }
.tl b { font-family: var(--marquee); font-weight: 400; font-size: 16px; color: inherit; }
.tl span { font-family: var(--digits); font-size: 18px; line-height: 1; }
.tl .l { background: var(--ok); } .tl .b { background: var(--hot); color: #fff; } .tl .m { background: var(--bnb); }
.gl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 16px; }
.gl dt { font-weight: 700; color: var(--fg); }
.gl dd { margin: 0; color: var(--fg-2); }
.foot a { color: var(--fg-2); }

.foot { margin-top: 40px; padding-top: 18px; border-top: 2px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--fg-3); font-size: 12.5px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bnb); color: var(--ink); padding: 12px 16px 10px; border-radius: 10px; font-family: var(--pixel); font-size: 9px; line-height: 1.6; max-width: calc(100% - 32px); z-index: 70; box-shadow: 0 5px 0 var(--bnb-lo); text-align: center; }
.flash { animation: flash .9s steps(6, end); }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--bnb), 0 0 60px var(--bnb); } 100% { box-shadow: none; } }

  const safeImg = (u) => (typeof u === "string" && (/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u) || /^https:\/\/[^\s"'<>]+$/.test(u)) ? u : "");
  const face = (c) => (c?.meta?.image ? `<img src="${esc(c.meta.image)}" alt="">` : esc((c?.symbol || "?")[0]));

  // ---------------------------------------------------------------------
  // RPC + multicall (reads never need a wallet)
  // ---------------------------------------------------------------------
  let rpcIdx = 0;
  async function rpc(method, params) {
    let last;
    for (let k = 0; k < CFG.rpcs.length; k++) {
      const url = CFG.rpcs[(rpcIdx + k) % CFG.rpcs.length];
      try {
        const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error.message);
        rpcIdx = (rpcIdx + k) % CFG.rpcs.length;
        return j.result;
      } catch (e) { last = e; }
    }
    throw last;
  }
  async function mc(calls) {
    const out = [];
    for (let k = 0; k < calls.length; k += 120) {
      const chunk = calls.slice(k, k + 120);
      const data = I.mc.encodeFunctionData("aggregate3", [chunk.map((c) => ({ target: c[0], allowFailure: true, callData: c[1].encodeFunctionData(c[2], c[3] || []) }))]);
      const raw = await rpc("eth_call", [{ to: CFG.multicall, data }, "latest"]);
      const [res] = I.mc.decodeFunctionResult("aggregate3", raw);
      res.forEach((r, j) => {
        const c = chunk[j]; let v = null;
        if (r.success) { try { const d = c[1].decodeFunctionResult(c[2], r.returnData); v = d.length === 1 ? d[0] : d; } catch {} }
        out.push(v);
      });
    }
    return out;
  }
  const A = (f, a) => [CFG.arena, I.arena, f, a];

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  const S = {
    loaded: false, round: 0, paused: false, admin: "", owner: "", feeRecipient: "", tipBudget: 0n, tip: 0n, armies: [], bnbUsd: 0,
    list: [], coins: new Map(), rounds: new Map(), roundCoins: new Map(), user: "", userBnb: 0n, signer: null, txlog: [], pots: new Map(),
  };
  const roundStart = (r) => CFG.genesis + r * ROUND;
  const bellOf = (r) => roundStart(r) + BELL;
  const phaseOf = (r, t = nowS()) => (t < roundStart(r) + ENLIST ? "launch" : t < bellOf(r) ? "battle" : "merge");
  const curRound = () => Math.max(0, Math.floor((nowS() - CFG.genesis) / ROUND));

  function parseMeta(raw) {
    let m = {};
    try { if (raw && raw.trim().startsWith("{")) m = JSON.parse(raw); } catch {}
    const url = (v) => (typeof v === "string" && /^https:\/\/[^\s"'<>]+$/.test(v) ? v : "");
    return { image: safeImg(m.image), description: typeof m.description === "string" ? m.description.slice(0, 200) : "", x: url(m.x), tg: url(m.tg), web: url(m.web) };
  }

  // Derived numbers ------------------------------------------------------
  const sqrtUpper = Math.pow(1.0001, CFG.startTick / 2);
  const realSqrt = (c) => Number(c.sqrt) / 2 ** 96;
  const priceBnb = (c) => { if (!c.sqrt) return NaN; const r = realSqrt(c); return 1 / (r * r); };
  const supplyN = (c) => f18(c.supply ?? 10n ** 27n);
  const mcapBnb = (c) => priceBnb(c) * supplyN(c);
  const poolBnb = (c) => (c.liq && c.sqrt ? (Number(c.liq) * (1 / realSqrt(c) - 1 / sqrtUpper)) / 1e18 : 0);
  const poolCoins = (c) => (c.liq && c.sqrt ? (Number(c.liq) * realSqrt(c)) / 1e18 : 0);
  const toUsd = (b) => b * S.bnbUsd;
  const mcapFromTick = (c, tick) => supplyN(c) / Math.pow(1.0001, tick);

  /** Live score: the time-weighted average tick over the deciding window so far. */
  function score(c) {
    const p = c.pool;
    if (!p || !p.registered || c.tick == null) return { live: false, mcap: mcapBnb(c) };
    const bell = Number(p.bell), ws = bell - WINDOW, t = Math.min(nowS(), bell), last = Number(p.lastTime), tick = BigInt(c.tick);
    if (t <= ws) return { live: false, mcap: mcapBnb(c) };
    const cumNow = p.cum + tick * BigInt(Math.max(0, t - last));
    let cumStart;
    if (p.startTaken) cumStart = p.startCum;
    else if (last <= ws) cumStart = p.cum + tick * BigInt(ws - last);
    else cumStart = p.cum;
    const span = p.startTaken || last <= ws ? t - ws : t - last;
    if (span <= 0) return { live: true, mcap: mcapBnb(c) };
    const avg = Number(cumNow - cumStart) / span;
    return { live: true, mcap: mcapFromTick(c, avg), avgTick: avg };
  }

  // Quotes from the pool math (one position, constant liquidity in range).
  function quoteBuy(c, wei) {
    if (!c.liq || !c.sqrt || wei <= 0n) return { out: 0n, impact: 0 };
    const L = BigInt(c.liq), s = BigInt(c.sqrt), x = (wei * 98n) / 100n;
    const sNew = (L * Q96 * s) / (L * Q96 + x * s);
    const out = (L * (s - sNew)) / Q96;
    const r = Number(s) / Number(sNew);
    return { out, impact: (r * r - 1) * 100 };
  }
  function quoteSell(c, wei) {
    if (!c.liq || !c.sqrt || wei <= 0n) return { out: 0n, impact: 0 };
    const L = BigInt(c.liq), s = BigInt(c.sqrt);
    let sNew = s + (wei * Q96) / L;
    const sU = BigInt(Math.floor(sqrtUpper * 2 ** 48)) * 2n ** 48n;
    if (sNew > sU) sNew = sU;
    const gross = (L * (sNew - s) * Q96) / (s * sNew);
    const out = (gross * 98n) / 100n;
    const r = Number(sNew) / Number(s);
    return { out, impact: (1 - 1 / (r * r)) * 100 };
  }

  // ---------------------------------------------------------------------
  // Refresh from chain
  // ---------------------------------------------------------------------
  let refreshing = false, lastRefresh = 0;
  async function refresh(force) {
    if (refreshing && !force) return;
    refreshing = true;
    try {
      const head = await mc([A("currentRound"), A("launchesPaused"), A("admin"), A("owner"), A("feeRecipient"), A("tipBudget"), A("tip"), A("totalCoins"), A("armies"), [CFG.feed, I.feed, "latestRoundData"]]);
      S.round = Number(head[0] ?? curRound());
      S.paused = !!head[1]; S.admin = head[2] || ""; S.owner = head[3] || ""; S.feeRecipient = head[4] || ""; S.tipBudget = head[5] ?? 0n; S.tip = head[6] ?? 0n;
      const total = Number(head[7] ?? 0);
      if (head[8]) S.armies = head[8].map((a, id) => ({ id, stock: a.stock, enabled: a.enabled, name: a.name, token: `${a.name}B` }));
      if (head[9]) S.bnbUsd = Number(head[9][1]) / 1e8;

      // New coins: addresses + static info.
      if (total > S.list.length) {
        const idx = []; for (let i = S.list.length; i < total; i++) idx.push(A("allCoins", [i]));
        const addrs = (await mc(idx)).filter(Boolean);
        const st = await mc(addrs.flatMap((a) => [A("coins", [a]), [a, I.token, "name"], [a, I.token, "symbol"], [a, I.token, "metadataURI"], [a, I.token, "stock"]]));
        addrs.forEach((a, i) => {
          const [info, name, symbol, uri, stock] = st.slice(i * 5, i * 5 + 5);
          if (!info) return;
          S.coins.set(a.toLowerCase(), { addr: a, name: name || "?", symbol: symbol || "?", uriOwn: uri || "", meta: parseMeta(uri), creator: info.creator, round: Number(info.round), army: Number(info.army), launchedAt: Number(info.launchedAt), poolId: info.poolId, stock, pulled: info.pulled });
          S.list.push(a.toLowerCase());
        });
      }

      // Rounds near now + the hall.
      const r = S.round, wantRounds = [];
      for (let k = Math.max(0, r - 1); k <= r + 1; k++) wantRounds.push(k);
      for (let k = 0; k < r - 1; k++) { const R = S.rounds.get(k); if (!R || !R.finalized) wantRounds.push(k); }
      const rr = await mc(wantRounds.flatMap((k) => [A("rounds", [k]), A("roundCoins", [k])]));
      wantRounds.forEach((k, i) => {
        const R = rr[i * 2], list = rr[i * 2 + 1];
        if (R) S.rounds.set(k, { settled: R.settled, finalized: R.finalized, hits: Number(R.hits), lastHit: Number(R.lastHit), winner: R.winner, loot: R.loot, spent: R.spent, bought: R.bought });
        if (list) S.roundCoins.set(k, list.map((a) => a.toLowerCase()));
      });

      // Dynamic data for the coins that matter now.
      const active = new Set();
      for (let k = Math.max(0, r - 1); k <= r + 1; k++) (S.roundCoins.get(k) || []).forEach((a) => active.add(a));
      for (const [, R] of S.rounds) if (R.winner && R.winner !== E.ZeroAddress) active.add(R.winner.toLowerCase());
      if (route.p === "coin" && route.id) active.add(route.id.toLowerCase());
      if (route.p === "me" || route.p === "admin" || route.p === "hall") S.list.forEach((a) => active.add(a));
      const act = [...active].filter((a) => S.coins.has(a));
      const per = 7 + (S.user ? 2 : 0);
      const dyn = await mc(act.flatMap((a) => {
        const c = S.coins.get(a);
        const calls = [[CFG.clpm, I.clpm, "getSlot0", [c.poolId]], A("liquidityOf", [c.addr]), A("hidden", [c.addr]), A("metadataOverride", [c.addr]), [CFG.hook, I.hook, "pool", [c.poolId]], [c.addr, I.token, "totalSupply"], A("coins", [c.addr])];
        if (S.user) calls.push([c.addr, I.token, "balanceOf", [S.user]], [c.addr, I.token, "pendingRewards", [S.user]]);
        return calls;
      }));
      act.forEach((a, i) => {
        const c = S.coins.get(a), d = dyn.slice(i * per, i * per + per);
        if (d[0]) { c.sqrt = d[0][0]; c.tick = Number(d[0][1]); }
        c.liq = d[1] ?? c.liq; c.hidden = !!d[2];
        const ov = d[3]; c.meta = parseMeta(ov && ov.length ? ov : c.uriOwn);
        if (d[4]) c.pool = { bell: d[4].bell, status: Number(d[4].status), registered: d[4].registered, lastTime: d[4].lastTime, startTaken: d[4].startTaken, cum: d[4].cum, startCum: d[4].startCum };
        c.supply = d[5] ?? c.supply;
        if (d[6]) c.pulled = d[6].pulled;

      });

      if (route.p === "coin" && route.id) losers.push(route.id.toLowerCase());
      const uniq = [...new Set(losers)].filter((a) => S.coins.has(a));
      const pots = await mc(uniq.map((a) => [CFG.redeemer, I.redeemer, "pots", [S.coins.get(a).addr]]));
      uniq.forEach((a, i) => { if (pots[i]) S.pots.set(a, { winner: pots[i].winner, tokens: pots[i].tokens, bnb: pots[i].bnb, supply: pots[i].supply }); });

      if (S.user) S.userBnb = BigInt(await rpc("eth_getBalance", [S.user, "latest"]));

    } finally {
      refreshing = false;
    }
    header();
    if (!pressed) page?.update?.(route, true);
  }

  // ---------------------------------------------------------------------
  // Wallet
  // ---------------------------------------------------------------------
  async function ensureChain(eth) {
    const id = await eth.request({ method: "eth_chainId" });
    if (BigInt(id) === CFG.chainId) return;
    try { await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CFG.chainHex }] }); }
    catch (e) {
      if (e?.code === 4902) await eth.request({ method: "wallet_addEthereumChain", params: [{ chainId: CFG.chainHex, chainName: "BNB Smart Chain", nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 }, rpcUrls: ["https://bsc-dataseed.bnbchain.org"], blockExplorerUrls: ["https://bscscan.com"] }] });
      else throw e;
    }
  }
  async function connect(silent) {
    const eth = window.ethereum;
    if (!eth) { if (!silent) toast("No wallet found. Open this site in MetaMask, Trust, OKX or Binance Wallet."); return false; }
    try {
      const accounts = await eth.request({ method: silent ? "eth_accounts" : "eth_requestAccounts" });
      if (!accounts?.length) return false;
      if (!silent) await ensureChain(eth);
      S.user = E.getAddress(accounts[0]);
      S.bp = new E.BrowserProvider(eth);
      S.signer = null;
      if (!S.listening) {
        S.listening = true;
        eth.on?.("accountsChanged", (a) => { S.user = a?.[0] ? E.getAddress(a[0]) : ""; S.signer = null; refresh(true); });
        eth.on?.("chainChanged", () => { S.signer = null; header(); });
      }
      header(); refresh(true);
      return true;
    } catch (e) { if (!silent) toast(errMsg(e)); return false; }
  }
  async function signer() {
    if (!S.user && !(await connect())) return null;
    await ensureChain(window.ethereum);
    S.bp = new E.BrowserProvider(window.ethereum);
    S.signer = await S.bp.getSigner();
    return S.signer;
  }
  /** Send one transaction with toasts; refresh afterwards. */
  async function send(label, to, iface, fn, args, value) {
    try {
      const sg = await signer(); if (!sg) return null;
      toast(`${label}: confirm in your wallet`);
      const tx = await sg.sendTransaction({ to, data: iface.encodeFunctionData(fn, args), value: value ?? 0n });
      toast(`${label}: sent, waiting for BNB Chain`);
      const rc = await tx.wait();
      if (rc.status !== 1) throw new Error("Transaction failed on chain");
      S.txlog.unshift({ label, hash: tx.hash, at: nowS() });
      toast(`${label}: done`);
      refresh(true);
      return rc;
    } catch (e) { toast(errMsg(e)); return null; }
  }
  async function ensureAllowance(coin, spender, amount, label) {
    const allowRaw = await rpc("eth_call", [{ to: coin, data: I.token.encodeFunctionData("allowance", [S.user, spender]) }, "latest"]);
    const allow = I.token.decodeFunctionResult("allowance", allowRaw)[0];
    if (allow >= amount) return true;
    return !!(await send(label, coin, I.token, "approve", [spender, E.MaxUint256]));
  }

  function header() {

  // ---------------------------------------------------------------------

  function parse() {

  function go() {

    document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === route.p || (route.p === "coin" && a.dataset.nav === "arena") || (route.p === "army" && a.dataset.nav === "armies")));

  // ---------------------------------------------------------------------
  // Shared pieces
  // ---------------------------------------------------------------------
  const coinsOf = (r) => (S.roundCoins.get(r) || []).map((a) => S.coins.get(a)).filter(Boolean);
  function ranked(r) {
    const R = S.rounds.get(r);
    const list = coinsOf(r).map((c) => ({ c, s: score(c), out: c.pulled || (c.liq != null && c.liq === 0n && !(R?.winner?.toLowerCase() === c.addr.toLowerCase())) }));
    list.sort((a, b) => {
      if (R?.settled && R.winner) { const w = R.winner.toLowerCase(); if (a.c.addr.toLowerCase() === w) return -1; if (b.c.addr.toLowerCase() === w) return 1; }
      if (a.out !== b.out) return a.out ? 1 : -1;
      return b.s.mcap - a.s.mcap;
    });

  }
  function dueActions() {
    const out = [], t = nowS();

      const R = S.rounds.get(r); if (!R) continue;
      const n = (S.roundCoins.get(r) || []).length;
      if (!R.settled && n > 0 && t >= bellOf(r)) out.push({ kind: "settle", r, label: `Settle round ${r}` });

        out.push({ kind: "hit", r, label: `Merge hit ${R.hits + 1} of ${HITS}, round ${r}`, due });
      }

  function tipText() { return S.tip > 0n && S.tipBudget >= S.tip ? `pays you ${f18(S.tip)} BNB` : "no tip right now"; }

          const mine = coinsOf(r).filter((c) => c.army === a.id && !c.hidden), cap = mine.reduce((s, c) => s + toUsd(mcapBnb(c)), 0);
          return `<a class="army-card" href="#army-${a.name}" style="--army:${armyVar(a.name)}"><span class="px muted">${esc(ARMY_META[a.name]?.[1] || a.name)}</span><h3>${esc(a.name)}</h3>
            <div class="nums"><div><span class="px">Fighters</span><b>${mine.length}</b></div><div><span class="px">Power</span><b>${usd(cap)}</b></div><div><span class="px">Titles</span><b>${titles[a.name] || 0}</b></div></div>
            <p>${a.enabled ? (mine.length ? `Leading: ${esc(mine.sort((x, y) => mcapBnb(y) - mcapBnb(x))[0].name)}` : "No fighters this round") : "Closed to new launches"}</p></a>`;
        }).join("") || `<div class="empty">Loading armies…</div>`;
      },
    },

    docs: {
      mount: () => {
        const toc = DOCS.map(([id, t]) => `<a href="#docs-${id}" data-doc="${id}">${t}</a>`).join("");
        const armies = Object.entries(ARMY_META).map(([k, [v, nm]]) => `<tr><td><span class="chip" style="--army:var(${v})">${k}</span></td><td>${nm}</td><td class="dg">${k}B</td></tr>`).join("");
        return `<div class="page docs">
        <div class="page-h"><h1 class="title">The <i>docs</i></h1><p>Everything about how Jeet Wars works: rounds, launching, trading, the merge, redeeming and fees.</p></div>
        <div class="docs-grid">
          <nav class="toc" aria-label="Docs sections"><span class="px">On this page</span>${toc}</nav>
          <article class="doc">

          <section id="d-overview"><h2>Overview</h2>
            <p>Jeet Wars is a meme coin launchpad on BNB Chain where coins fight. Every 90 minutes up to 8 new coins enter a round. When the round ends, the coin with the highest average market cap wins, and the liquidity of every losing coin is used to buy the winner.</p>
            <p>Holders of a losing coin don't lose their bag to zero. They redeem it for their share of the winner. Hold the winner and you get pumped by everyone else's pool. Jeets get eaten.</p>
            <div class="callout"><b>Live on BNB Chain, in beta.</b> The contracts are verified on BscScan but not audited yet. Trade amounts you can afford to lose.</div>
          </section>

          <section id="d-round"><h2>How a round works</h2>
            <p>Every round runs on the same 90-minute clock, set in the contract. A new round starts as soon as the previous one ends.</p>
            <div class="tl" aria-hidden="true"><div class="l" style="flex:15"><b>Enlist</b><span>15 min</span></div><div class="b" style="flex:45"><b>Battle</b><span>45 min</span></div><div class="m" style="flex:30"><b>Merge</b><span>30 min</span></div></div>
            <div class="tbl"><table><thead><tr><th class="px">Phase</th><th class="px">Length</th><th class="px">What happens</th></tr></thead><tbody>
              <tr><td><b>Enlist</b></td><td class="dg">15 min</td><td>Coins launch into the round, up to 8. Trading is already open, but the score doesn't count yet.</td></tr>
              <tr><td><b>Battle</b></td><td class="dg">45 min</td><td>Open trading. The last 10 minutes are the deciding window: each coin's score is its average market cap over those 10 minutes.</td></tr>
              <tr><td><b>The bell</b></td><td class="dg">0 min</td><td>Trading on every coin in the round stops. Anyone can call <code>settle</code>, which reads the scores and names the winner. The winner reopens right away.</td></tr>
              <tr><td><b>Merge</b></td><td class="dg">30 min</td><td>The losers' pools are pulled and their BNB buys the winner in 10 buys, one every 3 minutes.</td></tr>
            </tbody></table></div>
            <p>A round with a single coin has no battle: that coin simply keeps trading. Coins launched while a round is in battle or merge go live and trade right away, and fight in the next round.</p>
          </section>

          <section id="d-launch"><h2>Launching a coin</h2>
            <ul>
              <li><b>Cost:</b> gas only, about 0.0002 BNB. No launch fee.</li>
              <li><b>Supply:</b> 1,000,000,000 tokens, all placed in the PancakeSwap pool at launch. No presale, no team allocation, no mint function.</li>
              <li><b>Army:</b> pick one of 8 stock armies. It decides which bStock your holders earn, and it can't be changed.</li>
              <li><b>Name, ticker, logo:</b> required and final. Tickers are unique across all of Jeet Wars.</li>
              <li><b>First buy:</b> optional, up to 0.5 BNB, made in the same transaction as the launch so no bot can buy before you.</li>
              <li><b>Creator share:</b> 0.7% of every trade on your coin, paid in BNB, for as long as it trades.</li>
            </ul>
          </section>

          <section id="d-trade"><h2>Trading</h2>
            <p>Every coin trades in its own PancakeSwap Infinity pool paired with BNB. You can trade on Jeet Wars, or on any bot, aggregator or terminal that routes through PancakeSwap Infinity pools.</p>
            <ul>
              <li><b>Fee:</b> 2% on every buy and sell, fixed forever. It's taken by the pool itself, so it applies wherever you trade.</li>
              <li><b>Slippage:</b> set it in the trade panel (0.5% to 5%). Meme pools move fast; small pools move faster.</li>
              <li><b>After the bell:</b> trading on a losing coin stays closed for good. Its holders redeem instead (see Redeeming).</li>
            </ul>
          </section>

          <section id="d-winner"><h2>How the winner is decided</h2>
            <p>Every coin has the same 1 billion supply, so market cap comes straight from the pool price. Each time someone trades, the pool records the price and how long it held. At the bell the contract takes the time-weighted average over the last 10 minutes of battle:</p>
            <div class="formula">score = average market cap from <i>bell − 10 min</i> to <i>bell</i></div>
            <p>The highest score wins. A single buy in the last second barely moves a 10-minute average, so a coin has to hold its level through the whole window. Prices are recorded before each trade in a block, so one transaction can't pump and dump to fake a score.</p>
            <p>If two coins tie exactly, the one that launched first wins.</p>
          </section>

          <section id="d-merge"><h2>The merge</h2>
            <ol>
              <li>Each losing coin's liquidity is removed from its pool. The BNB goes to the merge; the coins that were still in the pool are burned.</li>
              <li>That BNB buys the winner in <b>10 buys, one every 3 minutes</b>. Each buy has a price cap, so there is no single large order to sandwich.</li>
              <li>If a buy hits its cap, the unspent BNB rolls into the next buy. Anything still unspent after the 10th buy is paid out as BNB in the redemption.</li>
              <li>The bought winner tokens are held by the Redeemer contract for the losers' holders.</li>
            </ol>
            <p>Anyone can trigger each buy when it's due and receive a small tip for it, so the merge runs without anyone in charge.</p>
          </section>

          <section id="d-redeem"><h2>Redeeming a losing coin</h2>
            <p>Once all 10 buys are done, holders of each losing coin can redeem. Redeeming burns your losing coins and sends you your share of what that coin's BNB bought:</p>
            <div class="formula">you receive = <i>your coins</i> ÷ <i>all coins held outside the pool</i> × <i>winner tokens bought with that coin's BNB</i></div>
            <div class="example"><span class="px">Example</span>
              <p>$FROG loses. Its pool held 10 BNB, and 600M FROG were held by people. You hold 60M (10%). The merge spends those 10 BNB on 50M of the winner, $PUP. You redeem 60M FROG and receive 5M PUP.</p></div>
            <ul>
              <li>There is no deadline. Redeem whenever you like.</li>
              <li>Every holder of a coin redeems at the same rate, whenever they bought. Early buyers come out ahead; late buyers at the top get less than they paid.</li>
              <li>You end up holding the winner, which has just been bought by every loser's pool.</li>
            </ul>
          </section>

          <section id="d-armies"><h2>Armies and bStock rewards</h2>
            <p>Every coin fights under one of 8 armies. Holders earn 0.3% of every trade on their coin, paid in that army's bStock: tokenized US stocks issued by Binance on BNB Chain.</p>
            <div class="tbl"><table><thead><tr><th class="px">Army</th><th class="px">Stock</th><th class="px">Rewards paid in</th></tr></thead><tbody>${armies}</tbody></table></div>
            <p>Rewards build up from trading and are claimed from the coin page. Only official bStocks are accepted: they all share one Binance contract template, which the contract checks, so a lookalike token can't be added as an army.</p>
          </section>

          <section id="d-fees"><h2>Fees</h2>
            <div class="tbl"><table><thead><tr><th class="px">Part of the 2% fee</th><th class="px r">Share of each trade</th><th class="px">Paid in</th></tr></thead><tbody>
              <tr><td>Creator</td><td class="dg r">0.7%</td><td>BNB</td></tr>
              <tr><td>Holders</td><td class="dg r">0.3%</td><td>Army bStock</td></tr>
              <tr><td>Platform</td><td class="dg r">1.0%</td><td>BNB, funds keeper tips</td></tr>
              <tr><td><b>Total</b></td><td class="dg r"><b>2.0%</b></td><td>Fixed forever</td></tr>
            </tbody></table></div>
            <p>There is no function that can change the fee. Launching costs gas only, and redeeming costs gas only.</p>
          </section>

          <section id="d-contracts"><h2>Contracts</h2>
            <div class="tbl"><table><thead><tr><th class="px">Contract</th><th class="px">Job</th><th class="px">Address</th></tr></thead><tbody>
              <tr><td><b>Arena</b></td><td>Runs the rounds: launches, the clock, settling the winner and the merge.</td><td><a class="dg" href="https://bscscan.com/address/0x18B8ad90d4C767BdA953909b132311069C9CBA34#code" target="_blank" rel="noopener noreferrer">0x18B8…BA34</a></td></tr>
              <tr><td><b>Hook</b></td><td>Attached to every pool. Takes the 2% fee, records prices for the average, and closes losing pools.</td><td><a class="dg" href="https://bscscan.com/address/0x97c549177B98782aBe0b9335Ca8cab469cD263B4#code" target="_blank" rel="noopener noreferrer">0x97c5…63B4</a></td></tr>
              <tr><td><b>Token</b></td><td>Plain BEP-20 with a fixed supply. No tax, no mint, no blacklist.</td><td class="muted">One per coin</td></tr>
              <tr><td><b>Redeemer</b></td><td>Holds the winner tokens bought in the merge and pays out redemptions.</td><td><a class="dg" href="https://bscscan.com/address/0x82193432d7cB5F742acC8DCBDf8c658E21884C24#code" target="_blank" rel="noopener noreferrer">0x8219…4C24</a></td></tr>
              <tr><td><b>Router</b></td><td>Buys and sells coins with BNB, and turns rewards into bStocks through PancakeSwap V3.</td><td><a class="dg" href="https://bscscan.com/address/0x8fBB324880714747548C98C552db4C278BdB758b#code" target="_blank" rel="noopener noreferrer">0x8fBB…758b</a></td></tr>
            </tbody></table></div>
            <p>Every step of a round, from settling to each merge buy, can be called by anyone. Source code is verified on BscScan. Pools run on PancakeSwap Infinity (Vault <span class="dg">0x238a…e6c4</span>).</p>
          </section>

          <section id="d-risks"><h2>Risks</h2>
            <ul>
              <li><b>Meme coins are volatile.</b> Prices can drop to a fraction of what you paid within minutes.</li>
              <li><b>A losing coin can't be sold after the bell.</b> Its only exit is redeeming into the winner, and that can be worth less than you paid.</li>
              <li><b>The winner can be bought by whales.</b> The 10-minute average makes it expensive, not impossible.</li>
              <li><b>bStocks are issued by Binance.</b> They are upgradeable tokens and Binance controls them.</li>
              <li><b>Smart contract risk.</b> The contracts are new. Only put in what you can afford to lose.</li>
            </ul>
          </section>

          <section id="d-faq"><h2>FAQ</h2>
            <div class="faq">
              <details><summary>What's a jeet?</summary><p>Someone who sells the moment a coin moves. In Jeet Wars, people who hold the winner get paid by the pools of every other coin.</p></details>
              <details><summary>Can I trade on GMGN, Maestro or another bot?</summary><p>Yes, if the bot routes through PancakeSwap Infinity pools. The 2% fee and the round rules apply wherever the trade happens.</p></details>
              <details><summary>What if my coin wins?</summary><p>It keeps trading as a normal coin, with a pool that just absorbed every loser and a crowd of new holders from the redemptions.</p></details>
              <details><summary>When can I redeem?</summary><p>Right after the 10th merge buy, about 30 minutes after the bell. There's no deadline.</p></details>
              <details><summary>Can I launch outside the enlisting window?</summary><p>Yes. Your coin goes live and trades right away, and fights in the next round.</p></details>
              <details><summary>Who decides the winner?</summary><p>The contract, from the pool prices. Nobody can pick or change the winner.</p></details>
            </div>
          </section>

          <section id="d-glossary"><h2>Glossary</h2>
            <dl class="gl">
              <dt>Army</dt><dd>The stock a coin fights under. Decides its holders' bStock rewards.</dd>
              <dt>Bell</dt><dd>The end of the battle phase. Scores are fixed and losing pools close.</dd>
              <dt>Deciding window</dt><dd>The last 10 minutes of battle, used for the average market cap.</dd>
              <dt>Merge</dt><dd>The 30 minutes after the bell when the losers' BNB buys the winner.</dd>
              <dt>Redeem</dt><dd>Swapping a losing coin for your share of the winner.</dd>
              <dt>bStock</dt><dd>A tokenized US stock issued by Binance on BNB Chain, such as NVDAB.</dd>
            </dl>
          </section>
          </article>
        </div></div>`;
      },
      wire(r) {
        const go = (id) => { const el = document.getElementById("d-" + id); if (el) el.scrollIntoView({ block: "start" }); };
        if (r.id) setTimeout(() => go(r.id), 0);

        const spy = () => { let cur = secs[0]; for (const s of secs) if (s && s.getBoundingClientRect().top < 140) cur = s; links.forEach((a) => a.classList.toggle("on", "d-" + a.dataset.doc === cur?.id)); };
        removeEventListener("scroll", this.spy || (() => {})); this.spy = spy; addEventListener("scroll", spy, { passive: true }); spy();
      },
    },
  };

  // ---------------------------------------------------------------------
  // GeckoTerminal (trades + candles), cached
  // ---------------------------------------------------------------------
  const gtCache = new Map();
  async function gt(path) {
    const hit = gtCache.get(path);
    if (hit && Date.now() - hit.at < 20_000) return hit.v;
    try {
      const r = await fetch(`https://api.geckoterminal.com/api/v2${path}`, { headers: { accept: "application/json" } });
      if (!r.ok) throw new Error(r.status);
      const v = await r.json(); gtCache.set(path, { at: Date.now(), v }); return v;
    } catch { return hit?.v ?? null; }
  }

  // ---------------------------------------------------------------------
  // Chart
  // ---------------------------------------------------------------------
  function drawChart(cv, pts, fmt, colVar) {
    if (!cv) return;
    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    cv.width = w * dpr; cv.height = h * dpr;
    const x = cv.getContext("2d"); x.scale(dpr, dpr);
    x.clearRect(0, 0, w, h);
    const fg3 = css("--fg-3"), grid = css("--line"), col = colVar.startsWith("var(") ? css(colVar.slice(4, -1)) : colVar;
    x.font = `16px VT323, monospace`;
    if (pts.length < 2) { x.fillStyle = fg3; x.fillText("No trades to chart yet", 12, h / 2); return; }
    const padL = 8, padR = 84, padT = 10, padB = 18;
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
    const vs = pts.map((p) => p.v), lo = Math.min(...vs) * 0.96, hi = Math.max(...vs) * 1.04 || 1;
    const X = (tt) => padL + ((tt - t0) / Math.max(1, t1 - t0)) * (w - padL - padR);
    const Y = (v) => padT + (1 - (v - lo) / (hi - lo || 1)) * (h - padT - padB);
    x.fillStyle = fg3; x.strokeStyle = grid; x.lineWidth = 1;
    for (let i = 0; i <= 3; i++) { const v = lo + ((hi - lo) * i) / 3, y = Y(v); x.beginPath(); x.moveTo(padL, y); x.lineTo(w - padR + 4, y); x.stroke(); x.fillText(fmt(v), w - padR + 8, y + 5); }
    x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(X(p.t), Y(p.v)) : x.moveTo(X(p.t), Y(p.v))));
    x.strokeStyle = col; x.lineWidth = 2; x.stroke();
    x.lineTo(X(t1), h - padB); x.lineTo(X(t0), h - padB); x.closePath(); x.globalAlpha = 0.12; x.fillStyle = col; x.fill(); x.globalAlpha = 1;
    const lp = pts[pts.length - 1]; x.fillStyle = col; x.fillRect(X(lp.t) - 3, Y(lp.v) - 3, 6, 6);
  }

  // ---------------------------------------------------------------------
  // Shell
  // ---------------------------------------------------------------------
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d"); const s = Math.min(bmp.width, bmp.height);
    x.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 128, 128);
    for (const q of [0.82, 0.7, 0.55, 0.4]) {
      let u = c.toDataURL("image/webp", q);
      if (!u.startsWith("data:image/webp")) u = c.toDataURL("image/jpeg", q);
      if (u.length <= 12_000) return u;
    }
    c.width = c.height = 96; x.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 96, 96);
    return c.toDataURL("image/jpeg", 0.5);
  }
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 4000); }
  function copyText(text, msg) {
    const done = () => toast(msg);
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback() { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch { toast("Copy failed. Long-press to copy."); } ta.remove(); }
  }
  document.addEventListener("click", (e) => { const cp = e.target.closest("[data-copy]"); if (cp) copyText(cp.dataset.copy, cp.dataset.copy.length > 50 ? "Copied" : "Address copied"); });
  $("connect").addEventListener("click", () => connect());
  window.addEventListener("hashchange", go);
  window.addEventListener("resize", () => page?.update?.(route, true));

  let pressed = false;
  addEventListener("pointerdown", () => (pressed = true), true);
  for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => setTimeout(() => (pressed = false), 0), true);

  const BANNER_MARK = document.querySelector(".logo .mark")?.outerHTML.replace('class="mark"', 'class="ban-mark"').replace(/id="([a-z])hdr"/g, 'id="$1ban"').replace(/url\(#([a-z])hdr\)/g, "url(#$1ban)") || "";

  go();
  connect(true);
  refresh(true);
  setInterval(() => refresh(), 8000);
  setInterval(() => { if (!pressed) page?.update?.(route, false); }, 1000);
})();
