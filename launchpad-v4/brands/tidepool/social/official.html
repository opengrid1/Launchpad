<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#f3f5f2;color:#0d2522}
.art{position:absolute;inset:-10px;background:url('../img/etch-forum.webp') center 55%/cover no-repeat;opacity:.5}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 46% 62% at 50% 50%,rgba(243,245,242,.97) 0%,rgba(243,245,242,.9) 45%,rgba(243,245,242,.35) 80%,rgba(243,245,242,.15) 100%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.c img{width:300px;height:300px;filter:drop-shadow(0 24px 40px rgba(13,37,34,.28))}
.eye{margin-top:40px;font:500 18px 'Geist Mono',monospace;letter-spacing:.34em;text-transform:uppercase;color:#2f4744;display:flex;align-items:center;gap:20px}
.eye:before,.eye:after{content:'';width:56px;height:1px;background:#2f4744;opacity:.55}
h1{font:400 150px/1 'Instrument Serif',serif;margin:14px 0 0;letter-spacing:-.01em}
h1 em{color:#17a589;font-style:normal}
</style></head><body><div class="art"></div><div class="veil"></div>
<div class="c"><img src="../img/mark.svg"><div class="eye">The official token</div><h1><em>$</em>KINEX</h1></div>
</body></html>
