<style>
:root{--rail:56px;--ticker:48px;--bg:#080b0d;--s1:#111619;--s2:#171d21;--s3:#20282c;--line:#1c2428;--line2:#263034;--ink:#e7ecea;--ink2:#b3bcbb;--grey:#8a9396;--dim:#7c8689;--faint:#4a5457;

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}h1,h2,h3,p{margin:0}svg{display:block}
.num{font-variant-numeric:tabular-nums}.up{color:var(--green)}.dn{color:var(--red)}.grey{color:var(--grey)}

.rail a,.rail button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--grey)}.rail a:hover,.rail button:hover{background:var(--s2);color:var(--ink)}.rail .on{background:var(--s3);color:var(--ink)}

.cbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}.cbar .r{display:flex;align-items:center;gap:8px}.gear{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--grey)}.gear:hover{background:var(--s2)}

.tbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.tog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey)}.sw{width:30px;height:16px;border-radius:999px;background:var(--s3);position:relative}.sw i{position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--grey)}
table{width:100%;border-collapse:collapse;margin-top:6px}th,td{padding:10px 8px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-weight:400;color:var(--grey);font-size:12px}td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:8px}.who .av{width:22px;height:22px}.cell2{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}.cell2 small{font-size:11.5px;color:var(--grey)}
.thesis{display:flex;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line)}.thesis .av{width:28px;height:28px}.thesis b{font-weight:500}.thesis small{color:var(--grey);margin-left:6px;font-size:12px}.thesis p{color:var(--ink2);margin-top:2px}

.trade .btn.g{margin-top:12px}

.pair2{margin-top:14px}.pair2 .tt{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);letter-spacing:.04em}.pair2 .vv{display:flex;justify-content:space-between;font:600 14px var(--sans);margin-top:1px}.pair2 .bb{display:flex;gap:3px;height:4px;margin-top:6px}.pair2 .bb i{border-radius:9px}

#pchart{width:100%;height:150px;display:block;margin-top:12px}
.prof .note{font-size:12px;color:var(--grey);padding:6px 20px 0}
.pnl{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:18px 20px 0}.pnl span{display:block;font-size:12px;color:var(--grey)}.pnl b{display:block;font:600 18px var(--sans)}.pnl small{font-size:12px;color:var(--grey)}
/* modals */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,11,13,.72);display:none;align-items:center;justify-content:center;padding:16px}.scrim.on{display:flex}
.modal{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal .mh b{font:600 16px var(--sans)}.modal .x{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--grey)}.modal .x:hover{background:var(--s2)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wgrid button{display:grid;gap:6px;justify-items:center;padding:12px 4px;border-radius:12px;font-size:11.5px;color:var(--ink2)}.wgrid button:hover{background:var(--s2)}.wgrid i{width:44px;height:44px;border-radius:12px;display:block}
.lf{display:grid;gap:12px}.lf .top{display:flex;gap:12px;align-items:center}.lf .pick{width:64px;height:64px;border-radius:50%;background:var(--s2);border:1px dashed var(--line2);display:grid;place-items:center;color:var(--grey);cursor:pointer;overflow:hidden;flex:none}.lf .pick img{width:100%;height:100%;object-fit:cover}

 .mhead{display:flex;position:fixed;top:var(--ticker);left:0;right:0;height:56px;z-index:20;background:var(--bg);align-items:center;gap:8px;padding:0 12px}.mhead img{width:28px;height:28px;border-radius:8px}.mhead .sp{flex:1}.mhead button,.mhead a.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}.mhead .si{height:34px;padding:0 14px;border-radius:999px;background:var(--y);color:var(--on-y);font:600 14px var(--sans);display:inline-flex;align-items:center;width:auto}
 .cols{grid-template-columns:minmax(0,1fr);gap:14px}.list{position:static;max-height:none}.side{grid-template-columns:1fr;position:static}
 .cols.coin .list{display:none}.cols.home .center,.cols.home .side{display:none}

 #chart{height:300px}.stats{gap:18px}.stats div b{font-size:15px}.back{display:inline-flex}.pnl{grid-template-columns:1fr 1fr}.prof .pv{flex-wrap:wrap;gap:12px}}

<script>
(function(){

function bubbles(c){const cv=$('#bub');if(!cv)return;const r=cv.getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;const x=cv.getContext('2d');seed=c.i*29+1;const N=46,B=[];for(let k=0;k<N;k++){const rr=(k<3?34:k<10?20:8+rnd()*8)*DPR;B.push({x:rr+rnd()*(cv.width-2*rr),y:rr+rnd()*(cv.height-2*rr),r:rr,c:k<3?'#ffd84d':k%7===0?'#ff4f63':'#4ade80'});}
 for(let it=0;it<60;it++)for(const a of B)for(const b of B){if(a===b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r+3*DPR;if(d<m){const s=(m-d)/2;a.x-=dx/d*s;a.y-=dy/d*s;b.x+=dx/d*s;b.y+=dy/d*s;}}
 x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=DPR;for(let k=1;k<8;k++){x.beginPath();x.moveTo(B[0].x,B[0].y);x.lineTo(B[k].x,B[k].y);x.stroke();}

function profCharts(i){const b=$('#pban');if(b){const r=b.getBoundingClientRect();b.width=r.width*DPR;b.height=r.height*DPR;const x=b.getContext('2d');seed=i*31+9;const [a,c]=PAL[(i*3)%PAL.length];x.fillStyle=c+'22';x.fillRect(0,0,b.width,b.height);for(let k=0;k<70;k++){x.fillStyle=a;x.globalAlpha=.12+rnd()*.25;const s=(6+rnd()*14)*DPR,px=rnd()*b.width,py=rnd()*b.height;x.beginPath();x.moveTo(px,py-s);x.lineTo(px+s,py+s);x.lineTo(px-s,py+s);x.closePath();x.fill();}x.globalAlpha=1;}
 const cv=$('#pchart');if(cv){const r=cv.getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;const x=cv.getContext('2d'),W=cv.width,H=cv.height;seed=i*5+2;const P=[],F=[];let v=.4,f=.1;for(let k=0;k<140;k++){v+=.004+(rnd()-.48)*.05;v=Math.max(.1,v);f=Math.max(f,v*.2);P.push(v);F.push(f);}const mx=Math.max(...P)*1.05,Y=(q)=>H-10*DPR-q/mx*(H-20*DPR),X=(k)=>k/139*W;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,216,77,.25)');g.addColorStop(1,'rgba(255,216,77,0)');x.beginPath();x.moveTo(0,H);P.forEach((q,k)=>x.lineTo(X(k),Y(q)));x.lineTo(W,H);x.closePath();x.fillStyle=g;x.fill();
  x.strokeStyle='#ffd84d';x.lineWidth=1.6*DPR;x.beginPath();P.forEach((q,k)=>k?x.lineTo(X(k),Y(q)):x.moveTo(X(k),Y(q)));x.stroke();x.setLineDash([3*DPR,4*DPR]);x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();F.forEach((q,k)=>k?x.lineTo(X(k),Y(q)):x.moveTo(X(k),Y(q)));x.stroke();x.setLineDash([]);x.fillStyle='#ffd84d';x.beginPath();x.arc(W-2*DPR,Y(P[139]),4*DPR,0,7);x.fill();}}
