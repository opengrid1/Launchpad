<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zappy app</title>
<meta name="description" content="Trade and launch coins with a floor on Ethereum.">
<meta name="theme-color" content="#03040a">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
:root{--bg:#03040a;--s1:#0b0e11;--s2:#11161a;--s3:#171d21;--line:#1c2428;--line2:#263034;--ink:#e7ecea;--ink2:#b3bcbb;--ink3:#8a9396;--y:#ffd84d;--g:#3ee08f;--r:#ff4f63;--silver:#b8c2c7;
  --sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:2px}.tabs a{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2)}.tabs a.on,.tabs a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.search{flex:1;min-width:0;max-width:360px;margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--ink3)}.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font:600 14px var(--sans);white-space:nowrap;transition:transform .15s,background .2s,box-shadow .2s}
.btn.w{background:#fff;color:#07080d}.btn.y{background:var(--y);color:#141522}.btn.y:hover{box-shadow:0 10px 30px -10px rgba(255,216,77,.7)}.btn.o{border:1px solid var(--line2)}.btn.o:hover{background:rgba(255,255,255,.05)}
.btn.lg{height:52px;font-size:16px;border-radius:14px;width:100%}
main{max-width:1240px;margin:0 auto;padding:28px 20px 120px}
.banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 16px;font-size:13px;color:var(--ink2);background:rgba(255,216,77,.06);border-bottom:1px solid rgba(255,216,77,.14)}.banner b{color:var(--y);font-weight:500}
/* cards */
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015) 50%),var(--s1);border:1px solid var(--line);border-radius:18px}
.lab{font:500 12px var(--sans);color:var(--ink3)}
.h{font:600 28px/1.1 var(--sans);letter-spacing:-.03em}
.up{color:var(--g)}.dn{color:var(--r)}
/* explore */
.feat{display:grid;grid-template-columns:1.2fr 1fr;gap:0;overflow:hidden;margin-bottom:34px}
.feat .l{padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.feat .r{border-left:1px solid var(--line);position:relative;min-height:220px}
.feat .r canvas{position:absolute;inset:0;width:100%;height:100%}
.ft{display:flex;align-items:center;gap:14px}.ft .cv{width:56px;height:56px}.ft h2{font:600 26px var(--sans);letter-spacing:-.03em}.ft span{color:var(--ink3)}
.kv{display:flex;gap:28px;flex-wrap:wrap}.kv div span{display:block;font-size:12px;color:var(--ink3)}.kv div b{font:500 20px var(--sans);letter-spacing:-.02em}
.bar{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cc{padding:18px;transition:border-color .2s,transform .2s;display:block}.cc:hover{border-color:var(--line2);transform:translateY(-2px)}
.cc .t{display:flex;align-items:center;gap:12px}.cc .cv{width:44px;height:44px;flex:none}.cc .nm{min-width:0}.cc .nm b{display:block;font:600 15px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc .nm span{font-size:12.5px;color:var(--ink3)}
.cc .ch{margin-left:auto;text-align:right;font:500 13px var(--sans)}
.cc .mc{display:flex;justify-content:space-between;align-items:end;margin-top:16px}.cc .mc b{font:500 22px var(--sans);letter-spacing:-.02em}.cc .mc canvas{width:96px;height:34px}
.fl{margin-top:14px}.fl .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}.fl .row b{color:var(--ink2);font-weight:500}

.cp{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.head{display:flex;align-items:center;gap:16px;margin-bottom:18px}.head .cv{width:60px;height:60px}.head h1{font:600 26px var(--sans);letter-spacing:-.03em}.head .sub{color:var(--ink3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.chartc{padding:18px 18px 10px}.chartc .tp{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px}.chartc .pr b{font:500 34px var(--sans);letter-spacing:-.03em}.chartc .pr span{font-size:14px;margin-left:8px}
#chart{width:100%;height:340px;display:block;margin-top:14px}
.leg{display:flex;gap:16px;font-size:12px;color:var(--ink3);margin-top:6px}.leg i{display:inline-block;width:10px;height:2px;border-radius:2px;margin-right:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}.stats div{padding:16px 18px;border-left:1px solid var(--line)}.stats div:first-child{border-left:0}.stats span{display:block;font-size:12px;color:var(--ink3)}.stats b{font:500 18px var(--sans);letter-spacing:-.02em}
.ttab{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line)}.ttab button{height:34px;padding:0 14px;border-radius:10px;color:var(--ink2);font-size:13.5px}.ttab button.on{background:rgba(255,255,255,.06);color:var(--ink)}
table{width:100%;border-collapse:collapse}td,th{padding:11px 14px;white-space:nowrap;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--ink3);font-size:12px}tr:last-child td{border-bottom:0}td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:8px}.av{width:20px;height:20px;border-radius:50%;flex:none}
/* trade panel */
.side{display:grid;gap:14px;position:sticky;top:84px;grid-template-columns:minmax(0,1fr);min-width:0}
.tp2{padding:16px}
.bs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.bs button{height:38px;border-radius:9px;font-weight:600;color:var(--ink2)}.bs button.on.b{background:rgba(62,224,143,.14);color:var(--g)}.bs button.on.s{background:rgba(255,79,99,.14);color:var(--r)}
.amt{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}.amt .lr{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.amt .in{display:flex;align-items:center;gap:10px;margin-top:6px}.amt input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font:500 30px var(--sans);letter-spacing:-.03em}.amt .cur{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--s3);font-weight:600;font-size:13px}
.quick{display:flex;gap:6px;margin-top:10px}.quick button{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}.quick button:hover{background:rgba(255,255,255,.04)}
.est{margin-top:12px;display:grid;gap:8px;font-size:13px}.est div{display:flex;justify-content:space-between;color:var(--ink3)}.est b{color:var(--ink);font-weight:500}
.tp2 .btn.lg{margin-top:14px}

.gaugeb{height:8px;border-radius:9px;background:rgba(255,255,255,.06);margin-top:14px;position:relative}.gaugeb i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--silver),var(--y))}
.gaugeb em{position:absolute;top:-4px;width:2px;height:16px;background:#fff;border-radius:2px}
.lines{margin-top:14px;display:grid}.lines div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.lines span{color:var(--ink3)}.lines b{font-weight:500}
/* launch */
.ln{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.form{padding:24px;display:grid;gap:18px}
.f label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:7px}
.inp{width:100%;height:46px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);outline:0;transition:border-color .2s}.inp:focus{border-color:var(--line2)}textarea.inp{height:96px;padding:12px 14px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;border:1px dashed var(--line2);background:var(--bg);cursor:pointer}.drop .pv{width:72px;height:72px;border-radius:50%;background:var(--s3);display:grid;place-items:center;overflow:hidden;flex:none}.drop .pv img{width:100%;height:100%;object-fit:cover}.drop .pv svg{width:26px;height:26px;color:var(--ink3)}.drop b{display:block;font-weight:500}.drop span{font-size:12.5px;color:var(--ink3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left}.pair button.on{border-color:rgba(255,216,77,.5);box-shadow:0 0 0 3px rgba(255,216,77,.08)}.pair .cv{width:30px;height:30px}.pair b{display:block;font-weight:600}.pair span{font-size:12px;color:var(--ink3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--y) var(--p,0%),rgba(255,255,255,.08) var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,216,77,.2)}input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.rl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}.rl b{font-weight:500}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.sw{width:42px;height:24px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s}.sw i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--y)}.sw.on i{left:21px}
.sum{padding:20px;display:grid;gap:4px}.sum .pvw{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}.sum .pvw .cv{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--s3)}.sum .pvw img{width:100%;height:100%;object-fit:cover}.sum .pvw b{display:block;font:600 17px var(--sans)}.sum .pvw span{color:var(--ink3);font-size:13px}

/* terminal: list | chart | trade */
.term{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;align-items:start}
.term>.col{min-width:0;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.lst{position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.lst .hd{padding:12px;border-bottom:1px solid var(--line)}.lst .seg{width:100%;justify-content:space-between}.lst .seg button{flex:1;padding:0 6px}
.lst .rows{overflow:auto;padding:6px}
.lr2{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;transition:background .15s}.lr2:hover{background:rgba(255,255,255,.035)}.lr2.on{background:rgba(255,216,77,.07);box-shadow:inset 2px 0 0 var(--y)}
.lr2 .cv{width:40px;height:40px}.lr2 .nm b{display:block;font:600 14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr2 .nm span{font-size:12px;color:var(--ink3)}
.lr2 .rt{text-align:right}.lr2 .rt b{display:block;font:500 14px var(--sans)}.lr2 .rt span{font-size:11.5px;color:var(--ink3)}
.lr2 .fb{grid-column:2/4;height:3px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:-2px}.lr2 .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--silver),var(--y));border-radius:9px}
.chd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.chd .cv{width:52px;height:52px}.chd h1{font:600 24px var(--sans);letter-spacing:-.03em}.chd h1 span{color:var(--ink3);font-weight:500;font-size:17px;margin-left:6px}.chd .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink3)}
.strip{display:grid;grid-template-columns:repeat(5,1fr)}.strip div{padding:14px 16px;border-left:1px solid var(--line)}.strip div:first-child{border-left:0}.strip span{display:block;font-size:12px;color:var(--ink3)}.strip b{font:500 19px var(--sans);letter-spacing:-.02em}.strip em{font-style:normal;font-size:12px;margin-left:4px}
.cbox{padding:14px 14px 8px}.cbox .tb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#cc{width:100%;height:380px;display:block;margin-top:10px;cursor:crosshair}
.ohlc{font:500 12px var(--mono);color:var(--ink3);margin-top:8px;min-height:18px}.ohlc b{color:var(--ink2);font-weight:500}
.act{padding:16px}.act .per{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.act .per button{padding:8px 0;border-radius:10px;text-align:center;border:1px solid transparent}.act .per button.on{background:rgba(255,255,255,.05);border-color:var(--line)}.act .per span{display:block;font-size:11.5px;color:var(--ink3)}.act .per b{font:500 14px var(--sans)}
.split2{margin-top:14px}.split2 .tt{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}.split2 .vv{display:flex;justify-content:space-between;font:500 15px var(--sans);margin-top:2px}.split2 .bb{display:flex;gap:3px;height:5px;margin-top:7px}.split2 .bb i{border-radius:9px}
@media(max-width:1180px){.term{grid-template-columns:260px minmax(0,1fr)}.term>.col.r{grid-column:2}}
@media(max-width:900px){.term.coin>.col.c,.term.coin>.col.r{display:contents}.term.coin .chd{order:1}.term.coin .strip{order:2}.term.coin .cbox{order:3}.term.coin .tp2{order:4}.term.coin .act{order:5}.term.coin .floorc{order:6}.term.coin .tabsc{order:7}.term{grid-template-columns:minmax(0,1fr)}.term>.col.r{grid-column:auto}.lst{position:static;max-height:none}.term.coin .lst{display:none}.term.home>.col:not(.l){display:none}.strip{grid-template-columns:repeat(3,1fr)}.strip div:nth-child(4){border-left:0}.strip div:nth-child(n+4){border-top:1px solid var(--line)}#cc{height:280px}}
/* toast + mobile nav */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;padding:12px 18px;border-radius:14px;background:var(--s3);border:1px solid var(--line2);font-size:14px;transition:all .3s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}.toast.on{opacity:1;transform:translateX(-50%)}
.mnav{display:none}
@media(max-width:980px){.cp,.ln{grid-template-columns:minmax(0,1fr)}.side{position:static}.feat{grid-template-columns:1fr}.feat .r{border-left:0;border-top:1px solid var(--line);min-height:160px}}
@media(max-width:700px){.top .btn{padding:0 14px;height:36px;font-size:13px}.chartc .seg button{padding:0 10px}.tabs,.top .btn.o{display:none}.search{max-width:none}.top .in{gap:10px;padding:0 14px}.brand span{display:none}main{padding:18px 14px 110px}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}#chart{height:260px}.row2{grid-template-columns:1fr}
 .mnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:12px;right:12px;bottom:12px;z-index:30;padding:6px;border-radius:18px;background:rgba(17,22,26,.92);backdrop-filter:blur(16px);border:1px solid var(--line2)}.mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;font-size:11.5px;color:var(--ink3)}.mnav a.on{color:var(--ink);background:rgba(255,255,255,.06)}.mnav svg{width:20px;height:20px}.toast{bottom:96px}}
</style></head><body>
<div class="banner">Preview with sample coins. <b>Zappy opens on Ethereum soon.</b></div>
<header class="top"><div class="in">
  <a class="brand" href="/"><img src="/logo.png" alt=""><span>zappy.fun</span></a>
  <nav class="tabs"><a href="#/" data-r="explore">Trade</a><a href="#/launch" data-r="launch">Launch</a></nav>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search coins" autocomplete="off"></label>
  <button class="btn w" id="connect">Connect</button>
</div></header>
<main id="view"></main>
<nav class="mnav"><a href="#/" data-r="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Explore</a><a href="#/launch" data-r="launch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Launch</a><a href="#/coin/ZAPPY" data-r="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>$ZAPPY</a></nav>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],DPR=Math.min(2,devicePixelRatio||1),ETH=2245;

const toast=(t)=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);};
const PREVIEW='Preview: contracts go live on Ethereum soon. Nothing was sent.';
$('#connect').onclick=()=>toast(PREVIEW);

/* coin art: metallic disc with the ticker's first letters and an embossed bolt */

function candles(c){const cv=$('#cc');if(!cv)return;const r=cv.getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;const x=cv.getContext('2d'),W=cv.width,H=cv.height,N=Math.max(40,Math.floor(r.width/9));

  const fy=Y(last.f);x.fillStyle='#ffd84d';x.fillRect(cw+2*DPR,fy-9*DPR,pad-4*DPR,18*DPR);x.fillStyle='#07080d';x.fillText(usd(Math.exp(last.f)),cw+8*DPR,fy+4*DPR);
  if(hv!=null){const k=K[hv],cx=hv*bw+bw/2;x.strokeStyle='rgba(255,255,255,.2)';x.beginPath();x.moveTo(cx,0);x.lineTo(cx,H);x.stroke();$('#ohlc').innerHTML=`O <b>${usd(Math.exp(k.o))}</b>  H <b>${usd(Math.exp(k.h))}</b>  L <b>${usd(Math.exp(k.l))}</b>  C <b>${usd(Math.exp(k.c))}</b>  Floor <b style="color:var(--y)">${usd(Math.exp(k.f))}</b>`;}

 draw(null);cv.onpointermove=(e)=>{const rr=cv.getBoundingClientRect(),i=Math.floor((e.clientX-rr.left)*DPR/bw);if(i>=0&&i<N)draw(i);};cv.onpointerleave=()=>draw(null);}

function route(){const h=location.hash.replace(/^#/,'')||'/',m=h.match(/^\/coin\/([A-Za-z0-9]+)/),r=m?'coin':h.startsWith('/launch')?'launch':'explore';
 $$('[data-r]').forEach((a)=>a.classList.toggle('on',a.dataset.r===r&&(r!=='coin'||(m&&m[1]==='ZAPPY'))));
 window.scrollTo(0,0);if(r==='launch'){$('#q').oninput=null;launch();}else terminal(m?m[1]:'ZAPPY',!m);}
addEventListener('hashchange',route);
addEventListener('resize',()=>{const c=COINS.find((x)=>x.t===cur);if(c)candles(c);});
route();
})();
