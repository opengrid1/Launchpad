<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:400px;height:400px;overflow:hidden;background:#0f2e25}
.p{position:relative;width:400px;height:400px;background:radial-gradient(85% 85% at 50% 40%,#17402f 0%,#0f2e25 62%,#0a231c 100%);overflow:hidden}
.p img{position:absolute;inset:-10px;width:420px;height:420px;object-fit:cover;object-position:52% 35%;filter:invert(1) grayscale(1) contrast(1.15);mix-blend-mode:screen;opacity:.13}
.d{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:34px;background:#c4ef55;transform:rotate(45deg);box-shadow:0 0 0 14px rgba(196,239,85,.12),0 0 60px rgba(196,239,85,.35)}
.d::after{content:"";position:absolute;inset:44px;border-radius:12px;background:#0f2e25}
</style></head><body><div class="p"><img src="../img/pr-floor.webp"><div class="d"></div></div></body></html>
