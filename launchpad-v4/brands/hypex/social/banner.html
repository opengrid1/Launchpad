<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1500px;height:500px;background:#eef3ef;overflow:hidden}
.b{position:relative;width:1500px;height:500px;background:#eef3ef}
.art{position:absolute;right:-40px;top:-30px;width:930px;height:560px;object-fit:cover;object-position:50% 38%;mix-blend-mode:multiply;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 34%),linear-gradient(0deg,transparent 0%,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 34%);}
.grain{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 40%,rgba(238,243,239,.0),rgba(238,243,239,.0) 60%,rgba(16,44,36,.06));}
.in{position:absolute;left:470px;top:118px;width:640px}
.ey{display:flex;align-items:center;gap:14px;font:500 14px 'Geist Mono',monospace;letter-spacing:.22em;color:#3d5a4f;text-transform:uppercase}
.ey i{display:block;width:44px;height:1px;background:#3d5a4f}
h1{margin-top:0;font:500 104px/.95 'Cormorant Garamond',serif;color:#102c24;letter-spacing:-.01em}
h1 em{font-style:italic;color:#3d7f1d}
.sp{margin-top:26px;display:flex;gap:10px}
.sp span{display:inline-flex;align-items:baseline;gap:8px;height:38px;padding:0 14px;border:1px solid #cfdcd3;border-radius:999px;background:rgba(255,255,255,.7);font:500 13px 'Inter',sans-serif;color:#3d5a4f}
.sp b{font:600 20px 'Cormorant Garamond',serif;color:#102c24;line-height:36px}
.sp span.hot{border-color:#4f9a2a;background:#f2f8ec}.sp span.hot b{color:#3d7f1d}
.ch{position:absolute;right:56px;bottom:40px;display:flex;gap:8px}
.ch span{height:34px;padding:0 14px;border-radius:999px;background:#0f2e25;color:#c4ef55;font:500 12px 'Geist Mono',monospace;letter-spacing:.14em;display:flex;align-items:center}
.wm{position:absolute;left:470px;bottom:40px;display:flex;align-items:center;gap:12px;font:600 26px 'Cormorant Garamond',serif;letter-spacing:.08em;color:#102c24}
.wm svg{width:30px;height:30px}
.rule{position:absolute;left:0;right:0;top:0;height:6px;background:#0f2e25}
</style></head><body><div class="b">
<img class="art" src="../img/pr-home.webp"><div class="grain"></div><div class="rule"></div>
<div class="in">
  <h1>Every trade<br>lifts the <em>floor.</em></h1>
</div>
</div></body></html>
