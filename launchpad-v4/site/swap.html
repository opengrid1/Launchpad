<!doctype html><html lang="en"><head>
<meta charset="utf-8"><script data-theme-boot>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swap | LiquidFi</title><meta name="description" content="Swap HYPE and any coin launched on LiquidFi, or one coin for another, on their Uniswap v4 pools. One transaction, 1% fee, 70% to the creator.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#f5f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/ui.css?v=62">
<style>
#pg-swap{padding:40px 0 120px;display:flex;flex-direction:column;gap:32px;align-items:center}
.swh{text-align:center;max-width:560px}.swh h1{font-size:44px;line-height:44px;letter-spacing:-.04em}.swh p{color:var(--ink-80);font-size:15px;line-height:20px;margin-top:10px}
.swc{width:100%;max-width:480px;padding:16px;border-radius:24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.box{padding:16px;border-radius:18px;background:var(--inset);display:flex;flex-direction:column;gap:10px}.box .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}.box .lab button{color:var(--acid);font-weight:800}
.box .in{display:flex;align-items:center;gap:12px}.box input{flex:1;min-width:0;background:none;border:0;outline:0;font:800 28px/32px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}.box input::placeholder{color:var(--ink-4)}.box .usd{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tsel{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;white-space:nowrap}.tsel img{width:28px;height:28px;border-radius:50%}.tsel svg{width:16px;height:16px}
.flip{display:flex;justify-content:center;margin:-16px 0;position:relative;z-index:1}.flip button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:4px solid var(--bg);box-shadow:var(--shadow-sm);display:grid;place-items:center}.flip svg{width:18px;height:18px}
.det{display:flex;flex-direction:column;gap:6px;padding:4px 8px;font-size:13px;color:var(--ink-2)}.det div{display:flex;justify-content:space-between;gap:12px}.det b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.btn.full{width:100%;height:52px;border-radius:16px;font-size:16px}
.slip{display:flex;align-items:center;gap:6px}.slip button{height:26px;padding:0 10px;border-radius:999px;background:var(--inset);font-size:12px;font-weight:700}.slip button.on{background:var(--acid);color:var(--acid-ink)}
.pick{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}.pick input{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--inset);outline:0}.pick button.tk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-align:left}.pick button.tk:hover{background:var(--inset)}.pick .tk img{width:36px;height:36px;border-radius:50%}.pick .tk b{display:block}.pick .tk small{color:var(--ink-2)}.pick .tk .bal{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-80)}
@media(max-width:999px){#pg-swap{padding:16px 0 120px}.swh h1{font-size:32px;line-height:32px}}
</style>
</head><body data-page="swap">
<header id="top"></header>
<main><div class="wrap"><div id="pg-swap"></div></div></main>
<footer id="foot"></footer>
<script src="/config.js?v=62"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script><script src="/routes.js?v=62"></script><script src="/chain.js?v=62"></script><script src="/glyphs.js?v=62"></script><script src="/app.js?v=62"></script><script src="/pg-swap.js?v=62"></script>
</body></html>
