<!doctype html><html lang="en"><head>
<meta charset="utf-8"><script data-theme-boot>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trending | LiquidFi</title><meta name="description" content="What the internet is talking about right now, turned into meme token ideas you can launch in one click on LiquidFi.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#f5f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/ui.css?v=62">
<style>
#pg-trends{padding:40px 0 120px;display:flex;flex-direction:column;gap:28px}
.th{display:flex;flex-direction:column;gap:12px}.th h1{font-size:44px;line-height:44px;letter-spacing:-.04em}.th p{font-size:15px;line-height:20px;color:var(--ink-80);max-width:640px}
.tf{display:flex;gap:8px;min-width:0}.tf .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.tf .seg::-webkit-scrollbar{display:none}.tf .seg button{flex:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tc{border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tc .src{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;line-height:14px;color:var(--ink-2);font-weight:600}.tc .src a{color:var(--ink-2)}.tc .src a:hover{color:var(--ink)}
.tc h3{font-size:17px;line-height:21px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}.tc .meta{font-size:13px;line-height:16px;color:var(--ink-80)}.tc .note{font-size:13px;line-height:16px;color:var(--ink-2);overflow-wrap:anywhere}
.tc .act{margin-top:auto;display:flex;justify-content:flex-start}
.idea{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--inset)}
.idea .top{display:flex;gap:12px;align-items:center}.idea .lg{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;background:var(--surface)}.idea .lg img{width:64px;height:64px;display:block}
.idea .nm{display:flex;flex-direction:column;gap:2px;min-width:0}.idea .nm b{font-size:17px;line-height:20px;font-weight:800;overflow-wrap:anywhere}.idea .nm span{font-size:13px;color:var(--ink-80);font-weight:700}
.idea p{font-size:14px;line-height:19px;color:var(--ink-80)}.idea .row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.idea .tag{font-size:11px;font-weight:700;color:var(--ink-2)}
.idea.no p{color:var(--ink-2)}
@media(max-width:999px){#pg-trends{padding:16px 0 120px}.th h1{font-size:32px;line-height:34px}.tgrid{grid-template-columns:1fr}}
</style>
</head><body data-page="trends">
<header id="top"></header>
<main><div class="wrap"><div id="pg-trends"></div></div></main>
<footer id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script><script src="/config.js?v=62"></script><script src="/routes.js?v=62"></script><script src="/chain.js?v=62"></script><script src="/glyphs.js?v=62"></script><script src="/app.js?v=62"></script><script src="/pg-trends.js?v=62"></script>
</body></html>
