<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin | GODMODE</title><meta name="description" content="Chart, trades, holders, locked liquidity and live fee state for a coin launched on HyperEVM and Solana.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#f7f7f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/ui.css?v=12">
<style>
#pg-token{padding-top:16px}
#pg-token .back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:8px;background:var(--fill);font-size:14px;font-weight:500;margin-bottom:16px}#pg-token .back svg{width:16px;height:16px}
#pg-token .head{display:flex;gap:12px;align-items:flex-start}#pg-token .head img.av{width:48px;height:48px;border-radius:10px}#pg-token .head h1{font-size:22px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}#pg-token .head h1 small{font-size:15px;font-weight:500;color:var(--fg-3)}
#pg-token .head .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--fg-3);margin-top:4px;align-items:center}#pg-token .head .meta span,#pg-token .head .meta a,#pg-token .head .meta button{display:inline-flex;align-items:center;gap:4px}#pg-token .head .meta svg{width:13px;height:13px}#pg-token .head .meta button{color:var(--fg-3)}#pg-token .head .meta a:hover{color:var(--fg)}
#pg-token .chainrow{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:14px;font-weight:500}#pg-token .chainrow img{width:18px;height:18px;border-radius:50%}#pg-token .chainrow .sep{color:var(--fg-4)}#pg-token .chainrow .badge{margin-left:auto}
#pg-token .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;margin:0 0 14px}#pg-token .stats b{font-size:17px;font-weight:700}#pg-token .stats span{color:var(--fg-3)}
#pg-token .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:1000px){#pg-token .grid{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto auto auto;gap:14px 20px}#pg-token .grid>*{grid-column:1}#pg-token .grid .trade{grid-column:2;grid-row:1 / span 4;position:sticky;top:80px}}
.ch{border:1px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden}.ch .ch-hd{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ch .ch-cv{position:relative;height:380px}.ch .ch-tip{position:absolute;display:none;pointer-events:none;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 30px -8px rgba(0,0,0,.2);font-size:12px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}.ch .ch-tip b{display:block;color:var(--fg);margin-bottom:3px}.ch .ch-tip span{display:block}
#pg-token .fee{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r2);background:#fff}#pg-token .fee .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}#pg-token .fee .bar{flex:1;min-width:80px}#pg-token .fee small{font-size:13px;color:var(--fg-2)}
#pg-token .trade{border:1px solid var(--line);border-radius:var(--r);background:#fff}#pg-token .trade .bd{padding:16px}
#pg-token .trade .bs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}#pg-token .trade .bs .btn{height:40px;border-radius:8px}
#pg-token .trade .chain{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}#pg-token .trade .chain button{display:flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:500;font-size:14px;color:var(--fg-3)}#pg-token .trade .chain button img{width:18px;height:18px;border-radius:50%}#pg-token .trade .chain button.on{color:var(--fg);border-color:var(--pur);background:var(--pur-dim)}
#pg-token .trade .qs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}#pg-token .trade .qs button{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:500;font-size:13px;color:var(--fg)}
#pg-token .trade .ipw .inp{height:52px;font-size:22px;font-weight:600;padding-right:76px}#pg-token .trade .ipw .suf{height:52px;font-size:14px}
#pg-token .trade .q{margin:10px 0}#pg-token .trade .q .kvl{padding:9px 0;font-size:14px}
#pg-token .tabwrap{margin-top:4px}#pg-token .tabp{padding-top:12px}
#pg-token .pos{display:grid;gap:8px}#pg-token .pos .p{padding:10px 12px;border:1px solid var(--line);border-radius:8px}#pg-token .pos .p .bar{margin-top:8px}
#pg-token .info .kv b{max-width:62%;white-space:normal;word-break:break-all;font-family:var(--mono);font-size:13px;font-weight:400}
#pg-token .about{font-size:15px;color:var(--fg-2);line-height:1.6}
@media(max-width:999px){.ch .ch-cv{height:320px}}
</style>
</head><body data-page="token">
<header id="top"></header><div id="tape"></div>
<main><div class="wrap"><div id="pg-token"><div class="empty" id="t-loading">Loading…</div></div></div></main>
<nav id="tabbar"></nav><footer id="foot"></footer>
<script src="/config.js?v=12"></script><script src="/demo.js?v=12"></script><script src="/app.js?v=12"></script><script src="/chart.js?v=12"></script><script src="/pg-token.js?v=12"></script>
</body></html>
