<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin | GODMODE</title><meta name="description" content="Chart, trades, holders, locked liquidity and live fee state for a coin launched on HyperEVM.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#f5f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/ui.css?v=21">
<style>
#pg-token{padding:18px 0 90px}
#pg-token .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:14px}#pg-token .back svg{width:14px;height:14px}#pg-token .back:hover{color:var(--ink)}
#pg-token .th2{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}#pg-token .th2 img.big{width:64px;height:64px;border-radius:18px;object-fit:cover;background:var(--inset);box-shadow:var(--shadow-sm);flex:none}
#pg-token .th2 .min{min-width:0;flex:1}#pg-token .th2 h1{font-size:32px;line-height:1.1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}#pg-token .th2 h1 small{font-size:18px;font-weight:700;color:var(--ink-3)}
#pg-token .meta{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-3)}#pg-token .meta i{width:16px;height:16px;border-radius:50%;background:var(--acid-quiet);display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#007a03;font-style:normal}#pg-token .meta a{color:var(--ink-2)}#pg-token .meta a:hover{color:var(--ink)}#pg-token .meta .dot{color:var(--ink-4)}#pg-token .meta img{width:14px;height:14px;border-radius:50%}
#pg-token .meta .ib{width:26px;height:26px;border-radius:50%;background:var(--inset);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}#pg-token .meta .ib svg{width:12px;height:12px}#pg-token .meta .ib:hover{background:rgba(12,21,0,.12)}
#pg-token .mcbox{text-align:right;flex:none}#pg-token .mcbox span{display:block;font-size:12.5px;color:var(--ink-3)}#pg-token .mcbox b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}#pg-token .mcbox small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
#pg-token .tg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}@media(min-width:1000px){#pg-token .tg{grid-template-columns:minmax(0,1fr) 340px;gap:28px}#pg-token .side{position:sticky;top:20px}}
#pg-token .pxrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}#pg-token .pxrow b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}#pg-token .pxrow span{font-size:14px;font-weight:700}#pg-token .pxrow small{font-size:13px;color:var(--ink-3)}
.ch{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.ch .ch-hd{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;flex-wrap:wrap}.ch .ch-cv{position:relative;height:360px}.ch .ch-tip{position:absolute;display:none;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}.ch .ch-tip b{display:block;margin-bottom:3px}.ch .ch-tip span{display:block;opacity:.85}
@media(max-width:999px){.ch .ch-cv{height:280px}.ch .seg button{padding:0 9px;font-size:12px}}
#pg-token .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 0;padding:16px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}#pg-token .stats span{display:block;font-size:12.5px;color:var(--ink-3)}#pg-token .stats b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
#pg-token .stats2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}#pg-token .stats2 span{display:block;font-size:12.5px;color:var(--ink-3)}#pg-token .stats2 b{display:block;font-size:13.5px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis}#pg-token .stats2 b a{text-decoration:underline;text-decoration-color:var(--line-3);text-underline-offset:3px}
#pg-token .about{padding:16px 0 4px}#pg-token .about h3{font-size:15px;margin-bottom:6px}#pg-token .about p{font-size:14.5px;color:var(--ink-2);line-height:1.6}
#pg-token .tabw{margin-top:14px}#pg-token .tabw .tabs{margin-bottom:0}#pg-token .tabw .tbl td{padding:11px 12px}#pg-token .tabw .tbl th{padding:10px 12px}
@media(max-width:760px){#pg-token .stats{grid-template-columns:repeat(2,1fr)}#pg-token .stats2{grid-template-columns:repeat(2,1fr)}#pg-token .th2 h1{font-size:24px}#pg-token .th2 img.big{width:52px;height:52px;border-radius:14px}#pg-token .mcbox{display:none}}
/* trade card */
#pg-token .tradec{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:18px}#pg-token .tradec .cap{font-size:12.5px;color:var(--ink-3);text-align:center;margin-bottom:12px}
#pg-token .tradec .seg{display:flex;width:100%}#pg-token .tradec .seg button{flex:1;height:34px}#pg-token .tradec .bs{margin-bottom:12px}
#pg-token .pay{border-radius:16px;background:var(--inset);padding:14px 16px;margin-top:10px}#pg-token .pay .lab{display:flex;justify-content:space-between}#pg-token .pay .amt{display:flex;align-items:center;gap:10px;margin-top:4px}#pg-token .pay .amt input{flex:1;min-width:0;height:40px;border:0;background:transparent;font-size:28px;font-weight:800;outline:0;color:var(--ink);font-variant-numeric:tabular-nums}#pg-token .pay .amt input::placeholder{color:var(--ink-4)}#pg-token .pay .amt b{font-size:18px;font-weight:800}
#pg-token .pay .qs{display:flex;gap:6px;margin-top:8px}#pg-token .pay .qs button{height:26px;padding:0 10px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-2)}#pg-token .pay .qs button:hover{color:var(--ink)}
#pg-token .recv{padding:12px 4px 4px}#pg-token .recv span{display:block;font-size:12.5px;color:var(--ink-3)}#pg-token .recv b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}#pg-token .recv small{font-size:12.5px;color:var(--ink-3)}
#pg-token .q{margin:4px 0 12px}#pg-token .q .kvl{padding:7px 0;font-size:13px;border:0}#pg-token .q .kvl span{color:var(--ink-3)}
#pg-token .feec{margin-top:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:16px 18px}#pg-token .feec .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}#pg-token .feec .hdr b{font-size:14px;font-weight:800}#pg-token .feec .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}#pg-token .feec .split{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--inset);margin:10px 0}#pg-token .feec .split i{display:block;height:100%}#pg-token .feec .leg{display:grid;gap:5px;font-size:12.5px}#pg-token .feec .leg div{display:flex;align-items:center;gap:8px;color:var(--ink-3)}#pg-token .feec .leg div b{margin-left:auto;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}#pg-token .feec .leg em{width:8px;height:8px;border-radius:50%;flex:none}
#pg-token .feec .live{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-3)}#pg-token .feec .live .bar{flex:1}
/* mobile bottom bar */
#pg-token .mbar{display:none}@media(max-width:999px){#pg-token .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}#pg-token .mbar .p{flex:1;min-width:0}#pg-token .mbar .p small{display:block;font-size:11px;color:var(--ink-3)}#pg-token .mbar .p b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}#pg-token .mbar .btn{height:40px;padding:0 20px;border-radius:999px}}
</style>
</head><body data-page="token">
<header id="top"></header>
<main><div class="wrap"><div id="pg-token"><div class="empty" id="t-loading">Loading…</div></div></div></main>
<footer id="foot"></footer>
<script src="/config.js?v=21"></script><script src="/demo.js?v=21"></script><script src="/app.js?v=21"></script><script src="/chart.js?v=21"></script><script src="/pg-token.js?v=21"></script>
</body></html>
