<style>
#pg-home{padding:40px 0 120px;display:flex;flex-direction:column;gap:32px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.ph h1{font-size:44px;line-height:44px;letter-spacing:-.04em}.ph .btn{height:44px}
.trs{display:flex;flex-direction:column;gap:16px}.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;height:32px}.sec-h h2{font-size:22px;line-height:26.4px;letter-spacing:-.04em}.sec-h .arr{display:flex;gap:8px}.sec-h .arr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-80)}.sec-h .arr button svg{width:16px;height:16px;stroke-width:1.75}.sec-h .arr button:hover{background:var(--inset)}
.mqv{overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent)}@media(prefers-reduced-motion:reduce){.mqv{mask-image:none;-webkit-mask-image:none;overflow-x:auto}}.mq{display:flex;width:max-content;will-change:transform}.mq .lap{display:flex;gap:16px;padding:0 16px 0 0;margin:0;list-style:none}
.trc{flex:none;width:184px;list-style:none}.trc a{display:flex;flex-direction:column;gap:4px}.trc .art{width:184px;height:184px;border-radius:20px;background:var(--inset);overflow:hidden;margin-bottom:8px}.trc .art img{width:184px;height:184px;object-fit:cover}.trc .nm{display:flex;align-items:baseline;gap:8px;font-size:15px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trc .nm em{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}.trc .fig{display:flex;align-items:baseline;gap:8px}.trc .fig b{font-size:22px;line-height:26.4px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.trc .fig span{font-size:13px;line-height:15.6px;font-weight:600;font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:32px}
.tools{display:flex;align-items:center;gap:8px;flex:none}.vt{display:inline-flex;align-items:center;gap:2px;height:36px;padding:2px;border-radius:999px;background:var(--inset);border:1px solid var(--line)}.vt button{width:30px;height:30px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-80)}.vt button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(12,21,0,.08)}.vt svg{width:14px;height:14px;stroke-width:1.75}
/* rows: flat grid rows, 1px separators, 13px hover radius */
.more{display:flex;justify-content:center}
/* grid view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}.gc{display:flex;flex-direction:column;gap:4px}.gc .art{width:100%;aspect-ratio:1;border-radius:20px;background:var(--inset);overflow:hidden;margin-bottom:8px}.gc .art img{width:100%;height:100%;object-fit:cover}.gc .nm{display:flex;align-items:baseline;gap:8px;font-size:15px;line-height:18px;white-space:nowrap;overflow:hidden}.gc .nm em{font-style:normal;color:var(--ink-2);font-size:13px}.gc .fig{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.gc .fig b{font-size:22px;line-height:26.4px;font-weight:800;letter-spacing:-.04em}.gc .fig svg{width:70px;height:24px}
@media(max-width:999px){#pg-home{padding:16px 0 120px}.ph{flex-direction:column;align-items:flex-start;gap:24px}.ph h1{font-size:32px;line-height:32px}.sec-h h2{font-size:18px;line-height:21.6px}.trc .fig b{font-size:18px;line-height:21.6px}
  .toolbar{flex-wrap:wrap;gap:12px}.toolbar .tabs{flex-basis:calc(100% + 48px);margin:0 -24px -9px;padding:0 24px;overflow-x:auto;scrollbar-width:none}.toolbar .tabs::-webkit-scrollbar{display:none}.toolbar .tools{justify-content:flex-start}
  .cards{grid-template-columns:1fr 1fr}}
</style>
</head><body data-page="home">
