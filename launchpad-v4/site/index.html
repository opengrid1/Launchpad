<!doctype html><html lang="en"><head>
<meta charset="utf-8"><script data-theme-boot>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GODMODE | Coins on HyperEVM</title><meta name="description" content="Meme launchpad on HyperEVM. HYPE pair, locked liquidity, 1% fee with 70% to the creator.">

<style>
#pg-home{padding:40px 0 40px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}.ph h1{font-size:44px;line-height:1;letter-spacing:-.04em}.ph .btn{height:44px;padding:0 20px;font-size:15px;font-weight:800}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px}.sec-h h2{font-size:22px;letter-spacing:-.04em}.sec-h .arr{display:flex;gap:6px}.sec-h .arr button{width:30px;height:30px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}.sec-h .arr button svg{width:14px;height:14px}
.trend{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px}.trend::-webkit-scrollbar{display:none}
.trc{flex:none;width:184px;scroll-snap-align:start}.trc img{width:184px;height:184px;border-radius:var(--r-lg);object-fit:cover;background:var(--inset);box-shadow:var(--shadow-sm);transition:transform .15s}.trc:hover img{transform:translateY(-2px)}.trc .t{padding:12px 4px 0}.trc .t small{display:block;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trc .t small em{font-style:normal;color:var(--ink-3);margin-right:6px}.trc .t b{display:block;font-size:22px;font-weight:800;letter-spacing:-.04em;margin-top:3px;font-variant-numeric:tabular-nums}.trc .t b span{font-size:14px;font-weight:700;letter-spacing:0;margin-left:8px}
.tabsrow{display:flex;align-items:center;gap:12px;margin:30px 0 18px}.tabsrow .tabs{flex:1;overflow-x:auto;scrollbar-width:none}.tabsrow .tabs::-webkit-scrollbar{display:none}
.tabsrow .srch{position:relative;flex:none;width:200px}.tabsrow .srch input{width:100%;height:36px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);outline:0}.tabsrow .srch input:focus{border-color:var(--ink)}.tabsrow .srch svg{position:absolute;left:11px;top:10px;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.coins td{height:66px;padding:0 16px}.coins th:first-child,.coins td:first-child{padding-left:20px}.coins th{padding:14px 16px}
.coins .c{display:flex;align-items:center;gap:12px;min-width:0}.coins .c img{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--inset);flex:none}.coins .c .t{min-width:0}.coins .c b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;line-height:1.25}.coins .c b em{font-style:normal;font-weight:600;color:var(--ink-2);font-size:15px}.coins .c small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}.coins .c small i{width:16px;height:16px;border-radius:50%;background:var(--acid-quiet);display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:var(--up-text);font-style:normal}
.coins .pair{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}.coins .pair img{width:16px;height:16px;border-radius:50%}
.coins svg.sp{display:block;width:120px;height:36px}
.coins td.mc{font-weight:700;font-size:15px}.coins td.mc small{display:none}
.coins tbody tr{cursor:pointer}.coins tbody tr:hover td{background:var(--inset-2)}
.more{display:flex;justify-content:center;margin:22px 0 8px}.more .btn{height:44px;padding:0 20px;font-size:15px;font-weight:800;background:transparent}
@media(max-width:760px){#pg-home{padding-top:16px}.coins .hm{display:none}.coins td.mc small{display:block;font-size:12.5px;font-weight:700}.ph{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:26px}.ph h1{font-size:36px}.tabsrow{flex-wrap:wrap}.tabsrow .srch{width:100%}.trc{width:150px}.trc img{width:150px;height:150px}.coins{table-layout:fixed}.coins td:first-child{width:64%}.coins td.mc{padding-right:14px}.coins .c .t{min-width:0;flex:1}.coins .c b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coins .c b em{font-size:13px;margin-left:6px}.coins .c small{white-space:nowrap;overflow:hidden}}
</style>
</head><body data-page="home">
<header id="top"></header>
<main><div class="wrap"><div id="pg-home">

  <div class="trend" id="h-trend"></div>

</div></div></main>
<footer id="foot"></footer>
