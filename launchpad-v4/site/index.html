<style>
#pg-home{padding:28px 0 40px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line-2)}
.hero h1{font-size:28px;letter-spacing:-.025em;line-height:1.1}.hero p{margin-top:8px;font-size:14.5px;color:var(--fg-3);max-width:520px;line-height:1.55}

.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 10px}.toolbar .seg{flex:none;overflow-x:auto;scrollbar-width:none;max-width:100%}.toolbar .seg::-webkit-scrollbar{display:none}.toolbar .seg button{flex:none}

.coins .mo{display:none}.coins svg.sp{display:block;width:96px;height:28px}
.coins .st .badge{height:20px;font-size:11px}
.coins .rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--mint-dim);color:var(--mint);font-size:11px;font-weight:700}
.pager{display:flex;justify-content:center;gap:6px;margin:18px 0 10px}
@media(max-width:860px){.coins .hm{display:none}.coins .mo{display:block;font-size:12px;margin-top:2px}.coins td{height:62px;padding:0 6px}.coins .n{display:none}.coins .c b{max-width:46vw}.hero .stats{gap:20px}.hero .stats b{font-size:17px}.toolbar{flex-wrap:wrap}.toolbar .srch{margin-left:0;width:100%}}
