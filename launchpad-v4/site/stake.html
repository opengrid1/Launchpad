<!doctype html><html lang="en"><head>
<meta charset="utf-8"><script data-theme-boot>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stake | LiquidFi</title><meta name="description" content="Stake the platform token and earn the protocol's fees in HYPE. Every launch fee and every protocol share of trading fees streams to stakers, buys the token back and burns it, and funds the treasury.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#f5f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/ui.css?v=62">
<style>
#pg-stake{padding:40px 0 120px;display:flex;flex-direction:column;gap:32px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.sh h1{font-size:44px;line-height:44px;letter-spacing:-.04em}.sh p{max-width:560px;color:var(--ink-80);font-size:15px;line-height:20px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px 20px;border-radius:20px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}.stat span{display:block;font-size:13px;line-height:15.6px;color:var(--ink-2)}.stat b{display:block;margin-top:6px;font-size:26px;line-height:30px;letter-spacing:-.03em;font-weight:800;font-variant-numeric:tabular-nums}.stat small{display:block;margin-top:2px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.card{padding:24px;border-radius:24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}.card h2{font-size:22px;line-height:26px;letter-spacing:-.04em}.card .hint{font-size:13px;line-height:17px;color:var(--ink-2)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--inset)}.seg button{height:34px;padding:0 16px;border-radius:999px;font-weight:700;color:var(--ink-80)}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.amt{display:flex;flex-direction:column;gap:8px}.amt .in{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-radius:16px;background:var(--inset);border:1px solid transparent}.amt .in:focus-within{border-color:var(--acid)}.amt input{flex:1;min-width:0;background:none;border:0;outline:0;font:800 22px/26px var(--sans);font-variant-numeric:tabular-nums}.amt .in b{font-size:15px}.amt .bal{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}.amt .bal button{color:var(--acid);font-weight:800}
.btn.full{width:100%;height:48px;border-radius:14px;font-size:15px}
.kv{display:flex;flex-direction:column}.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.kv div:last-child{border-bottom:0}.kv span{color:var(--ink-2)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.flow div{padding:16px;border-radius:16px;background:var(--inset)}.flow div span{display:block;font-size:13px;color:var(--ink-2)}.flow div b{display:block;margin-top:6px;font-size:20px;line-height:24px;font-variant-numeric:tabular-nums}.flow div small{display:block;margin-top:4px;font-size:12px;color:var(--ink-2)}
.rows.fl .rh,.rows.fl .r{grid-template-columns:110px minmax(0,1fr) 120px 120px 120px}.rows.fl .r{cursor:default}.rows .cell{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:32px 12px;color:var(--ink-80);font-size:15px}
@media(max-width:999px){#pg-stake{padding:16px 0 120px;gap:20px}.sh{flex-direction:column;align-items:flex-start}.sh h1{font-size:32px;line-height:32px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.rows.fl .rh,.rows.fl .r{grid-template-columns:90px minmax(0,1fr) auto}.rows.fl .c-x{display:none}}
</style>
</head><body data-page="stake">
<header id="top"></header>
<main><div class="wrap"><div id="pg-stake"></div></div></main>
<footer id="foot"></footer>
<script src="/config.js?v=62"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script><script src="/routes.js?v=62"></script><script src="/chain.js?v=62"></script><script src="/glyphs.js?v=62"></script><script src="/app.js?v=62"></script><script src="/pg-stake.js?v=62"></script>
</body></html>
