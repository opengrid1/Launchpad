<style>
#pg-creator{padding:40px 0 120px;display:flex;flex-direction:column;gap:24px}
.phd{display:flex;flex-direction:column;gap:16px}.back{display:flex;align-items:center;gap:4px;height:24px;font-size:13px;line-height:15.6px;color:var(--ink-2)}.back svg{width:14px;height:14px;stroke-width:1.75}

.pid{display:flex;flex-direction:column;gap:8px;padding:0 12px}.pid h1{font-size:28px;line-height:32.2px;letter-spacing:-.04em;font-weight:800}

.ptabs{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:31px}.ptabs .tb{display:flex;align-items:center;gap:4px;height:40px;margin-bottom:-9px;overflow-x:auto;scrollbar-width:none}.ptabs .tb::-webkit-scrollbar{display:none}.ptabs .tb button{height:40px;padding:0 8px;display:flex;align-items:center;gap:8px;font-size:15px;line-height:18px;font-weight:600;color:var(--ink-80);position:relative;white-space:nowrap}.ptabs .tb button.on{color:var(--ink)}.ptabs .tb button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink)}.ptabs .tb button i{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}

.pfig{display:flex;flex-direction:column;gap:2px}.pfig b{font-size:32px;line-height:35.2px;letter-spacing:-.04em;font-weight:800;font-variant-numeric:tabular-nums}.pfig span{font-size:13px;line-height:15.6px;font-variant-numeric:tabular-nums}
.rng{display:flex;align-items:center;gap:2px;height:36px;padding:3px;border-radius:999px;background:var(--inset);flex:none}.rng button{height:30px;padding:0 12px;border-radius:999px;font-size:13px;line-height:15.6px;font-weight:600;color:var(--ink-80)}.rng button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(12,21,0,.08)}
.pcv{height:200px}.pcv canvas{display:block;width:100%;height:200px}
.rows .cell{text-align:right;font-size:15px;line-height:18px;font-weight:600;font-variant-numeric:tabular-nums}.rows .cell.muted{color:var(--ink-2)}
.rows.hold .rh,.rows.hold .r{grid-template-columns:40px minmax(0,1fr) 100px 100px 104px 116px}
.rows.act .rh,.rows.act .r{grid-template-columns:36px minmax(0,1fr) 104px 112px 104px 72px 28px}.rows.act .r{cursor:default}.rows.act .mk,.rows.act .mk img{width:36px;height:36px}.rows.act .nm a{color:inherit}.rows .side{display:flex;align-items:center;gap:4px;font-size:15px;line-height:18px;font-weight:600}.rows .side svg{width:14px;height:14px;stroke-width:1.75}.rows .txl{display:flex;justify-content:center;color:var(--ink-2)}.rows .txl svg{width:14px;height:14px;stroke-width:1.75}
.pstats{display:flex;flex-wrap:wrap;gap:8px 16px;padding:0 12px 16px;font-size:13px;line-height:15.6px;color:var(--ink-80)}
.feesw{display:flex;flex-direction:column;gap:20px}.fcard{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 24px;border-radius:24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}.fcopy{display:flex;flex-direction:column;gap:8px}.fcopy .lab{font-size:13px;line-height:15.6px;color:var(--ink-80)}.fcopy b{font-size:32px;line-height:35.2px;letter-spacing:-.04em;font-weight:800;font-variant-numeric:tabular-nums}
.rows.fees .rh,.rows.fees .r{grid-template-columns:40px minmax(0,1fr) 140px 140px}
.pempty{padding:40px 12px;font-size:15px;line-height:18px;color:var(--ink-80);display:flex;flex-direction:column;align-items:flex-start;gap:16px}.pempty .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:999px){#pg-creator{padding:16px 0 120px}.pid h1{font-size:24px;line-height:28px}.pch{flex-direction:column}.pfig b{font-size:26px;line-height:29px}.ptabs{height:auto}.ptabs .tb{width:100%}
  .rows.hold .rh,.rows.hold .r{grid-template-columns:40px minmax(0,1fr) auto auto}.rows.act .rh,.rows.act .r{grid-template-columns:36px minmax(0,1fr) auto auto}.rows.act .age{display:none}.rows.fees .rh,.rows.fees .r{grid-template-columns:40px minmax(0,1fr) auto}.rows.act .nm em,.rows.fees .nm em,.rows.hold .nm em{display:none}.fcard{flex-direction:column;align-items:flex-start;gap:16px}}
