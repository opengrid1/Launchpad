[profile.default]
src = "src"
out = "out"
libs = ["lib", "../contracts/lib"]
solc_version = "0.8.26"
evm_version = "cancun"   # Uniswap v4 needs transient storage
optimizer = true
optimizer_runs = 200
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 500
