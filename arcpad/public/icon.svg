  <path d="M158 104c-4-12-15-19-30-19-17 0-29 8-29 21 0 30 60 16 60 46 0 14-13 22-31 22-16 0-28-7-32-19" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
