<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Token | StockPad</title><meta name="description" content="Price, chart, trades and holders for a coin launched on StockPad, paired with a tokenized stock on Ethereum.">
<link rel="icon" href="/img/favicon.svg?v=9" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=9"><meta name="theme-color" content="#0a0a0b">
<meta property="og:image" content="/img/og.png?v=9">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=2">
<style>
/* token page, scoped under #pg-token */
#pg-token .hd{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px 18px;align-items:center;margin-bottom:22px}
#pg-token .hd .lg{width:64px;height:64px;border-radius:14px;background:var(--bg-3);object-fit:cover}
#pg-token .hd .t1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} #pg-token .hd h1{font-size:26px} #pg-token .hd .sym{font:500 15px var(--mono);color:var(--fg-3)}
#pg-token .hd .t2{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--fg-3)}
#pg-token .hd .t2 .pc{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:500} #pg-token .hd .t2 .pc img{width:18px;height:18px;border-radius:50%;background:#fff} #pg-token .hd .t2 .pc:hover{color:var(--mint)}
#pg-token .hd .t2 .addr button,#pg-token .hd .t2 .addr a{display:inline-flex;align-items:center;color:var(--fg-3);vertical-align:middle} #pg-token .hd .t2 .addr button:hover,#pg-token .hd .t2 .addr a:hover{color:var(--fg)} #pg-token .hd .t2 .addr svg{width:14px;height:14px}
#pg-token .hd .pxb{text-align:right} #pg-token .hd .pxb b{display:block;font:500 28px/1.1 var(--mono);letter-spacing:-.02em} #pg-token .hd .pxb small{display:block;margin-top:4px;font:13px var(--mono);color:var(--fg-3)} #pg-token .hd .pxb .num{font-size:13px}
#pg-token .desc{grid-column:2/-1;margin:-6px 0 0;color:var(--fg-2);font-size:14px;line-height:1.55;max-width:80ch} #pg-token .desc .ln{display:inline-flex;gap:12px;margin-left:8px} #pg-token .desc .ln a{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-size:13px} #pg-token .desc .ln a:hover{color:var(--fg)} #pg-token .desc .ln svg{width:13px;height:13px}
#pg-token .stats{padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}
#pg-token .stats .figs>div{padding-right:24px;margin-right:24px} #pg-token .stats .figs b{font-size:18px} #pg-token .stats .figs b .pc{font-size:12px;margin-left:6px}
#pg-token .cols{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:start}
#pg-token .left{min-width:0;display:flex;flex-direction:column;gap:20px}
#pg-token .right{position:sticky;top:calc(var(--top) + 16px);display:flex;flex-direction:column;gap:20px}
#pg-token .chart{overflow:hidden} #pg-token #tv{min-height:460px;height:460px;width:100%} #pg-token #tv .tvno{height:100%;min-height:460px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:13px}
#pg-token .panel .tabs{overflow-x:auto;scrollbar-width:none} #pg-token .panel .tabs button{white-space:nowrap}
#pg-token .pane{display:none} #pg-token .pane.on{display:block} #pg-token .tw{overflow-x:auto}
#pg-token .ptools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-size:12px;color:var(--fg-3)}
#pg-token .tb td.r small{text-align:right}
#pg-token .txl{color:var(--fg-3)} #pg-token .txl:hover{color:var(--fg)}
#pg-token .more{display:flex;justify-content:center;padding:12px}
#pg-token tr.new td{animation:tkflash 1.2s ease-out} @keyframes tkflash{from{background:var(--mint-dim)}to{background:transparent}}
#pg-token .info{padding:18px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px} #pg-token .info h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
#pg-token .info p{margin:0 0 10px;font-size:13.5px;color:var(--fg-2);line-height:1.55} #pg-token .info .kv b{display:inline-flex;align-items:center;gap:6px;min-width:0} #pg-token .info .kv b a{color:var(--fg-3)} #pg-token .info .kv b a:hover{color:var(--fg)} #pg-token .info .kv b button{color:var(--fg-3)} #pg-token .info .kv b button:hover{color:var(--fg)}
#pg-token .info .kv b .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* trade card */
#pg-token .trade{border-radius:var(--r-xl)} #pg-token .trade .cb{padding:14px}
#pg-token .sides{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:var(--bg-1)}
#pg-token .sides button{height:36px;border-radius:7px;font-weight:600;color:var(--fg-3)} #pg-token .sides button.on.b{background:var(--mint-dim);color:var(--mint)} #pg-token .sides button.on.s{background:var(--red-dim);color:var(--red)}
#pg-token .box{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-1)} #pg-token .box:focus-within{border-color:var(--line-3)}
#pg-token .box .lr{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--fg-3)} #pg-token .box .lr .num{font-size:12px}
#pg-token .box .ir{display:flex;align-items:center;gap:10px;margin-top:6px} #pg-token .box input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 26px var(--mono);color:var(--fg);padding:0;letter-spacing:-.01em} #pg-token .box input::placeholder{color:var(--fg-3)}
#pg-token .box .outv{flex:1;min-width:0;font:500 26px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em} #pg-token .box .outv.dim{color:var(--fg-3)}
#pg-token .asset{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 6px;border-radius:999px;background:var(--bg-3);font-weight:600;font-size:13px;flex:none;max-width:140px} #pg-token .asset img{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:cover} #pg-token .asset span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg-token .box .br{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--fg-3);min-height:24px}
#pg-token .quick{display:flex;gap:4px} #pg-token .quick button{height:24px;padding:0 8px;border-radius:6px;background:var(--bg-3);font:500 11px var(--mono);color:var(--fg-2)} #pg-token .quick button:hover{background:var(--bg-4);color:var(--fg)}
#pg-token .slip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
#pg-token .slip .seg button{height:24px;padding:0 7px;font-size:12px;font-family:var(--mono)} #pg-token .slip input{width:64px;height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg-1);color:var(--fg);font:12px var(--mono);outline:0}
#pg-token .det{margin-top:8px} #pg-token .det .kv{padding:7px 0;font-size:12.5px} #pg-token .det .kv b.warn{color:var(--amber)} #pg-token .det .kv b.bad{color:var(--red)}
#pg-token .cta{margin-top:12px} #pg-token .cta.s{background:var(--red);border-color:var(--red);color:#fff} #pg-token .cta.s:hover{background:#ff7474}
#pg-token .note{margin:10px 0 0;font-size:12px;color:var(--fg-3);line-height:1.5}
#pg-token .side-sec h4{font-size:13px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;justify-content:space-between} #pg-token .side-sec .kv{font-size:13px}
#pg-token .mbar{display:none}
#pg-token .empty.card{padding:60px 20px}
@media(max-width:1100px){#pg-token .cols{grid-template-columns:minmax(0,1fr) 340px}}
@media(max-width:900px){
  #pg-token .cols{display:flex;flex-direction:column;align-items:stretch} #pg-token .left,#pg-token .right{display:contents}
  #pg-token .chart{order:1} #pg-token .right>*{order:2} #pg-token .panel{order:3}
  #pg-token .hd{grid-template-columns:52px minmax(0,1fr);gap:12px 14px} #pg-token .hd .lg{width:52px;height:52px;border-radius:12px} #pg-token .hd h1{font-size:22px}
  #pg-token .hd .pxb{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:10px} #pg-token .hd .pxb b{font-size:24px} #pg-token .hd .pxb small{margin:0}
  #pg-token .desc{grid-column:1/-1}
  #pg-token .info{grid-template-columns:1fr} #pg-token .right{position:static}
  #pg-token .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
  #pg-token .mbar .btn.s{background:var(--red);border-color:var(--red);color:#fff}
}
</style>
</head><body data-page="token">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-token">
  <div class="crumb" id="tk-crumb"></div>
  <div id="tk-page">
    <div class="hd" id="tk-head"></div>
    <div class="stats"><div class="figs sm" id="tk-stats"></div></div>
    <div class="cols">
      <div class="left">
        <div class="card chart"><div id="tv"></div></div>
        <div class="panel">
          <div class="tabs" id="tk-tabs"><button data-tab="trades" class="on">Trades</button><button data-tab="holders">Holders</button><button data-tab="top">Top traders</button><button data-tab="info">Info</button></div>
          <div class="pane on" data-pane="trades">
            <div class="ptools"><div class="seg" id="tk-filter"><button data-f="all" class="on">All</button><button data-f="buy">Buys</button><button data-f="sell">Sells</button></div><span class="num" id="tk-trades-n"></span></div>
            <div class="tw"><table class="tb"><thead><tr><th>Time</th><th>Side</th><th class="r" id="tk-th-coin">Amount</th><th class="r" id="tk-th-pair">Paid</th><th class="r">USD</th><th class="r">Price</th><th>Wallet</th><th class="r">Tx</th></tr></thead><tbody id="tk-trades"></tbody></table></div>
            <div class="more" id="tk-more"><button class="btn sm" id="tk-more-btn">Load more</button></div>
          </div>
          <div class="pane" data-pane="holders">
            <div class="tw"><table class="tb"><thead><tr><th>#</th><th>Wallet</th><th class="r">Balance</th><th class="r">Share</th><th class="r">Value</th></tr></thead><tbody id="tk-holders"></tbody></table></div>
          </div>
          <div class="pane" data-pane="top">
            <div class="tw"><table class="tb"><thead><tr><th>#</th><th>Wallet</th><th class="r">Volume</th><th class="r">Trades</th><th class="r">Holding</th></tr></thead><tbody id="tk-top"></tbody></table></div>
          </div>
          <div class="pane" data-pane="info"><div class="info" id="tk-info"></div></div>
        </div>
      </div>
      <aside class="right">
        <div class="card trade" id="tk-trade"><div class="cb">
          <div class="sides" id="tk-sides"><button data-side="buy" class="b on">Buy</button><button data-side="sell" class="s">Sell</button></div>
          <div class="box">
            <div class="lr"><span>You pay</span><span class="num" id="tk-bal-in"></span></div>
            <div class="ir"><input id="tk-amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount"><span class="asset" id="tk-asset-in"></span></div>
            <div class="br"><span class="num" id="tk-amt-usd"></span><div class="quick" id="tk-quick"><button data-q="25">25%</button><button data-q="50">50%</button><button data-q="100">Max</button></div></div>
          </div>
          <div class="box out">
            <div class="lr"><span>You receive</span><span class="num" id="tk-bal-out"></span></div>
            <div class="ir"><div class="outv dim" id="tk-out">0</div><span class="asset" id="tk-asset-out"></span></div>
            <div class="br"><span class="num" id="tk-out-usd"></span></div>
          </div>
          <div class="slip"><span>Slippage</span><div class="row"><div class="seg" id="tk-slip"><button data-sl="auto" class="on">Auto</button><button data-sl="0.5">0.5%</button><button data-sl="1">1%</button><button data-sl="3">3%</button><button data-sl="custom">Custom</button></div><input id="tk-slip-in" class="hidden" inputmode="decimal" placeholder="%" aria-label="Custom slippage"></div></div>
          <div class="det"><div class="kv"><span>Minimum received</span><b id="tk-min">—</b></div><div class="kv"><span id="tk-fee-l">Fee</span><b id="tk-fee">—</b></div><div class="kv"><span>Price impact</span><b id="tk-imp">—</b></div></div>
          <button class="btn pri lg block cta" id="tk-cta">Connect wallet</button>
          <p class="note" id="tk-note"></p>
        </div></div>
        <div class="side-sec hidden" id="tk-pos"><h4>Your position <span class="num muted" id="tk-pos-sym"></span></h4><div id="tk-pos-body"></div></div>
        <div class="side-sec hidden" id="tk-cre"><h4>Creator fees <span class="tag mint">Your coin</span></h4><div id="tk-cre-body"></div></div>
      </aside>
    </div>
    <div class="mbar" id="tk-mbar"><button class="btn pri lg" data-side="buy">Buy</button><button class="btn lg s" data-side="sell">Sell</button></div>
  </div>
  <div class="empty card hidden" id="tk-empty"></div>
</div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js"></script><script src="/data.js"></script><script src="/avatar.js"></script><script src="/chain.js"></script><script src="/wallet.js"></script><script src="/charting_library/charting_library.js"></script><script src="/tv.js"></script><script src="/core.js?v=2"></script><script src="/sp-token.js?v=2"></script>
</body></html>
