<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Token | StockPad</title><meta name="description" content="Price, chart, trades and holders for a coin launched on StockPad, paired with a tokenized stock on Ethereum.">
<link rel="icon" href="/img/favicon.svg?v=12" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=12"><meta name="theme-color" content="#0a0a0b">
<meta property="og:image" content="/img/og.png?v=12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=6">
<style>
/* token page, scoped under #pg-token */
#pg-token .mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding:22px 0 26px;border-bottom:1px solid var(--line)}
#pg-token .who{display:flex;align-items:flex-start;gap:20px;min-width:0}
#pg-token .id{min-width:0} #pg-token .id h1{font-size:44px} #pg-token .id h1 small{font:400 18px var(--mono);color:var(--fg-3);margin-left:12px;letter-spacing:0}
#pg-token .meta{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:10px;font:12.5px var(--mono);color:var(--fg-3)}
#pg-token .meta .pc{display:inline-flex;align-items:center;gap:7px;color:var(--fg);font-weight:600} #pg-token .meta .pc img{width:18px;height:18px;border-radius:50%;background:#fff} #pg-token .meta .pc:hover{color:var(--ac)}
#pg-token .meta .cpb{display:inline-flex;align-items:center;gap:4px;color:var(--fg-3)} #pg-token .meta .cpb:hover{color:var(--fg)} #pg-token .meta .cpb svg,#pg-token .meta .lk svg{width:12px;height:12px}
#pg-token .meta .lk{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-family:var(--sans)} #pg-token .meta .lk:hover{color:var(--fg)}
#pg-token .desc{margin-top:12px;color:var(--fg-2);font-size:14.5px;line-height:1.55;max-width:70ch}
#pg-token .by{margin-top:10px;font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
#pg-token .pxb{text-align:right;flex:none} #pg-token .pxb .lab{margin-bottom:6px} #pg-token .pxb b{display:block;font:500 40px/1 var(--mono);letter-spacing:-.02em} #pg-token .pxb small{display:block;margin-top:8px;font:13px var(--mono);color:var(--fg-3)} #pg-token .pxb small .num{font-size:13px}
#pg-token .stats{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;padding:8px 0 4px;border-bottom:1px solid var(--line)}
#pg-token .stats .lr{padding:10px 0} #pg-token .stats .lr>b{font-size:14px}
#pg-token .fl2{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:14px 0 18px;border-bottom:1px solid var(--line)} #pg-token .fl2 .flow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px} #pg-token .fl2 .flow .num{font-size:11.5px;color:var(--fg-2)}
#pg-token .fl2 .split .c{background:var(--ac)} #pg-token .fl2 .split .h{background:var(--amber)} #pg-token .fl2 .split .p{background:var(--fg-3)}
#pg-token .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;align-items:start;margin-top:24px}
#pg-token .left{min-width:0;display:flex;flex-direction:column;gap:24px}
#pg-token .right{position:sticky;top:calc(var(--top) + 20px);display:flex;flex-direction:column;gap:24px}
/* chart */
#pg-token .chart{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--s1)}
#pg-token .chart .ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font:500 13px var(--mono)} #pg-token .chart .ph2 .r{font-size:12px;color:var(--fg-3);font-weight:400}
#pg-token #tv{min-height:460px;height:460px;width:100%} #pg-token #tv .tvno{height:100%;min-height:460px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:13px}
/* tabs */
#pg-token .ptabs .ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} #pg-token .ptabs .tabs{flex:1}
#pg-token .pane{display:none} #pg-token .pane.on{display:block} #pg-token .tw{overflow-x:auto}
#pg-token .tb td.r small{text-align:right}
#pg-token .txl{color:var(--fg-3)} #pg-token .txl:hover{color:var(--fg)}
#pg-token .more{display:flex;justify-content:center;padding:12px}
#pg-token tr.new td{animation:tkflash 1.2s ease-out} @keyframes tkflash{from{background:var(--ac-dim)}to{background:transparent}}
#pg-token .info{padding:20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px} #pg-token .info h4{margin:0 0 10px;font:400 20px var(--serif)}
#pg-token .info p{margin:0 0 10px;font-size:13.5px;color:var(--fg-2);line-height:1.55} #pg-token .info .kv b{display:inline-flex;align-items:center;gap:6px;min-width:0} #pg-token .info .kv b a,#pg-token .info .kv b button{color:var(--fg-3)} #pg-token .info .kv b a:hover,#pg-token .info .kv b button:hover{color:var(--fg)}
#pg-token .info .kv b .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* order ticket */
#pg-token .ticket{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--s1);padding:18px}
#pg-token .ticket .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px} #pg-token .ticket .th h3{font-size:24px} #pg-token .ticket .th small{font:11px var(--mono);color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase}
#pg-token .sides{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
#pg-token .sides button{height:34px;border-radius:999px;font-weight:600;color:var(--fg-3)} #pg-token .sides button.on.b{background:var(--up-dim);color:var(--up)} #pg-token .sides button.on.s{background:var(--dn-dim);color:var(--dn)}
#pg-token .payw{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--fg-3);flex-wrap:wrap}
#pg-token .box{margin-top:10px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg)} #pg-token .box.out{border-color:var(--line)} #pg-token .box:focus-within{border-color:var(--ac)}
#pg-token .box .lr2{display:flex;justify-content:space-between;gap:10px;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)} #pg-token .box .lr2 .num{text-transform:none;letter-spacing:0;font-size:11.5px}
#pg-token .box .ir{display:flex;align-items:center;gap:10px;margin-top:8px} #pg-token .box input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 28px var(--mono);color:var(--fg);padding:0;letter-spacing:-.02em} #pg-token .box input::placeholder{color:var(--fg-3)}
#pg-token .box .outv{flex:1;min-width:0;font:500 28px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em} #pg-token .box .outv.dim{color:var(--fg-3)}
#pg-token .asset{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 6px;border:1px solid var(--line-2);border-radius:999px;background:var(--s2);font:600 13px var(--mono);flex:none;max-width:150px} #pg-token .asset img{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:cover} #pg-token .asset span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg-token .box .br2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font:12px var(--mono);color:var(--fg-3);min-height:24px}
#pg-token .quick{display:flex;gap:4px} #pg-token .quick button{height:24px;padding:0 9px;border:1px solid var(--line-2);border-radius:999px;font:500 11px var(--mono);color:var(--fg-2)} #pg-token .quick button:hover{border-color:var(--line-3);color:var(--fg)}
#pg-token .slip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font:12px var(--mono);color:var(--fg-3);flex-wrap:wrap}
#pg-token .slip .seg button{height:24px;padding:0 8px;font-size:12px;font-family:var(--mono)} #pg-token .slip input{width:64px;height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--fg);font:12px var(--mono);outline:0}
#pg-token .det{margin-top:10px} #pg-token .det .lr{padding:6px 0;font-size:12.5px} #pg-token .det .lr>b.warn{color:var(--amber)} #pg-token .det .lr>b.bad{color:var(--dn)}
#pg-token .cta{margin-top:14px;height:48px;font-size:15px} #pg-token .cta.s{background:var(--dn);border-color:var(--dn);color:#fff} #pg-token .cta.s:hover{background:#ff6b6b;border-color:#ff6b6b}
#pg-token .note{margin:12px 0 0;font-size:12px;color:var(--fg-3);line-height:1.5}
#pg-token .sidep{padding:0 2px} #pg-token .sidep .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:4px;border-bottom:1px solid var(--line)} #pg-token .sidep .sh small{font:11px var(--mono);color:var(--fg-3)}
#pg-token .sidep .kv{font-size:12.5px} #pg-token .sidep .btn{margin-top:12px}
#pg-token .empty.panel{padding:60px 20px;margin-top:24px}
@media(max-width:1100px){#pg-token .cols{grid-template-columns:minmax(0,1fr) 340px;gap:28px}}
@media(max-width:900px){
  #pg-token .cols{display:flex;flex-direction:column;align-items:stretch} #pg-token .left,#pg-token .right{display:contents}
  #pg-token .ticket{order:1} #pg-token .chart{order:2} #pg-token .sidep{order:3} #pg-token .ptabs{order:4}
  #pg-token .mast{grid-template-columns:1fr;gap:18px;align-items:start} #pg-token .pxb{text-align:left} #pg-token .id h1{font-size:34px} #pg-token .id h1 small{display:block;margin:6px 0 0;font-size:15px}
  #pg-token .stats,#pg-token .fl2{grid-template-columns:1fr;gap:0} #pg-token .fl2>div{padding:6px 0}
  #pg-token .info{grid-template-columns:1fr} #pg-token .right{position:static} #pg-token #tv{height:380px;min-height:380px}
  #pg-token .who{gap:14px} #pg-token .av2.big img.lg{width:56px;height:56px}
}
</style>
</head><body data-page="token">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-token">
  <div class="crumb" id="tk-crumb"></div>
  <div id="tk-page">
    <section class="mast" id="tk-head"></section>
    <div class="stats"><div class="ledger" id="tk-stats"></div><div class="ledger" id="tk-stats2"></div></div>
    <div class="fl2"><div><div class="flow"><span class="lab">Flow 24h</span><span class="num" id="tk-flow">…</span></div><div class="split" id="tk-split"></div></div><div><div class="flow"><span class="lab">Fee split</span><span class="num" id="tk-feespaid">…</span></div><div class="split" id="tk-feebar"></div></div></div>
    <div class="cols">
      <div class="left">
        <section class="chart"><div class="ph2"><span id="tk-chart-t"></span><span class="r" id="tk-chart-r"></span></div><div id="tv"></div></section>
        <section class="ptabs">
          <div class="ph2"><div class="tabs" id="tk-tabs"><button data-tab="trades" class="on">Trades<span class="num" id="tk-trades-n"></span></button><button data-tab="holders">Holders</button><button data-tab="top">Top traders</button><button data-tab="info">About</button></div><div class="seg" id="tk-filter"><button data-f="all" class="on">All</button><button data-f="buy">Buys</button><button data-f="sell">Sells</button></div></div>
          <div class="pane on" data-pane="trades">
            <div class="tw"><table class="tb"><thead><tr><th>Side</th><th>Trader</th><th class="r" id="tk-th-coin">Amount</th><th class="r" id="tk-th-pair">Paid</th><th class="r">USD</th><th class="r">Price</th><th>Time</th><th class="r">Tx</th></tr></thead><tbody id="tk-trades"></tbody></table></div>
            <div class="more" id="tk-more"><button class="btn sm line" id="tk-more-btn">Load more</button></div>
          </div>
          <div class="pane" data-pane="holders"><div class="tw"><table class="tb"><thead><tr><th>#</th><th>Wallet</th><th class="r">Balance</th><th class="r">Share</th><th class="r">Value</th></tr></thead><tbody id="tk-holders"></tbody></table></div></div>
          <div class="pane" data-pane="top"><div class="tw"><table class="tb"><thead><tr><th>#</th><th>Wallet</th><th class="r">Volume</th><th class="r">Trades</th><th class="r">Holding</th></tr></thead><tbody id="tk-top"></tbody></table></div></div>
          <div class="pane" data-pane="info"><div class="info" id="tk-info"></div></div>
        </section>
      </div>
      <aside class="right">
        <section class="ticket" id="tk-trade">
          <div class="th"><h3>Order ticket</h3><small id="tk-route-l">Uniswap v4</small></div>
          <div class="sides" id="tk-sides"><button data-side="buy" class="b on">Buy</button><button data-side="sell" class="s">Sell</button></div>
          <div class="payw"><span>Pay with</span><span class="badge" id="tk-payw">ETH</span><span class="muted" id="tk-payw-note"></span></div>
          <div class="box">
            <div class="lr2"><span>Amount</span><span class="num" id="tk-bal-in"></span></div>
            <div class="ir"><input id="tk-amt" inputmode="decimal" autocomplete="off" placeholder="0.0" aria-label="Amount"><span class="asset" id="tk-asset-in"></span></div>
            <div class="br2"><span id="tk-amt-usd"></span><div class="quick" id="tk-quick"><button data-q="25">25%</button><button data-q="50">50%</button><button data-q="100">Max</button></div></div>
          </div>
          <div class="box out">
            <div class="lr2"><span>You receive</span><span class="num" id="tk-bal-out"></span></div>
            <div class="ir"><div class="outv dim" id="tk-out">0</div><span class="asset" id="tk-asset-out"></span></div>
            <div class="br2"><span id="tk-out-usd"></span></div>
          </div>
          <div class="slip"><span>Slippage</span><div class="row"><div class="seg" id="tk-slip"><button data-sl="auto" class="on">Auto</button><button data-sl="0.5">0.5%</button><button data-sl="1">1%</button><button data-sl="3">3%</button><button data-sl="custom">Custom</button></div><input id="tk-slip-in" class="hidden" inputmode="decimal" placeholder="%" aria-label="Custom slippage"></div></div>
          <div class="det ledger"><div class="lr"><span>Minimum received</span><i></i><b id="tk-min">—</b></div><div class="lr"><span id="tk-fee-l">Fee</span><i></i><b id="tk-fee">—</b></div><div class="lr"><span>Price impact</span><i></i><b id="tk-imp">—</b></div></div>
          <button class="btn pri lg block cta" id="tk-cta">Connect wallet</button>
          <p class="note" id="tk-note"></p>
        </section>
        <section class="sidep hidden" id="tk-pos"><div class="sh">Your position<small class="num" id="tk-pos-sym"></small></div><div id="tk-pos-body"></div></section>
        <section class="sidep hidden" id="tk-cre"><div class="sh">Creator fees<small>your coin</small></div><div id="tk-cre-body"></div></section>
      </aside>
    </div>
  </div>
  <div class="empty panel hidden" id="tk-empty"></div>
</div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js"></script><script src="/data.js"></script><script src="/avatar.js"></script><script src="/chain.js"></script><script src="/wallet.js"></script><script src="/charting_library/charting_library.js"></script><script src="/tv.js"></script><script src="/core.js?v=6"></script><script src="/sp-token.js?v=6"></script>
</body></html>
