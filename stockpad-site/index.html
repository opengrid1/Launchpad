<script>
(function(){
  const CH=(window.INKY&&INKY.chains)||[], map=document.getElementById('ld-map'), cv=document.getElementById('ld-cv'), cx=cv.getContext('2d'), tip=document.getElementById('ld-tip'), hint=document.getElementById('ld-hint');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, N=CH.length, nLive=CH.filter(c=>c.live).length, has=typeof ic==='function';
  const words=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'], word=n=>words[n]||String(n);
  if(has){ document.getElementById('ld-app').innerHTML='Launch app'+ic('arrow');  }
  document.getElementById('ld-nchains').textContent=N;
  document.getElementById('ld-stack').innerHTML=`<img src="/img/logo.svg?v=15" alt="Equo">`+CH.slice(0,5).map(c=>`<img src="${c.logo}" alt="${c.name}" title="${c.name}">`).join('');
  document.getElementById('ld-pill').innerHTML=nLive===N?`<i></i>All ${N} chains live <em>Trade →</em>`:`<i></i>${CH.filter(c=>c.live).map(c=>c.name).join(', ')||'Equo'} is live <em>Trade →</em>`;
  document.getElementById('ld-lead').textContent=`Launch your coin on up to ${word(N)} chains at once, all at the same price. Holders move it between chains in about a minute.`;

  // land on a 2-degree grid over the whole world: longitude -180..180, latitude 72..-48, row by row, one bit per cell
  const COLS=180, ROWS=60, LAT1=72;
  const raw=atob('gBgACfwz/AD/+gAAA4AEHf///+/8gBAP/7/nJdjwD/+AAAH/AA7f///////f4P//////h8H/gAAAf/6//f////////Mf/////9H4D8AeAA+ev///////////AP/////4A0B4AAAD5/////////////Af3////gHgA4AAAH5///////////LwAHgH///gHkAAAAAH4/////////+CIAABAB///4D+AAAAGCx/////////4A8AAIAAf///n/gAAAOCD/////////wA4AAAAAf///n/wAAAbP///////////AgAAAAAP/////wAAADf//////////9AAAAAAAF////0YAAAB///////////9AAAAAAAD////8EAAAB///////////5AAAAAAAD////2AAAAB/f5fP//////wAAAAAAAD////gAAAAfxnwPP//////jAAAAAAAD////AAAAAPCb3/n/////+CAAAAAAAD///8AAAAAfALf/n////+ECAAAAAAAB///8AAAAAGHQP/n/////mMAAAAAAAA///8AAAAAH+Ai///////E8AAAAAAAAf//wAAAAAP/AA///////BgAAAAAAAAP//gAAAAAf/73///////gAAAAAAAAAD/AQAAAAAf////f/////gAAAAAAAAAF+AQAAAAB///+/n/////AAAAAAAAAAC+AAAAAAB///+f0H////AAAAAAAAAAAeAwAAAAD////f/B///8gAAAAAAAAAAeGEAAAAH////v+B/z/AAAAAAAAAAAAPMAgAAAD////n+A/B+gAAAAAAAAAAAD8AAAAAD////n4AeB/AgAAAAAAAAAAAPAAAAAH////3gAcAfAgAAAAAAAAAAADAAAAAD////6AAcAfggAAAAAAAAAAABDwAAAD////8wAMATAIAAAAAAAAAAAAr/AAAB/////gAKASAAAAAAAAAAAAAAH/gAAA/////gACAAAIAAAAAAAAAAAAH/8AAAaH///AAAAsGAAAAAAAAAAAAAH/+AAAAB//+AAAAUOAAAAAAAAAAAAAP/+AAAAB//8AAAAYegAAAAAAAAAAAAP//gAAAD//4AAAAMeBgAAAAAAAAAAAP//8AAAB//wAAAAGdiuAAAAAAAAAAAf///AAAA//wAAAACAQHgAAAAAAAAAAP///gAAA//wAAAABwAHwgAAAAAAAAAH///AAAA//wAAAAACIDQIAAAAAAAAAH//+AAAAf/wAAAAAAAAAAAAAAAAAAAD//+AAAA//wgAAAAABxAAAAAAAAAAAD//+AAAA//wgAAAAAPxgBAAAAAAAAAA//8AAAA//jgAAAAAf5gAAAAAAAAAAAf/8AAAA//DgAAAAAf/gAAAAAAAAAAAf/8AAAAf/DAAAAAD//4CAAAAAAAAAAf/wAAAAf/DAAAAAH//4AAAAAAAAAAAf/AAAAAf+CAAAAAH//8AAAAAAAAAAAf/AAAAAP8AAAAAAH//+AAAAAAAAAAA/+AAAAAP8AAAAAAH//+AAAAAAAAAAA/+AAAAAH4AAAAAAD//+AAAAAAAAAAA/8AAAAAHwAAAAAADwf8AAAAAAAAAAA/gAAAAAAAAAAAAACAH4AIAAAAAAAAB/wAAAAAAAAAAAAAAAD4AEAAAAAAAAB+AAAAAAAAAAAAAAAAAAAGAAAAAAAAB6AAAAAAAAAAAAAAAAAwAMAAAAAAAAA8AAAAAAAAAAAAAAAAAQAYAAAAAAAAB4AAAAAAAAAAAAAAAAAAAwAAAAAAAAB4AAAAAAAAAAAAAAAAAAAA'), land=i=>(raw.charCodeAt(i>>3)>>(7-(i&7)))&1;
  // each chain's region of the world: the land closest to its centres; the first centre carries the label
  const REG={base:[[-100,45],[-45,70]],unichain:[[-60,-15]],eth:[[15,52]],bsc:[[20,5]],hyper:[[66,25]],arbitrum:[[95,62]],monad:[[112,35]],megaeth:[[110,4]],sol:[[134,-25]]};
  const LBL={base:[-102,44],unichain:[-58,-12],eth:[2,47],bsc:[18,6],hyper:[70,21],arbitrum:[108,64],monad:[118,40],megaeth:[118,4],sol:[134,-26]};
  const wrap=d=>((d%360)+540)%360-180;
  const P=CH.map((c,i)=>{ const cs=REG[c.key]||[[-180+(i+.5)/N*360,15]];
    const el=document.createElement('div'); el.className='pl'+(c.live?' live':''); el.innerHTML=`<img src="${c.logo}" alt=""><span>${c.name}</span><span class="dot"></span>`; map.appendChild(el);
    const lb=LBL[c.key]||cs[0]; return {c,el,cs,lon:lb[0],lat:lb[1],x:0,y:0,vis:1}; });
  // every land cell, with the chain it belongs to
  const D=[]; for(let i=0;i<COLS*ROWS;i++){ if(!land(i)) continue; const lon=-180+(i%COLS+.5)*2, lat=LAT1-(Math.floor(i/COLS)+.5)*2; let best=0, bd=1e9;
    P.forEach((p,k)=>p.cs.forEach(([a,b])=>{ const dx=wrap(lon-a)*Math.cos((lat+b)/2*Math.PI/180), dy=lat-b, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=k; } }));
    D.push({lon,lat,k:best,s:Math.sqrt(Math.max(0,1-(lat/90)**2))}); }
  const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
  // an oval projection, cut flat at the top and bottom; `off` is the longitude at the centre, and dragging turns it
  let W=0,H=0,dpr=1,k=1,cxp=0,cyp=0,Rx=0,Ry=0,off=10,vel=0,drag=null,dragged=0,onScreen=true,hover=null,last=performance.now();
  function size(){ const r=map.getBoundingClientRect(); W=r.width; H=r.height; dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    k=Math.min(W/292,H/140); Ry=90*k; Rx=146*k; cxp=W/2; cyp=H/2+10*k; }
  const proj=(lon,lat)=>{ const l=wrap(lon-off), s=Math.sqrt(Math.max(0,1-(lat/90)**2)); return {x:cxp+l/180*Rx*s, y:cyp-lat*k, l}; };
  function draw(){ cx.clearRect(0,0,W,H);
    cx.save(); cx.beginPath(); cx.rect(0,cyp-80*k,W,140*k); cx.clip();
    cx.beginPath(); cx.ellipse(cxp,cyp,Rx,Ry,0,0,6.283); cx.fillStyle='rgba(255,255,255,.045)'; cx.fill(); cx.strokeStyle='rgba(255,255,255,.07)'; cx.lineWidth=1; cx.stroke(); cx.restore();
    const r=Math.max(.75,2*k*.34);
    P.forEach((p,i)=>{ cx.fillStyle=hexA(p.c.color,hover&&hover!==p?.35:.92); cx.beginPath(); D.forEach(d=>{ if(d.k!==i) return; const q=proj(d.lon,d.lat), rr=Math.max(.6,Math.min(r,2*k*d.s*.42)); cx.moveTo(q.x+rr,q.y); cx.arc(q.x,q.y,rr,0,6.283); }); cx.fill(); });
    P.forEach(p=>{ const q=proj(p.lon,p.lat); p.x=q.x; p.y=q.y; p.vis=Math.max(0,Math.min(1,(150-Math.abs(q.l))/30));
      p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px'; p.el.style.opacity=p.vis.toFixed(3); p.el.style.visibility=p.vis>0?'visible':'hidden'; p.el.style.pointerEvents=p.vis>.5?'auto':'none'; });
    stars(performance.now());
    if(hover){ if(hover.vis<.5) hideTip(); else placeTip(hover); } }
  // shooting stars from one chain's region to another's: a bright head, a fading tail, a ring where it lands
  const F=[]; let nextF=0;
  const bow=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2-Math.hypot(b.x-a.x,b.y-a.y)*.32});
  const along=(a,b,c,u)=>({x:(1-u)*(1-u)*a.x+2*(1-u)*u*c.x+u*u*b.x,y:(1-u)*(1-u)*a.y+2*(1-u)*u*c.y+u*u*b.y});
  function stars(now){ if(reduce) return;
    if(now>nextF){ const V=P.filter(p=>p.vis>.9); if(V.length>1){ const a=V[Math.floor(Math.random()*V.length)]; let b=a; while(b===a) b=V[Math.floor(Math.random()*V.length)]; F.push({a,b,t0:now,d:1100+Math.random()*700}); } nextF=now+380+Math.random()*520; }
    for(let i=F.length-1;i>=0;i--){ const f=F[i], t=(now-f.t0)/f.d, fade=Math.min(f.a.vis,f.b.vis); if(t>=1.35||fade<.2){ F.splice(i,1); continue; }
      const c=bow(f.a,f.b), head=Math.min(1,t), tail=Math.max(0,head-.5), out=t>1?Math.max(0,1-(t-1)*5):1;
      for(let j=0;j<20;j++){ const u0=tail+(head-tail)*j/20, u1=tail+(head-tail)*(j+1)/20, p0=along(f.a,f.b,c,u0), p1=along(f.a,f.b,c,u1), w=(j+1)/20;
        cx.strokeStyle=hexA(w<.55?f.a.c.color:f.b.c.color,w*fade*out); cx.lineWidth=.8+3.2*w; cx.lineCap='round'; cx.beginPath(); cx.moveTo(p0.x,p0.y); cx.lineTo(p1.x,p1.y); cx.stroke(); if(w>.6){ cx.strokeStyle=`rgba(255,255,255,${(w-.6)*1.6*fade*out})`; cx.lineWidth=1.2*w; cx.stroke(); } }
      if(t<1){ const h=along(f.a,f.b,c,head), g=cx.createRadialGradient(h.x,h.y,0,h.x,h.y,18); g.addColorStop(0,`rgba(255,255,255,${fade})`); g.addColorStop(.22,hexA(f.b.c.color,.9*fade)); g.addColorStop(1,hexA(f.b.c.color,0)); cx.fillStyle=g; cx.beginPath(); cx.arc(h.x,h.y,18,0,6.283); cx.fill(); }
      else { const rr=8+(t-1)*110; cx.strokeStyle=hexA(f.b.c.color,Math.max(0,.9-(t-1)*2.6)*fade); cx.lineWidth=2.4; cx.beginPath(); cx.arc(f.b.x,f.b.y,rr,0,6.283); cx.stroke(); } } }
  function frame(now){ const dt=Math.min(50,now-last); last=now; requestAnimationFrame(frame); if(!onScreen) return;
    if(!drag){ off+=(vel+(reduce||hover?0:.003))*dt; vel*=Math.pow(.93,dt/16); if(Math.abs(vel)<1e-4) vel=0; } off=wrap(off); draw(); }
  function placeTip(p){ const tw=tip.offsetWidth||220, th=tip.offsetHeight||140; let x=p.x+24, y=p.y-20; if(x+tw>W-6) x=p.x-24-tw; if(y+th>H-6) y=p.y-th-14; tip.style.left=Math.max(6,Math.min(W-tw-6,x))+'px'; tip.style.top=Math.max(6,y)+'px'; }
  function hideTip(){ if(hover) hover.el.classList.remove('on'); hover=null; tip.classList.remove('on'); }
  P.forEach(p=>{ const c=p.c; const show=()=>{ hover=p; P.forEach(o=>o.el.classList.toggle('on',o===p));
      tip.innerHTML=`<div class="th"><img src="${c.logo}" alt="">${c.name}${c.main?' <span class="mainb">Main</span>':''}</div><div class="kv"><span>Status</span><b>${c.live?'Live':'Coming soon'}</b></div><div class="kv"><span>Pays in</span><b>${c.native||'ETH'}</b></div><div class="kv"><span>Address</span><b>${c.evm===false?'its own, on Solana':'same on every EVM chain'}</b></div><div class="kv"><span>Pool</span><b>${c.evm===false?'its own, on Solana':'Uniswap v4'}</b></div>`;
      tip.classList.add('on'); placeTip(p); };
    p.el.addEventListener('mouseenter',()=>{ if(!drag) show(); }); p.el.addEventListener('mouseleave',hideTip);
    p.el.addEventListener('click',e=>{ e.stopPropagation(); if(performance.now()-dragged<250) return; hover===p?hideTip():show(); }); });
  document.addEventListener('click',()=>{ if(hover&&performance.now()-dragged>250) hideTip(); });
  // drag sideways to turn the world (vertical swipes still scroll the page)
  map.addEventListener('pointerdown',e=>{ if(e.button!==0) return; drag={id:e.pointerId,x:e.clientX,off0:off,lx:e.clientX,lt:performance.now(),moved:false}; vel=0; });
  map.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x;
    if(!drag.moved&&Math.abs(dx)>5){ drag.moved=true; map.classList.add('drag'); hideTip(); try{ map.setPointerCapture(e.pointerId); }catch(_){} hint.classList.add('off'); }
    if(!drag.moved) return; const now=performance.now(), deg=-(e.clientX-drag.lx)/Rx*180; off=drag.off0-dx/Rx*180; if(now>drag.lt) vel=.7*vel+.3*deg/(now-drag.lt); drag.lx=e.clientX; drag.lt=now; });
  const end=e=>{ if(!drag||(e&&e.pointerId!==drag.id)) return; if(drag.moved){ dragged=performance.now(); if(performance.now()-drag.lt>80) vel=0; vel=Math.max(-.6,Math.min(.6,vel)); } else vel=0; drag=null; map.classList.remove('drag'); };
  map.addEventListener('pointerup',end); map.addEventListener('pointercancel',end); map.addEventListener('lostpointercapture',e=>{ if(e.target===map) end(e); });
  if('IntersectionObserver' in window) new IntersectionObserver(es=>{ onScreen=es[0].isIntersecting; }).observe(map);
  size(); addEventListener('resize',size); requestAnimationFrame(frame);

  // the sky behind the hero: faint twinkling stars, and now and then a shooting star
  (function(){ const sky=document.getElementById('ld-sky'), g=sky.getContext('2d'); let w=0,h=0,r=1,next=performance.now()+1200; const S=[], M=[];
    function fit(){ const b=sky.getBoundingClientRect(); w=b.width; h=b.height; r=Math.min(2,window.devicePixelRatio||1); sky.width=w*r; sky.height=h*r; g.setTransform(r,0,0,r,0,0);
      S.length=0; for(let i=0;i<Math.round(w*h/9000);i++) S.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.1+.25,t:Math.random()*6.28,v:.5+Math.random()*1.4}); }
    function tick(now){ requestAnimationFrame(tick); if(!w) return; g.clearRect(0,0,w,h);
      S.forEach(p=>{ const a=reduce?.45:.18+.45*(.5+.5*Math.sin(now*.0012*p.v+p.t)); g.fillStyle=`rgba(205,228,255,${a})`; g.beginPath(); g.arc(p.x,p.y,p.s,0,6.283); g.fill(); });
      if(reduce) return;
      if(now>next){ const ang=(Math.PI/180)*(18+Math.random()*22), sp=.9+Math.random()*.6; M.push({x:w*(.25+Math.random()*.7),y:Math.random()*h*.45,dx:-Math.cos(ang)*sp,dy:Math.sin(ang)*sp,t0:now,d:1000+Math.random()*700,len:170+Math.random()*170}); next=now+1200+Math.random()*2200; }
      for(let i=M.length-1;i>=0;i--){ const m=M[i], t=(now-m.t0)/m.d; if(t>=1){ M.splice(i,1); continue; } const e=now-m.t0, x=m.x+m.dx*e, y=m.y+m.dy*e, a=Math.sin(Math.PI*t);
        const tx=x-m.dx/Math.hypot(m.dx,m.dy)*m.len, ty=y-m.dy/Math.hypot(m.dx,m.dy)*m.len, gr=g.createLinearGradient(x,y,tx,ty);
        gr.addColorStop(0,`rgba(255,255,255,${.95*a})`); gr.addColorStop(.25,`rgba(127,212,255,${.55*a})`); gr.addColorStop(1,'rgba(63,188,255,0)');
        g.strokeStyle=gr; g.lineWidth=2.2; g.lineCap='round'; g.beginPath(); g.moveTo(x,y); g.lineTo(tx,ty); g.stroke();
        const hg=g.createRadialGradient(x,y,0,x,y,9); hg.addColorStop(0,`rgba(255,255,255,${a})`); hg.addColorStop(1,'rgba(127,212,255,0)'); g.fillStyle=hg; g.beginPath(); g.arc(x,y,9,0,6.283); g.fill(); } }
    fit(); addEventListener('resize',fit); requestAnimationFrame(tick); })();

  // trending: the busiest coins, sliding past; hidden until there are coins to show
  const trend=document.getElementById('ld-trend'), belt=document.getElementById('ld-belt'), pause=document.getElementById('ld-pause');
  const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>', PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
  pause.innerHTML=PAUSE; pause.onclick=()=>{ const p=trend.classList.toggle('paused'); pause.innerHTML=p?PLAY:PAUSE; pause.setAttribute('aria-label',p?'Play':'Pause'); };
  let seen='';
  function trending(){ const L=(typeof TOK!=='undefined'?TOK:[]).filter(x=>!x.hidden).slice().sort((a,b)=>(b.vol||0)-(a.vol||0)||(b.mc||0)-(a.mc||0)).slice(0,12);
    if(!L.length||typeof SP==='undefined'){ trend.classList.add('hidden'); return; }
    const key=L.map(x=>x.addr+':'+Math.round(x.mc||0)+':'+Math.round((x.c24||0)*10)).join(','); if(key===seen) return; seen=key;
    const card=x=>{ const ch=x.c24||0; return `<a class="tc" href="/token/${x.addr}"><img src="${SP.coinLogo(x)}" alt="" onerror="this.onerror=null;this.src='${DEF_LOGO}'"><span class="a"><b>${esc(x.n)}</b><span>$${esc(x.t)}</span></span><span class="b"><b class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${ch.toFixed(2)}%</b><span>MC ${fmtUsd(x.mc||0)}</span></span></a>`; };
    // the list twice, so the belt can loop without a gap
    const one=L.map(card).join(''); belt.innerHTML=one+one; belt.style.setProperty('--dur',Math.max(20,L.length*5)+'s'); trend.classList.remove('hidden'); }
  if(typeof SP!=='undefined'&&SP.onUpdate) SP.onUpdate(trending); setTimeout(trending,1500); setInterval(trending,30000);
})();
</script>
</body></html>
