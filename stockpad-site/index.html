<style>

#pg-markets .hero{position:relative;overflow:hidden;padding:36px 36px 32px;border-radius:var(--r-xl);background:radial-gradient(1200px 400px at 85% 0%,rgba(47,211,138,.10),transparent 60%),var(--s1)}

#pg-markets .cc .rb{position:absolute;right:14px;top:-10px;background:var(--s1)}
#pg-markets .cc .spark{margin:14px 0 6px;height:72px}
#pg-markets .cc .flow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 6px} #pg-markets .cc .flow .num{font-size:11.5px;color:var(--fg-2)}
#pg-markets .cc .sboxes{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
#pg-markets .empty{grid-column:1/-1;border:1px dashed var(--line-2);border-radius:var(--r-lg)}
@media(max-width:1100px){#pg-markets .cards{grid-template-columns:repeat(2,minmax(0,1fr))} #pg-markets .hfloat{display:none} #pg-markets .hero .art{opacity:.5}}
