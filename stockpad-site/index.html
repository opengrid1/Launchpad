<style>
/* hero banner */
#pg-markets .hero{position:relative;overflow:hidden;padding:30px 30px 28px;border-radius:var(--r-xl);background:radial-gradient(1100px 380px at 80% 0%,rgba(63,188,255,.08),transparent 60%),var(--s1);min-height:330px}
#pg-markets .hero .art{position:absolute;right:-40px;bottom:-10px;width:760px;height:320px;pointer-events:none;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%),linear-gradient(180deg,transparent 0,#000 30%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 45%),linear-gradient(180deg,transparent 0,#000 30%);mask-composite:intersect}
#pg-markets .hero .hl{position:relative;z-index:2;max-width:560px}
#pg-markets .hero .lab{margin-bottom:10px;color:var(--fg-3);font-size:11px}
#pg-markets .hero h1{font-size:44px;letter-spacing:-.48px;line-height:1.05} #pg-markets .hero h1 em{font-style:normal;color:var(--ac)}
#pg-markets .hstocks{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#pg-markets .hs{display:flex;align-items:center;gap:10px;height:49px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s2);min-width:175px} #pg-markets .hs img{width:26px;height:26px;border-radius:50%;background:#fff} #pg-markets .hs b{display:block;font:600 12px var(--mono)} #pg-markets .hs small{display:block;font:12px var(--mono);color:var(--fg-2);margin-top:1px} #pg-markets .hs small .cnt{color:var(--up);margin-left:6px} #pg-markets .hs small .mk{color:var(--fg-3);margin-left:6px}
#pg-markets .hacts{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap;align-items:center} #pg-markets .chev{font:700 24px var(--disp);color:var(--ac);opacity:.45;letter-spacing:-.12em;user-select:none}
#pg-markets .hfloat{position:absolute;right:120px;top:64px;z-index:2;display:flex;flex-direction:column;gap:14px;width:330px}
#pg-markets .hf{display:block;position:relative;padding:12px 14px;border:1px solid var(--line-2);border-radius:14px;background:rgba(10,10,11,.92);backdrop-filter:blur(6px);transition:border-color .12s} #pg-markets .hf:hover{border-color:var(--ac-line)} #pg-markets .hf:nth-child(2){margin-left:210px;margin-top:-6px}
#pg-markets .hf .t{display:flex;align-items:center;gap:10px} #pg-markets .hf .t .av2 img.lg{width:34px;height:34px;border-radius:50%;background:var(--s3);border:1px solid var(--line-2);object-fit:cover} #pg-markets .hf .t .stb{width:16px;height:16px} #pg-markets .hf .t b{display:block;font:600 14px var(--mono)} #pg-markets .hf .t b span{color:var(--fg-3);font-weight:400;margin-left:6px;font-family:var(--sans)} #pg-markets .hf .t small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-3);margin-top:2px} #pg-markets .hf .t small img{width:14px;height:14px;border:0}
#pg-markets .hf .b{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)} #pg-markets .hf .b b{font:600 17px var(--mono)} #pg-markets .hf .b b small{font:12px var(--sans);color:var(--fg-3);margin-left:6px;font-weight:400}
#pg-markets .hf .badge{position:absolute;right:-30px;top:-12px}
#pg-markets .figs{display:none}
/* filter bar */
#pg-markets .fbar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
#pg-markets .fbar .sep{width:1px;height:24px;background:var(--line-2);margin:0 4px}
#pg-markets .fbar .q{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;min-width:334px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--s1);color:var(--fg-3)} #pg-markets .fbar .q input{flex:1;background:none;border:0;outline:0;color:var(--fg);min-width:0;font-size:12px}
/* coin cards, measured from the reference: 442x232, 16px padding, 12px radius */
#pg-markets .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
#pg-markets .cc{display:block;position:relative;padding:16px;border-radius:12px;background:var(--s2);transition:border-color .12s,box-shadow .12s} #pg-markets .cc:hover{border-color:rgba(63,188,255,.5);box-shadow:0 0 24px rgba(63,188,255,.08)}
#pg-markets .cc .top{display:flex;align-items:flex-start;gap:12px}
#pg-markets .cc .lg{width:42px;height:42px;border-radius:50%;background:var(--s3);border:1px solid var(--line-2);object-fit:cover;flex:none} #pg-markets .cc .mk{display:inline-flex;align-items:center;gap:5px;font:10px var(--mono);color:var(--fg-3);white-space:nowrap} #pg-markets .cc .mk .dot{margin:0}
#pg-markets .cc .nm{flex:1;min-width:0} #pg-markets .cc .nm .t{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-height:22px} #pg-markets .cc .nm b{font:600 15px/1.5 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #pg-markets .cc .nm .sym{font:400 12px var(--mono);color:var(--fg-3);white-space:nowrap}
#pg-markets .cc .meta{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:nowrap;font:11px var(--mono);color:var(--fg-3);min-width:0} #pg-markets .cc .meta .cpb{display:inline-flex;align-items:center;gap:4px;color:var(--fg-3);white-space:nowrap} #pg-markets .cc .meta .cpb:hover{color:var(--fg)} #pg-markets .cc .meta .cpb svg{width:12px;height:12px}
#pg-markets .cc .pairline{font:600 12px var(--disp);color:var(--fg);gap:6px} #pg-markets .cc .pairline img{width:18px;height:18px} #pg-markets .cc .pairline .sl{color:var(--line-2)} #pg-markets .cc .pairline .st{color:var(--ac)}
#pg-markets .cc .age{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:11px/1.5 var(--sans);color:var(--fg-3);white-space:nowrap}
#pg-markets .cc .rb{position:absolute;right:12px;top:-11px}
#pg-markets .cc .sp{margin-top:14px} #pg-markets .cc .spark{height:40px;margin:0}
#pg-markets .cc .flow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 4px;min-height:15px} #pg-markets .cc .flow .lab{font:400 10px/15px var(--sans);letter-spacing:0;text-transform:none} #pg-markets .cc .flow .lab::first-letter{text-transform:uppercase} #pg-markets .cc .flow .num{font:400 10px/15px var(--mono);color:var(--fg-3)}
#pg-markets .cc .split{height:6px;background:var(--line-2)}
#pg-markets .cc .sboxes{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px} #pg-markets .cc .sbox{padding:6px 8px;border-radius:10px;background:rgba(10,10,11,.8);border:1px solid rgba(255,255,255,.05)} #pg-markets .cc .sbox .lab{font:400 10px/15px var(--sans);letter-spacing:0;text-transform:none} #pg-markets .cc .sbox .lab::first-letter{text-transform:uppercase} #pg-markets .cc .sbox b{font:600 13px/19.5px var(--mono);margin:0}
#pg-markets .empty{grid-column:1/-1;border:1px dashed var(--line-2);border-radius:var(--r-xl)}
@media(max-width:1100px){#pg-markets .cards{grid-template-columns:repeat(2,minmax(0,1fr))} #pg-markets .hfloat{display:none} #pg-markets .hero .art{opacity:.5}}
@media(max-width:640px){#pg-markets .hfloat{display:flex} #pg-markets .hf .badge{right:10px}}
@media(max-width:640px){#pg-markets .hero{padding:22px 16px 20px} #pg-markets .hero h1{font-size:30px} #pg-markets .hero .art{width:520px;right:-120px;opacity:.35} #pg-markets .hs{height:46px;flex:1;min-width:calc(50% - 4px)} #pg-markets .hacts{justify-content:center} #pg-markets .hfloat{display:flex;position:static;width:auto;margin-top:16px} #pg-markets .hf:nth-child(2){margin-left:0} #pg-markets .figs{grid-template-columns:1fr 1fr} #pg-markets .cards{grid-template-columns:1fr} #pg-markets .fbar .q{min-width:0;width:100%;margin:0} #pg-markets .fbar .sep{display:none}}
