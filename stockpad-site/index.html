<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StockPad · Markets</title><meta name="description" content="Launch and trade coins paired with real stocks on Ethereum. Fixed supply, permanent liquidity, fees paid in the stock.">
<link rel="icon" href="/img/favicon.svg?v=9" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=9"><meta name="theme-color" content="#0b0f14">
<meta property="og:title" content="StockPad"><meta property="og:description" content="Launch coins paired with real stocks on Ethereum."><meta property="og:image" content="/img/og.png?v=9"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=1">
<style>
#pg-markets .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
#pg-markets .tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#pg-markets .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
#pg-markets .cc{display:block;padding:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .15s,transform .15s}
#pg-markets .cc:hover{border-color:var(--line-2);transform:translateY(-1px)}
#pg-markets .cc .hd{display:flex;align-items:center;gap:10px} #pg-markets .cc .lg{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--bg-3);flex:none}
#pg-markets .cc .nm{min-width:0;flex:1} #pg-markets .cc .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #pg-markets .cc .nm small{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px;margin-top:2px}
#pg-markets .cc .px{text-align:right} #pg-markets .cc .px b{display:block;font:600 15px var(--mono)} #pg-markets .cc .px span{font:12px var(--mono)}
#pg-markets .cc .kv4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#pg-markets .cc .kv4 small{display:block;font-size:11px;color:var(--fg-3)} #pg-markets .cc .kv4 b{display:block;font:500 13px var(--mono);margin-top:2px}
#pg-markets .cc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--fg-3)}
#pg-markets .stocksec{margin-top:34px} #pg-markets .sc{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg)}
#pg-markets .sc img{width:34px;height:34px;border-radius:50%;background:#fff} #pg-markets .sc .nm{flex:1;min-width:0} #pg-markets .sc .nm b{display:block} #pg-markets .sc .nm small{color:var(--fg-3);font-size:12px}
#pg-markets .sc .px{text-align:right;font-family:var(--mono)} #pg-markets .sc .px b{display:block;font-weight:600} #pg-markets .sc .px small{color:var(--fg-3);font-size:11px}
#pg-markets .view{display:none} #pg-markets .view.on{display:block}
@media(max-width:1100px){#pg-markets .strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){#pg-markets .cards{grid-template-columns:1fr}}
</style>
</head><body data-page="markets">
<div id="sp-app"><aside id="sp-side"></aside><div id="sp-body"><header id="sp-top"></header><div id="sp-ticker"></div><main id="sp-main"><div id="pg-markets">
  <div class="ph"><div><h1 id="mk-title">Markets</h1><p id="mk-sub">Coins paired with real stocks on Ethereum. Fees settle in the stock.</p></div><a class="btn pri" href="/launch">Launch a coin</a></div>
  <div class="strip" id="mk-strip"></div>
  <div class="tools"><div class="chips" id="mk-chips"></div><div class="row"><div class="seg" id="mk-sort"><button data-s="trend" class="on">Trending</button><button data-s="new">New</button><button data-s="vol">Volume</button><button data-s="mc">Market cap</button></div><div class="seg" id="mk-view"><button data-v="grid" class="on" title="Cards">${grid}</button><button data-v="list" title="Table">${list}</button></div></div></div>
  <div class="view on" id="mk-grid"><div class="cards" id="mk-cards"></div></div>
  <div class="view" id="mk-list"><div class="card"><table class="tb" id="mk-table"><thead><tr><th>Coin</th><th>Stock</th><th class="r">Price</th><th class="r">24h</th><th class="r">Market cap</th><th class="r">Volume 24h</th><th class="r">Liquidity</th><th class="r">Fee</th><th class="r">Holders</th><th class="r">Age</th></tr></thead><tbody></tbody></table></div></div>
  <div class="stocksec"><div class="ph"><div><h1 style="font-size:17px">Stocks you can pair with</h1><p>Tokenized by Ondo, priced by Chainlink. Pick one on the launch page.</p></div></div><div class="grid g3" id="mk-stocks"></div></div>
</div></main></div></div>
<script src="/config.js"></script><script src="/data.js"></script><script src="/avatar.js"></script><script src="/chain.js"></script><script src="/wallet.js"></script><script src="/core.js?v=1"></script><script src="/sp-home.js?v=1"></script>
</body></html>
