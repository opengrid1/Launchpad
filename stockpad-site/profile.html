<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio | Equo</title><meta name="description" content="Your coin holdings, claimable holder rewards, creator fees and trade history on Equo.">
<link rel="icon" href="/img/favicon.svg?v=16" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=16"><meta name="theme-color" content="#0a0a0b">
<meta property="og:title" content="Portfolio | Equo"><meta property="og:description" content="Holdings, holder rewards and creator fees in one place."><meta property="og:image" content="/img/og.png?v=17"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=25">
<style>
#pg-portfolio .who{display:flex;align-items:center;gap:16px;padding:18px 20px;flex-wrap:wrap}
#pg-portfolio .who .av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:var(--s3);border:1px solid var(--line-2)} #pg-portfolio .who .av svg{width:100%;height:100%;display:block}
#pg-portfolio .who .id{flex:1;min-width:0} #pg-portfolio .who .id h1{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pg-portfolio .who .id .addrline{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;font:12.5px var(--mono)}
#pg-portfolio .who .id .addrline .addr{color:var(--fg-2)} #pg-portfolio .who .id .addrline .cp{font-size:12px} #pg-portfolio .who .id .addrline .cp svg{width:13px;height:13px}
#pg-portfolio .who .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pg-portfolio .strip{padding:0 20px 20px} #pg-portfolio .strip .sboxes{grid-template-columns:repeat(4,minmax(0,1fr))}
#pg-portfolio .sbox b.up{color:var(--ac)}
#pg-portfolio .tabsrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
#pg-portfolio .pane{display:none} #pg-portfolio .pane.on{display:block}
#pg-portfolio .tb .side{font-weight:600} #pg-portfolio .tb .coin .lg{width:34px;height:34px}
#pg-portfolio .tb th:first-child,#pg-portfolio .tb td:first-child{padding-left:16px} #pg-portfolio .tb th:last-child,#pg-portfolio .tb td:last-child{padding-right:16px}
#pg-portfolio .tb td.act{text-align:right;width:1%;white-space:nowrap} #pg-portfolio .tb td.act .btn+.btn{margin-left:6px} #pg-portfolio .tb tr.go td.act{cursor:default}
#pg-portfolio .tb a.tx{display:inline-flex;align-items:center;gap:4px;color:var(--fg-3)} #pg-portfolio .tb a.tx:hover{color:var(--fg)} #pg-portfolio .tb a.tx svg{width:14px;height:14px}
#pg-portfolio .gate{max-width:460px;margin:48px auto;padding:36px 28px;text-align:center}
#pg-portfolio .gate .ico{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;background:var(--ac-dim);color:var(--ac);display:flex;align-items:center;justify-content:center} #pg-portfolio .gate .ico svg{width:24px;height:24px}
#pg-portfolio .gate h1{margin:0 0 8px;font-size:24px} #pg-portfolio .gate p{margin:0 0 20px;color:var(--fg-2);font-size:14.5px}
#pg-portfolio .viewonly{margin-bottom:14px} #pg-portfolio .cimg{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px}
@media(max-width:1100px){#pg-portfolio .strip .sboxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){#pg-portfolio .who{padding:14px;gap:12px} #pg-portfolio .who .av{width:48px;height:48px} #pg-portfolio .who .id h1{font-size:20px} #pg-portfolio .who .acts{width:100%} #pg-portfolio .who .acts .btn{flex:1} #pg-portfolio .strip{padding:0 14px 14px}}
</style>
</head><body data-page="portfolio">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-portfolio">
  <div id="pf-gate" class="gate hidden"><div class="ico"></div><h1>Portfolio</h1><p>Connect your wallet to see your coins on every chain and your creator fees</p><button class="btn pri lg" id="pf-connect">Connect wallet</button></div>
  <div id="pf-body" class="hidden">
    <div class="panel"><div class="who"><div class="id"><h1>Portfolio <span id="pf-tags"></span></h1><div class="addrline"><span class="addr" id="pf-addr"></span><button class="cp" id="pf-copy" title="Copy address"></button><a class="cp" id="pf-ext" target="_blank" rel="noopener noreferrer" title="View on Etherscan"></a></div></div><div class="acts" id="pf-acts"></div></div><div class="strip"><div class="sboxes" id="pf-strip"></div></div></div>
    <div id="pf-notice" style="margin-top:14px"></div>
    <div class="tabsrow"><div class="tabs" id="pf-tabs"><button data-t="hold" class="on">Holdings<span class="num" id="pf-n-hold"></span></button><button data-t="made">Created<span class="num" id="pf-n-made"></span></button><button data-t="act">Activity<span class="num" id="pf-n-act"></span></button></div></div>
    <div class="pane on" data-p="hold"><table class="tb lg" id="pf-hold"><thead><tr><th>Coin</th><th>Chains</th><th class="r">Balance</th><th class="r">Value</th><th class="act"></th></tr></thead><tbody></tbody></table></div>
    <div class="pane" data-p="made"><table class="tb lg" id="pf-made"><thead><tr><th>Coin</th><th>Chains</th><th class="r">Market cap</th><th class="r">Volume 24h</th><th class="r">Creator fees waiting</th><th class="act"></th></tr></thead><tbody></tbody></table></div>
    <div class="pane" data-p="act"><table class="tb" id="pf-act"><thead><tr><th>Time</th><th>Side</th><th>Coin</th><th>Chain</th><th class="r">Amount</th><th class="r">Paid / received</th><th class="r">Value</th><th class="act">Tx</th></tr></thead><tbody></tbody></table></div>
  </div>
</div></div></main>
<footer id="sp-foot"></footer>

</body></html>
