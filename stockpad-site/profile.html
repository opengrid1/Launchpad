<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio | StockPad</title><meta name="description" content="Your coin holdings, claimable holder rewards, creator fees and trade history on StockPad.">
<link rel="icon" href="/img/favicon.svg?v=11" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=11"><meta name="theme-color" content="#0a0a0b">
<meta property="og:title" content="Portfolio | StockPad"><meta property="og:description" content="Holdings, holder rewards and creator fees in one place."><meta property="og:image" content="/img/og.png?v=11"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=6">
<style>
#pg-portfolio .ph{padding:40px 0 24px;border-bottom:1px solid var(--line);align-items:center}
#pg-portfolio .who{display:flex;align-items:center;gap:18px;min-width:0}
#pg-portfolio .who .av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:var(--s3);border:1px solid var(--line-2)} #pg-portfolio .who .av svg{width:100%;height:100%;display:block}
#pg-portfolio .who h1{font-size:44px;display:flex;align-items:center;gap:12px;flex-wrap:wrap} #pg-portfolio .who h1 .badge{vertical-align:middle}
#pg-portfolio .addrline{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;font:13px var(--mono)} #pg-portfolio .addrline .addr{color:var(--fg-2)} #pg-portfolio .addrline .cp svg{width:13px;height:13px}
#pg-portfolio .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pg-portfolio .totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px;padding:14px 0 8px;border-bottom:1px solid var(--line)} #pg-portfolio .totals .lr{padding:8px 0} #pg-portfolio .totals .lr>b{font-size:15px} #pg-portfolio .totals .lr>b.up{color:var(--up)}
#pg-portfolio .tabsrow{margin:18px 0 0}
#pg-portfolio .pane{display:none} #pg-portfolio .pane.on{display:block}
#pg-portfolio .tb .side{font-weight:600} #pg-portfolio .tb td.act{text-align:right;width:1%} #pg-portfolio .tb tr.go td.act{cursor:default}
#pg-portfolio .tb a.tx{display:inline-flex;align-items:center;gap:4px;color:var(--fg-3)} #pg-portfolio .tb a.tx:hover{color:var(--fg)} #pg-portfolio .tb a.tx svg{width:14px;height:14px}
#pg-portfolio .gate{max-width:520px;margin:72px auto;text-align:center}
#pg-portfolio .gate .ico{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:var(--ac-dim);color:var(--ac);display:flex;align-items:center;justify-content:center} #pg-portfolio .gate .ico svg{width:24px;height:24px}
#pg-portfolio .gate h1{margin:0 0 10px;font-size:40px} #pg-portfolio .gate p{margin:0 0 22px;color:var(--fg-2);font-size:15px}
#pg-portfolio .viewonly{margin:14px 0 0}

@media(max-width:640px){#pg-portfolio .ph{padding:24px 0 16px} #pg-portfolio .who{gap:12px} #pg-portfolio .who .av{width:48px;height:48px} #pg-portfolio .who h1{font-size:30px} #pg-portfolio .acts{width:100%} #pg-portfolio .acts .btn{flex:1} #pg-portfolio .totals{grid-template-columns:1fr;gap:0}}
</style>
</head><body data-page="portfolio">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-portfolio">
  <div id="pf-gate" class="gate hidden"><div class="ico"></div><h1>Your <em>statement</em>.</h1><p>Connect a wallet to see holdings, claimable holder rewards and creator fees.</p><button class="btn pri lg" id="pf-connect">Connect wallet</button></div>
  <div id="pf-body" class="hidden">
    <div class="ph"><div class="who"><div class="av" id="pf-av"></div><div><h1>Statement <span id="pf-tags"></span></h1><div class="addrline"><span class="addr" id="pf-addr"></span><button class="cp" id="pf-copy" title="Copy address"></button><a class="cp" id="pf-ext" target="_blank" rel="noopener noreferrer" title="View on Etherscan"></a></div></div></div><div class="acts" id="pf-acts"></div></div>
    <div class="totals ledger" id="pf-strip"></div>
    <div id="pf-notice"></div>
    <div class="tabsrow"><div class="tabs" id="pf-tabs"><button data-t="hold" class="on">Holdings<span class="num" id="pf-n-hold"></span></button><button data-t="made">Created<span class="num" id="pf-n-made"></span></button><button data-t="act">Activity<span class="num" id="pf-n-act"></span></button></div></div>
    <div class="pane on" data-p="hold"><table class="tb" id="pf-hold"><thead><tr><th>Coin</th><th>Pair</th><th class="r">Balance</th><th class="r">Value</th><th class="r">Pending rewards</th><th class="act"></th></tr></thead><tbody></tbody></table></div>
    <div class="pane" data-p="made"><table class="tb" id="pf-made"><thead><tr><th>Coin</th><th>Pair</th><th class="r">Market cap</th><th class="r">Volume 24h</th><th class="r">Fees claimable</th><th class="act"></th></tr></thead><tbody></tbody></table></div>
    <div class="pane" data-p="act"><table class="tb" id="pf-act"><thead><tr><th>Time</th><th>Side</th><th>Coin</th><th class="r">Amount</th><th class="r">Paid / received</th><th class="r">Value</th><th class="act">Tx</th></tr></thead><tbody></tbody></table></div>
  </div>
</div></div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js"></script><script src="/data.js"></script><script src="/avatar.js"></script><script src="/chain.js"></script><script src="/wallet.js"></script><script src="/core.js?v=6"></script><script src="/sp-profile.js?v=6"></script>
</body></html>
