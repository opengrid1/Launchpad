<style>
#pg-rewards .ph{padding:6px 0 4px;margin-bottom:14px}
#pg-rewards .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
#pg-rewards .kp .sbox{padding:16px 18px} #pg-rewards .kp .sbox .lab{display:flex;align-items:center;gap:8px;min-height:20px} #pg-rewards .kp .sbox .lab .soon{margin-left:auto} #pg-rewards .kp .sbox b{display:block;font:600 24px/1.1 var(--mono);margin-top:10px} #pg-rewards .kp .sbox i{display:block;font:normal 11.5px var(--mono);color:var(--fg-3);margin-top:6px}
#pg-rewards .grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;margin-top:12px;align-items:start}
#pg-rewards .col{display:flex;flex-direction:column;gap:12px}
#pg-rewards .hh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line);font:600 15px var(--disp)} #pg-rewards .hh .l{display:flex;align-items:center;gap:9px} #pg-rewards .hh .l svg{width:16px;height:16px;color:var(--fg-3)}
#pg-rewards .tb th:first-child,#pg-rewards .tb td:first-child{padding-left:16px} #pg-rewards .tb th:last-child,#pg-rewards .tb td:last-child{padding-right:16px}
#pg-rewards .tb td.act{text-align:right;width:1%;white-space:nowrap}
#pg-rewards .coin .lg{width:32px;height:32px}
#pg-rewards .gate{padding:28px 16px;text-align:center;color:var(--fg-3)} #pg-rewards .gate b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px} #pg-rewards .gate .btn{margin-top:14px}
#pg-rewards .soonb{padding:16px} #pg-rewards .soonb p{color:var(--fg-2);font-size:13px;line-height:1.55}
#pg-rewards .lnk{display:flex;align-items:center;gap:8px;margin-top:14px;height:40px;padding:0 6px 0 12px;border:1px dashed var(--line-3);border-radius:10px;background:var(--s2);font:12.5px var(--mono);color:var(--fg-3)} #pg-rewards .lnk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg-rewards .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px} #pg-rewards .mini .sbox{padding:8px 10px} #pg-rewards .mini .sbox b{font:600 14px var(--mono);margin-top:4px;color:var(--fg-3)}
#pg-rewards .steps{display:flex;flex-direction:column;gap:10px;margin-top:14px} #pg-rewards .steps div{display:flex;gap:10px;font-size:12.5px;color:var(--fg-2);line-height:1.5} #pg-rewards .steps em{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--s3);font:600 11px var(--mono);font-style:normal;color:var(--fg-3)}
#pg-rewards .burns{margin-top:12px} #pg-rewards .bt{display:flex;align-items:baseline;gap:10px;font:600 13px var(--mono);color:var(--fg-3)} #pg-rewards .bt b{font-size:15px;color:var(--fg)}
@media(max-width:1100px){#pg-rewards .kp{grid-template-columns:1fr 1fr} #pg-rewards .grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){#pg-rewards .kp{grid-template-columns:1fr 1fr;gap:8px} #pg-rewards .kp .sbox{padding:12px} #pg-rewards .kp .sbox b{font-size:18px} #pg-rewards .kp .sbox .lab .soon{display:none} #pg-rewards .lnk span{font-size:11.5px}}
</style>

</div></div></main>
