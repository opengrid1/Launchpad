<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pools | Equo</title><meta name="description" content="Every Equo Uniswap v4 pool with its liquidity, volume and fees.">
<link rel="icon" href="/img/favicon.svg?v=15" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=15"><meta name="theme-color" content="#000000">
<meta property="og:title" content="Pools | Equo"><meta property="og:image" content="/img/og.png?v=15"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=12">
<style>
#pg-pools .ph{padding:6px 0 4px;margin-bottom:14px}
#pg-pools .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} #pg-pools .kp .sbox{padding:16px 18px} #pg-pools .kp .sbox b{display:block;font:600 24px/1.1 var(--mono);margin-top:10px}
#pg-pools .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
#pg-pools .q{display:flex;align-items:center;gap:8px;height:34px;width:300px;max-width:100%;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--s1);color:var(--fg-3)} #pg-pools .q input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:12.5px}
#pg-pools .tb th:first-child,#pg-pools .tb td:first-child{padding-left:16px} #pg-pools .tb th:last-child,#pg-pools .tb td:last-child{padding-right:16px}
#pg-pools .pp{display:flex;align-items:center;gap:12px;min-width:0} #pg-pools .pp .ic2{position:relative;width:52px;height:34px;flex:none} #pg-pools .pp .ic2 img{position:absolute;top:0;width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--s3);border:2px solid var(--s1)} #pg-pools .pp .ic2 img+img{left:20px;background:#fff}
#pg-pools .pp b{display:block;font:600 14px var(--disp);white-space:nowrap} #pg-pools .pp small{display:block;font:11.5px var(--mono);color:var(--fg-3);margin-top:2px}
#pg-pools td.lk{white-space:nowrap;text-align:right} #pg-pools td.lk a{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line);font:500 12px var(--disp);color:var(--fg-2)} #pg-pools td.lk a:hover{color:var(--fg);border-color:var(--line-3)} #pg-pools td.lk a+a{margin-left:6px} #pg-pools td.lk svg{width:12px;height:12px}
#pg-pools .foot{padding:10px 16px;border-top:1px solid var(--line)}
@media(max-width:1000px){#pg-pools .kp{grid-template-columns:1fr 1fr}}
@media(max-width:560px){#pg-pools .kp{gap:8px} #pg-pools .kp .sbox{padding:12px} #pg-pools .kp .sbox b{font-size:18px} #pg-pools .q{width:100%}}
</style>
</head><body data-page="pools">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-pools">
  <div class="ph"><h1>Pools</h1></div>
  <div class="kp" id="pl-kpis"></div>
  <div class="bar"><div class="seg" id="pl-sort"><button data-k="liq" class="on">Liquidity</button><button data-k="vol">Volume 24h</button><button data-k="new">Newest</button></div><label class="q"><input id="pl-q" placeholder="Search coin or stock" autocomplete="off"></label></div>
  <section class="panel"><div style="overflow-x:auto"><table class="tb" id="pl-t"><thead><tr><th>Pool</th><th class="r">Fee</th><th class="r">Liquidity</th><th class="r">Volume 24h</th><th class="r hm">Fees 24h</th><th class="r hm">Trades</th><th class="r hm">Age</th><th></th></tr></thead><tbody></tbody></table></div><p class="hint foot">One Uniswap v4 pool per coin. Liquidity in every pool cannot be withdrawn.</p></section>
</div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js"></script><script src="/data.js"></script><script src="/avatar.js"></script><script src="/chain.js"></script><script src="/wallet.js"></script><script src="/core.js?v=12"></script><script src="/sp-pools.js?v=12"></script>
</body></html>
