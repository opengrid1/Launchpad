<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equo · Coins on every chain</title><meta name="description" content="Find and trade coins that live on up to nine chains at once, or launch your own.">
<link rel="icon" href="/img/favicon.svg?v=16" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=16"><meta name="theme-color" content="#000000">
<meta property="og:title" content="Equo"><meta property="og:description" content="Launch a coin on up to nine chains at once, at the same opening price."><meta property="og:image" content="/img/og.png?v=17"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Bowlby+One&family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=23">
<style>
/* Markets, bold: a big extruded headline over a glowing grid floor, a belt of featured coins, then a grid of square coin cards */
#sp-main{overflow-x:hidden;overflow-x:clip}
#pg-markets{--chunk:"Bowlby One","Inter Tight",Impact,sans-serif;--tight:"Inter Tight",Inter,sans-serif}
/* hero */
#pg-markets .hero{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:center;min-height:400px;padding:34px 0 40px;isolation:isolate}
#pg-markets .hero::before{content:"";position:absolute;inset:-40px -40vw -10px;z-index:-2;background:radial-gradient(40% 60% at 25% 40%,rgba(63,188,255,.18),transparent 70%),radial-gradient(35% 50% at 80% 55%,rgba(140,158,255,.14),transparent 70%)}
#pg-markets .floor{position:absolute;left:-40vw;right:-40vw;bottom:-10px;height:260px;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(63,188,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(63,188,255,.32) 1px,transparent 1px);background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 64px,0 0}}
@media(prefers-reduced-motion:reduce){#pg-markets .floor{animation:none}}
#pg-markets .ttl{margin:0;font:400 clamp(40px,4.9vw,76px)/.92 var(--chunk);letter-spacing:-.01em;text-transform:uppercase;color:#bfeaff;text-shadow:0 1px 0 #8fd8ff,0 3px 0 #3fbcff,0 5px 0 #2aa3ea,0 7px 0 #1b86cf,0 9px 0 #136cb0,0 11px 0 #0c548f,0 24px 30px rgba(0,0,0,.65)}
#pg-markets .ttl span{display:block;white-space:nowrap}
#pg-markets .ttl .b2{color:#fff;text-shadow:0 1px 0 #dfe6ff,0 3px 0 #8c9eff,0 5px 0 #7486f2,0 7px 0 #5e6fe0,0 9px 0 #4b5ac8,0 11px 0 #3a47aa,0 24px 30px rgba(0,0,0,.65)}
#pg-markets .sub{margin:22px 0 22px;max-width:440px;font:500 17px/1.5 var(--tight);color:var(--fg-2)}
#pg-markets .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pg-markets .acts .btn{height:46px;padding:0 20px;border-radius:999px;font:600 15px var(--tight)} #pg-markets .acts .btn.pri{box-shadow:0 10px 30px -10px rgba(63,188,255,.8)} #pg-markets .acts .btn svg{width:16px;height:16px}
#pg-markets .figs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
#pg-markets .figs span{display:inline-flex;align-items:baseline;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:rgba(10,10,12,.6);font:12px var(--mono);color:var(--fg-3);align-items:center} #pg-markets .figs b{font:600 13px var(--tight);color:var(--fg)}
/* featured belt */
#pg-markets .feat{position:relative;overflow:hidden;padding:14px 0 26px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#pg-markets .feat .belt{display:flex;gap:16px;width:max-content;animation:belt var(--dur,36s) linear infinite} #pg-markets .feat:hover .belt{animation-play-state:paused} #pg-markets .feat .belt.still{animation:none;width:auto;justify-content:center} #pg-markets .fc.slot{width:240px}
@keyframes belt{to{transform:translateX(-50%)}}
#pg-markets .fc{position:relative;display:block;width:210px;flex:none;border-radius:20px;overflow:hidden;background:var(--s2);border:1px solid var(--line-2);text-decoration:none;color:var(--fg);transform:rotate(var(--r,0deg));box-shadow:0 22px 40px -22px rgba(0,0,0,.9);transition:transform .2s}
#pg-markets .fc:hover{transform:rotate(0) translateY(-4px)}
#pg-markets .fc .im{position:relative;display:flex;align-items:center;justify-content:center;height:150px;background:#0b0b0d;overflow:hidden}
#pg-markets .fc .im img.lg{position:relative;width:76px;height:76px;border-radius:22px;object-fit:cover;margin-top:-26px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 26px -8px rgba(0,0,0,.8)}
#pg-markets .fc .tx{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#pg-markets .fc .tx b{display:block;font:700 15px var(--tight);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #pg-markets .fc .tx small{font:12px var(--mono);color:#cfd3db} #pg-markets .fc .tx .mc{font:800 15px var(--tight);white-space:nowrap}
#pg-markets .fc.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:150px;border-style:dashed;border-color:rgba(63,188,255,.45);background:repeating-linear-gradient(135deg,rgba(63,188,255,.06) 0 10px,transparent 10px 20px)}
#pg-markets .fc.slot i{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--ac-ink)} #pg-markets .fc.slot i svg{width:20px;height:20px}
#pg-markets .fc.slot b{font:700 15px var(--tight)} #pg-markets .fc.slot small{font:12px var(--mono);color:var(--fg-3)}
/* toolbar */
#pg-markets .tbar{position:sticky;top:var(--top,60px);z-index:20;display:flex;align-items:center;gap:8px;padding:12px 0;margin-top:6px;background:linear-gradient(var(--bg) 70%,transparent)}
#pg-markets .tbar .pls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none} #pg-markets .tbar .pls::-webkit-scrollbar{display:none}
#pg-markets .tp{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border:1px solid var(--line-2);border-radius:999px;background:var(--s1);color:var(--fg-2);font:600 14px var(--tight);white-space:nowrap;cursor:pointer;transition:all .15s}
#pg-markets .tp svg{width:15px;height:15px} #pg-markets .tp:hover{color:var(--fg);border-color:var(--line-3)}
#pg-markets .tp.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
#pg-markets .tp .n{font:500 11px var(--mono);opacity:.75} #pg-markets .tp img{width:18px;height:18px;border-radius:50%}
#pg-markets .tbar .q{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;width:280px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:var(--s1);color:var(--fg-3)} #pg-markets .tbar .q svg{width:15px;height:15px;flex:none} #pg-markets .tbar .q input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:14px var(--tight)}
/* coin grid */
#pg-markets .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:6px}
#pg-markets .cd{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--s1);overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
#pg-markets .cd:hover{transform:translateY(-4px);border-color:rgba(63,188,255,.55);box-shadow:0 18px 40px -22px rgba(63,188,255,.55)}
#pg-markets .cd .im{position:relative;display:flex;align-items:center;justify-content:center;height:128px;background:#0b0b0d;overflow:hidden}
#pg-markets .im .bg{position:absolute;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(26px) saturate(1.3);opacity:.55}
#pg-markets .cd .im img.lg{position:relative;width:72px;height:72px;border-radius:20px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 26px -8px rgba(0,0,0,.8);transition:transform .25s} #pg-markets .cd:hover .im img.lg{transform:scale(1.07) rotate(-3deg)}
#pg-markets .cd .chs2{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;padding:3px 6px 3px 3px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)} #pg-markets .cd .chs2 .chs img{box-shadow:0 0 0 1.5px #000}
#pg-markets .cd .st{position:absolute;right:8px;top:8px} #pg-markets .cd .st .wstar{background:rgba(0,0,0,.55);border-radius:50%;color:#fff}
#pg-markets .cd .rw{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.6);font:600 10.5px var(--tight);color:#ffd36b} #pg-markets .cd .rw svg{width:11px;height:11px}
#pg-markets .cd .bd{padding:11px 12px 12px}
#pg-markets .cd .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px} #pg-markets .cd .r1 b{font:700 14.5px var(--tight);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #pg-markets .cd .r1 .ch{font:600 11.5px var(--mono);white-space:nowrap}
#pg-markets .cd .tk{display:block;margin-top:2px;font:12px var(--mono);color:var(--fg-3)}
#pg-markets .cd .r2{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:10px} #pg-markets .cd .r2 .mc{font:800 19px var(--tight);letter-spacing:-.02em}
#pg-markets .cd .sp{width:64px;height:24px;flex:none} #pg-markets .cd .sp svg{width:100%;height:100%;display:block} #pg-markets .cd .sp path.a{display:none}
#pg-markets .cd .sp .spark .l{fill:none;stroke-width:2.2} #pg-markets .cd .sp .spark.up .l{stroke:var(--up)} #pg-markets .cd .sp .spark.dn .l{stroke:var(--dn)} #pg-markets .cd .sp .spark.flat .l{stroke:var(--fg-3)}
#pg-markets .empty{grid-column:1/-1}
#pg-markets .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px 0 10px;font:13px var(--mono);color:var(--fg-3)}
@media(max-width:1240px){#pg-markets .grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1000px){#pg-markets .hero{grid-template-columns:minmax(0,1fr);min-height:0;padding-top:22px;gap:6px} #pg-markets .grid{grid-template-columns:repeat(3,minmax(0,1fr))} #pg-markets .tbar .q{width:200px}}
@media(max-width:700px){#pg-markets .ttl{font-size:clamp(34px,10.2vw,48px)} #pg-markets .sub{font-size:15.5px;margin:18px 0} #pg-markets .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} #pg-markets .fc{width:160px;border-radius:16px} #pg-markets .fc .im,#pg-markets .fc.slot{height:124px} #pg-markets .fc .im img.lg{width:58px;height:58px;border-radius:17px} #pg-markets .cd .im{height:100px} #pg-markets .cd .im img.lg{width:56px;height:56px;border-radius:16px} #pg-markets .tbar{flex-wrap:wrap} #pg-markets .tbar .q{order:-1;width:100%;margin:0} #pg-markets .cd .r2 .mc{font-size:17px} #pg-markets .cd .sp{width:48px} #pg-markets .floor{height:180px}}
</style>
</head><body data-page="markets">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-markets">
  <section class="hero">
    <div class="floor" aria-hidden="true"></div>
    <div>
      <h1 class="ttl"><span>One launch.</span><span class="b2">Every chain.</span></h1>
      <p class="sub">Coins that open on up to nine chains at once, at the same price. Find one, or launch your own.</p>
      <div class="acts"><a class="btn pri" href="/launch" id="mk-launch">Launch a coin</a><a class="btn line" href="/docs/how-it-works">How it works</a></div>
      <div class="figs" id="mk-figs"></div>
    </div>
    <div class="feat" id="mk-feat"><div class="belt" id="mk-belt"></div></div>
  </section>
  <div class="tbar" id="mk-fbar">
    <div class="pls" id="mk-sort"><button class="tp on" data-s="trend"></button><button class="tp" data-s="mc"></button><button class="tp" data-s="vol"></button><button class="tp" data-s="new"></button><button class="tp" id="mk-watch"></button><button class="tp" id="mk-chain"></button></div>
    <label class="q"><span id="mk-qi"></span><input id="mk-q" placeholder="Search coins, tickers or addresses" autocomplete="off"></label>
  </div>
  <div class="grid" id="mk-cards"></div>
  <div class="pager" id="mk-pager"></div>
</div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js?v=10"></script><script src="/data.js?v=2"></script><script src="/avatar.js"></script><script src="/chain.js?v=21"></script><script src="/equo.js?v=5"></script><script src="/api.js?v=3"></script><script src="/preview.js?v=5"></script><script src="/wallet.js"></script><script src="/core.js?v=35"></script><script src="/sp-home.js?v=25"></script>
</body></html>
