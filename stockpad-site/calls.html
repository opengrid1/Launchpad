<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calls | Equo</title><meta name="description" content="Calls on Equo coins, with how each one did since it was posted.">
<link rel="icon" href="/img/favicon.svg?v=16" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=16"><meta name="theme-color" content="#000000">
<meta property="og:title" content="Calls | Equo"><meta property="og:image" content="/img/og.png?v=16"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css?v=19">
<style>
#pg-calls .ph{padding:6px 0 4px;margin-bottom:14px}
#pg-calls .grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
/* composer */
#pg-calls .cmp{padding:14px 16px}
#pg-calls .cmp .r1{display:flex;gap:12px}
#pg-calls .cmp .me{width:36px;height:36px;border-radius:10px;overflow:hidden;flex:none;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--fg-3)} #pg-calls .cmp .me svg{display:block}
#pg-calls .cmp textarea{flex:1;min-height:76px;border:0;background:none;outline:0;resize:none;font:14px/1.5 var(--sans);color:var(--fg);padding:7px 0 0}
#pg-calls .cmp textarea::placeholder{color:var(--fg-3)}
#pg-calls .cmp .r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
#pg-calls .pick{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 6px;border:1px solid var(--line-2);border-radius:9px;background:var(--s2);font:600 12.5px var(--disp)} #pg-calls .pick img{width:22px;height:22px;border-radius:50%;background:var(--s3)} #pg-calls .pick .ph0{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-3)} #pg-calls .pick svg{width:13px;height:13px;color:var(--fg-3)}
#pg-calls .bb button{height:32px} #pg-calls .bb button svg{width:14px;height:14px} #pg-calls .bb button.on[data-s="bull"]{border-color:var(--up);color:var(--up);background:var(--up-dim)} #pg-calls .bb button.on[data-s="bear"]{border-color:var(--dn);color:var(--dn);background:var(--dn-dim)}
#pg-calls .cmp .cnt{margin-left:auto;font:11.5px var(--mono);color:var(--fg-3)}
#pg-calls .cmp .note{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;color:var(--fg-2)} #pg-calls .cmp .note svg{color:var(--ac);flex:none}
/* feed */
#pg-calls .fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
#pg-calls .feed{display:flex;flex-direction:column;gap:10px}
#pg-calls .call{padding:14px 16px}
#pg-calls .call .chd{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--fg-3)} #pg-calls .call .chd .w a{font-size:12.5px;color:var(--fg)} #pg-calls .call .chd .sd{margin-left:auto}
#pg-calls .sd{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase} #pg-calls .sd svg{width:12px;height:12px} #pg-calls .sd.bull{color:var(--up);background:var(--up-dim)} #pg-calls .sd.bear{color:var(--dn);background:var(--dn-dim)}
#pg-calls .call .ct{margin:10px 0 12px;font-size:14px;line-height:1.55;color:var(--fg);white-space:pre-wrap;word-break:break-word}
#pg-calls .call .cc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s2)} #pg-calls .call .cc:hover{border-color:var(--line-3)}
#pg-calls .call .cc .lg{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--s3)} #pg-calls .call .cc .av2 .stb{width:16px;height:16px}
#pg-calls .call .cc b{display:block;font:600 14px var(--disp)} #pg-calls .call .cc small{display:block;font:11.5px var(--mono);color:var(--fg-3);margin-top:2px}
#pg-calls .call .cc .x{text-align:right} #pg-calls .call .cc .x b{font:700 22px/1 var(--disp)} #pg-calls .call .cc .x small{margin-top:5px}
#pg-calls .call .cf{display:flex;gap:4px;margin-top:10px} #pg-calls .call .cf button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font:12px var(--mono);color:var(--fg-3)} #pg-calls .call .cf button:hover{background:var(--s3);color:var(--fg)} #pg-calls .call .cf svg{width:14px;height:14px}
#pg-calls .ex{position:relative;border:1px dashed var(--line-3);border-radius:var(--r-xl);padding:26px 16px 16px;opacity:.85} #pg-calls .ex .exl{position:absolute;top:-10px;left:14px;padding:0 8px;background:var(--bg);font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
#pg-calls .ex .call{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-xl)}
#pg-calls .emp{padding:30px 20px 22px;text-align:center;color:var(--fg-3)} #pg-calls .emp b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
/* side */
#pg-calls .aside{display:flex;flex-direction:column;gap:12px}
#pg-calls .aside .hh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font:600 14px var(--disp)}
#pg-calls .tr{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)} #pg-calls .tr:last-child{border-bottom:0} #pg-calls .tr:hover{background:var(--s2)}
#pg-calls .tr .i{font:12px var(--mono);color:var(--fg-3)} #pg-calls .tr .coin .lg{width:30px;height:30px} #pg-calls .tr .coin b{font-size:13px} #pg-calls .tr .coin small{font-size:11px}
#pg-calls .tr .v{text-align:right;font:500 12.5px var(--mono)} #pg-calls .tr .v small{display:block;font-size:11px;color:var(--fg-3);font-weight:400}
#pg-calls .aside .soonp{padding:16px;color:var(--fg-3);font-size:12.5px;line-height:1.55} #pg-calls .aside .soonp b{color:var(--fg);font-weight:600}
#pg-calls .rk{display:flex;flex-direction:column;gap:8px;margin-top:12px} #pg-calls .rk div{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;background:var(--s2);border:1px solid var(--line)} #pg-calls .rk i{font:11px var(--mono);font-style:normal;color:var(--fg-3);width:12px} #pg-calls .rk span{flex:1;height:8px;border-radius:4px;background:var(--s4)} #pg-calls .rk em{width:42px;height:8px;border-radius:4px;background:var(--s4)}
@media(max-width:1000px){#pg-calls .grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){#pg-calls .call .cc{grid-template-columns:auto minmax(0,1fr)} #pg-calls .call .cc .x{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;text-align:left;padding-top:8px;border-top:1px solid var(--line)} #pg-calls .cmp .cnt{display:none} #pg-calls .cmp #cl-post{margin-left:auto}}
</style>
</head><body data-page="calls">
<header id="sp-top"></header><div id="sp-tape"></div>
<main id="sp-main"><div class="wrap"><div id="pg-calls">
  <div class="ph"><h1>Calls</h1></div>
  <div class="grid2">
    <div>
      <section class="panel cmp" id="cl-cmp">
        <div class="r1"><span class="me" id="cl-me"></span><textarea id="cl-text" maxlength="280" placeholder="What's your call?"></textarea></div>
        <div class="r2"><button type="button" class="pick" id="cl-pick"><span class="ph0"></span><span>Pick a coin</span></button><div class="seg bb" id="cl-side"><button type="button" data-s="bull" class="on"></button><button type="button" data-s="bear"></button></div><span class="cnt" id="cl-cnt">0 / 280</span><button type="button" class="btn pri" id="cl-post" disabled>Post call</button></div>
        <div class="note" id="cl-note"></div>
      </section>
      <div class="fbar"><div class="seg" id="cl-sort"><button data-k="new" class="on">Latest</button><button data-k="top">Best since call</button><button data-k="watch">Watchlist</button></div></div>
      <div class="feed" id="cl-feed"></div>
    </div>
    <aside class="aside">
      <section class="panel"><div class="hh"><span>Trending</span><span class="num muted" style="font:11px var(--mono)">24h volume</span></div><div id="cl-trend"></div></section>
      <section class="panel"><div class="hh"><span>Top callers</span><span class="soon">Soon</span></div><div class="soonp" id="cl-callers"></div></section>
    </aside>
  </div>
</div></div></main>
<footer id="sp-foot"></footer>
<script src="/config.js?v=6"></script><script src="/data.js?v=2"></script><script src="/avatar.js"></script><script src="/chain.js?v=21"></script><script src="/equo.js?v=5"></script><script src="/preview.js?v=3"></script><script src="/wallet.js"></script><script src="/core.js?v=24"></script><script src="/sp-calls.js?v=18"></script>
</body></html>
